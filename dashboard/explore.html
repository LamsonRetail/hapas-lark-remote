<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lark MCP remote — biểu đồ</title>

<style>/**
 * Giao diện dùng chung cho MỌI trang của dashboard.
 *
 * build.mjs nhúng thẳng file này vào chỗ đánh dấu /*__CSS__*/ của từng
 * template. Nhúng chứ không <link>: bản preview.html phải mở được như một file
 * rời (không máy chủ, không thư mục kèm theo), mà stylesheet ngoài thì mở kiểu
 * đó là mất sạch giao diện.
 *
 * Sửa ở đây là cả hai trang đổi theo — đó là điểm của việc tách file.
 */

  /* Nền phải TÁCH hẳn khỏi thẻ. Bản đầu dùng #eef1f5 với #fbfcfd — chênh nhau
     quá ít nên cả trang đọc thành một mảng trắng phẳng không thấy đâu là khối. */
  :root {
    color-scheme: light;
    --plane: #eef1f6; --card: #ffffff; --raise: #f3f5f9; --sunken: #f5f7fa;
    --ink: #0f172a; --ink-2: #475569; --ink-3: #94a3b8;
    --grid: #eef1f5; --rule: #dbe1ea; --hairline: rgba(15, 23, 42, .07);
    --series-1: #4f46e5; --wash: rgba(79, 70, 229, .09);
    --good: #16a34a; --warning: #d99408; --serious: #ea6c3a; --critical: #dc2626;
    --chip: rgba(15, 23, 42, .05);
    --elev: 0 1px 2px rgba(15, 23, 42, .05), 0 2px 8px rgba(15, 23, 42, .05);
    --elev-hi: 0 8px 24px rgba(15, 23, 42, .11);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane: #0a0c10; --card: #15181e; --raise: #1c2128; --sunken: #12151a;
      --ink: #f1f5f9; --ink-2: #aab4c2; --ink-3: #6b7484;
      --grid: #23272f; --rule: #313742; --hairline: rgba(255, 255, 255, .08);
      --series-1: #7c7cf5; --wash: rgba(124, 124, 245, .13);
      --chip: rgba(255, 255, 255, .06);
      --elev: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
      --elev-hi: 0 10px 28px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0a0c10; --card: #15181e; --raise: #1c2128; --sunken: #12151a;
    --ink: #f1f5f9; --ink-2: #aab4c2; --ink-3: #6b7484;
    --grid: #23272f; --rule: #313742; --hairline: rgba(255, 255, 255, .08);
    --series-1: #7c7cf5; --wash: rgba(124, 124, 245, .13);
    --chip: rgba(255, 255, 255, .06);
    --elev: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
    --elev-hi: 0 10px 28px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; }
  /* 1200px trên màn 1440+ để lại hai dải trắng rộng bằng cả một cột bảng, mà
     bảng chỗ cắm bên trong thì phải cuộn ngang. Nới trần và cho padding co
     giãn theo màn: rộng thì dùng hết, hẹp thì vẫn không dính mép. */
  .wrap { max-width: 1560px; margin: 0 auto; padding: 34px clamp(16px, 3vw, 40px) 72px;
    display: flex; flex-direction: column; gap: 18px; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 26px; font-weight: 680; margin: 0; letter-spacing: -.02em; }

  /* Điều hướng giữa bảng vận hành và trang biểu đồ */
  .nav { display: flex; gap: 4px; margin-top: 9px; }
  .nav a { font-size: 13px; font-weight: 600; text-decoration: none; padding: 5px 12px; border-radius: 999px;
    color: var(--ink-2); background: transparent; border: 1px solid transparent; }
  .nav a:hover { background: var(--chip); color: var(--ink); }
  .nav a[aria-current] { background: var(--wash); color: color-mix(in srgb, var(--series-1) 70%, var(--ink));
    border-color: color-mix(in srgb, var(--series-1) 26%, transparent); }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .clock { display: inline-flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 700;
    letter-spacing: .01em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .clock::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); animation: livepulse 2.2s infinite; }
  @keyframes livepulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .clock::before { animation: none; } }

  /* Nhãn tầng — mốc phân cấp CAO hơn tiêu đề thẻ, để mắt biết đang ở khu nào */
  .zone { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); margin: 14px 2px 2px; display: flex; align-items: center; gap: 10px; }
  .zone::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .zone .n { color: var(--ink-3); font-weight: 600; }

  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px; box-shadow: var(--elev);
    transition: box-shadow .16s ease, transform .16s ease; }
  .pad { padding: 16px 18px; }
  h2 { font-size: 11px; font-weight: 680; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 13px; display: flex; align-items: baseline; gap: 7px; }
  h2 .n { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: 0; text-transform: none; }

  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .g4 { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 920px) { .g2 { grid-template-columns: 1fr; } .g4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .g4 { grid-template-columns: 1fr; } }

  /* ── Phán quyết + dải trạng thái (Tầng 1) ── */
  .verdict { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; font-size: 13.5px;
    padding: 8px 16px 8px 13px; border-radius: 999px;
    background: color-mix(in srgb, var(--sev) 12%, var(--card));
    border: 1px solid color-mix(in srgb, var(--sev) 30%, transparent);
    color: color-mix(in srgb, var(--sev) 55%, var(--ink)); box-shadow: var(--elev); }
  .verdict .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sev);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--sev) 22%, transparent); }
  .statusbar { display: flex; flex-wrap: wrap; padding: 0; overflow: hidden; }
  .statusbar .item { flex: 1 1 220px; display: flex; gap: 12px; align-items: flex-start; padding: 15px 18px;
    background: color-mix(in srgb, var(--sev) 4%, var(--card));
    border-left: 3px solid var(--sev); border-top: 1px solid var(--hairline); }
  .statusbar .item:first-child { border-top: 0; }
  @media (min-width: 720px) { .statusbar .item { border-top: 0; border-right: 1px solid var(--hairline); }
    .statusbar .item:last-child { border-right: 0; } }
  .statusbar .ic { color: var(--sev); font-size: 12px; line-height: 1.7; }
  .statusbar .k { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
  .statusbar .v { font-size: 16px; font-weight: 660; letter-spacing: -.01em; margin-top: 1px; }
  .statusbar .d { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* ── KPI (Tầng 2) ── */
  .kpi { padding: 15px 17px; display: flex; flex-direction: column; }
  .kpi:hover { box-shadow: var(--elev-hi); transform: translateY(-2px); }
  .kpi .k { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
  .kpi .v { font-size: 27px; font-weight: 680; letter-spacing: -.025em; line-height: 1.1; margin-top: 4px; }
  .kpi .d { font-size: 11.5px; color: var(--ink-3); margin-top: auto; padding-top: 4px; }
  .kpi.hero { background:
      linear-gradient(150deg, color-mix(in srgb, var(--series-1) 13%, var(--card)), color-mix(in srgb, var(--series-1) 3%, var(--card)));
    border-color: color-mix(in srgb, var(--series-1) 22%, transparent); }
  .kpi.hero .v { font-size: 34px; color: color-mix(in srgb, var(--series-1) 72%, var(--ink)); }
  .kpi .v small { font-size: 15px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }

  /* Ô bảng trước đây chỉ có đệm PHẢI (`7px 10px 7px 0`), nên cột này chạm sát
     chữ cột kia — ở bảng chỗ cắm 7 cột thì đọc thành một dải chữ liền. Đệm đều
     hai bên, và `.scroll table` có bề rộng tối thiểu để màn hẹp thì cuộn ngang
     chứ không bóp các cột dí vào nhau. */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink-3); padding: 0 14px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.nw, th.nw { white-space: nowrap; }
  tbody tr:hover td { background: var(--sunken); }
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 560px; }
  .scroll table.wide { min-width: 940px; }
  .dim { color: var(--ink-2); }

  /* Nhãn phụ dưới giá trị chính trong một ô — client_id dưới tên ứng dụng.
     Xuống dòng riêng thay vì nối đuôi: chuỗi băm 22 ký tự đứng cạnh chữ
     "Claude" thì mắt không tách nổi đâu là tên app, đâu là mã. */
  .sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px;
    max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Nút thao tác trong bảng — mờ lúc bình thường, rõ khi rê vào đúng dòng, để
     một bảng dùng để ĐỌC không biến thành bãi nút bấm. */
  .btn { font: inherit; font-size: 12px; font-weight: 600; line-height: 1; cursor: pointer;
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--hairline);
    background: var(--card); color: var(--ink-2); }
  .btn:hover { background: var(--raise); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.danger:hover { border-color: color-mix(in srgb, var(--critical) 40%, transparent);
    color: var(--critical); background: color-mix(in srgb, var(--critical) 8%, var(--card)); }
  .btn.ghost { border-color: transparent; background: transparent; }
  td .btn { opacity: .35; transition: opacity .14s ease; }
  tbody tr:hover td .btn, td .btn:focus-visible { opacity: 1; }
  @media (hover: none) { td .btn { opacity: 1; } }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sev, var(--ink-3)); flex: none; }
  .tag { font-size: 11px; padding: 3px 7px; border-radius: 5px; background: var(--chip); color: var(--ink-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .legend { display: flex; gap: 13px; margin-bottom: 8px; font-size: 11.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* Trạng thái rỗng — nói rõ "không có gì để xử lý" thay vì để trống khó hiểu */
  .ok-empty { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 13px; padding: 4px 0 2px; }
  .ok-empty .ic { color: var(--good); font-size: 14px; }

  #tip { position: fixed; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 90ms;
    background: var(--ink); color: var(--card); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 250px; }
  #tip.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #tip { transition: none; } .card { transition: none; } }

/* ── Ô điều khiển (trang Biểu đồ) ────────────────────────────────────────
   Thanh chọn nằm NGANG và luôn hiện, không giấu sau menu: cả trang chỉ có một
   việc là "đổi cách nhìn", giấu chính cái cần bấm đi thì trang mất lý do tồn tại. */
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 11px; font-weight: 680; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.field select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 9px; padding: 9px 34px 9px 12px; cursor: pointer;
  /* Mũi tên vẽ bằng gradient — không nhúng ảnh, không gọi ra ngoài (CSP của
     Vercel chặn host ngoài, mà bản preview thì không có mạng để mà gọi). */
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.field select:hover { border-color: var(--ink-3); }
.field select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

/* Nhóm nút một-lựa-chọn — dùng cho kiểu biểu đồ và cửa sổ ngày, nơi chỉ có
   2–3 giá trị. Bày hết ra rẻ hơn một lần bấm để mở danh sách. */
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  padding: 6px 13px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-2); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--elev); }

.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; padding-bottom: 9px; }
.chk input { width: 16px; height: 16px; accent-color: var(--series-1); cursor: pointer; }

.spacer { flex: 1 1 auto; }

/* Dải tóm tắt dưới thanh chọn: nói rõ đang nhìn bao nhiêu dòng, trong bao lâu.
   Không có nó thì một biểu đồ trống đọc thành "hệ thống chết" thay vì
   "khoảng thời gian này không có dữ liệu". */
.summary { display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: var(--ink-2); }
.summary b { color: var(--ink); font-weight: 660; font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Biểu đồ</h1>
      <nav class="nav">
        <a href="/">Bảng vận hành</a>
        <a href="/explore" aria-current="page">Biểu đồ</a>
      </nav>
    </div>
    <div class="head-right">
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <section class="card pad">
    <div class="controls">
      <div class="field">
        <label for="f-dim">Nhóm theo cột</label>
        <select id="f-dim"></select>
      </div>
      <div class="field">
        <label for="f-measure">Đo bằng</label>
        <select id="f-measure"></select>
      </div>
      <div class="field">
        <label>Khoảng thời gian</label>
        <div class="seg" id="f-days"></div>
      </div>
      <div class="field">
        <label>Kiểu biểu đồ</label>
        <div class="seg" id="f-kind"></div>
      </div>
      <div class="field">
        <label for="f-source">Nguồn</label>
        <select id="f-source">
          <option value="url">Remote (url)</option>
          <option value="zip">Desktop (zip)</option>
          <option value="all">Cả hai</option>
        </select>
      </div>
      <label class="chk" for="f-include">
        <input type="checkbox" id="f-include">
        Gồm cả đăng nhập &amp; canary
      </label>
    </div>
  </section>

  <section class="card pad">
    <h2 id="chart-title">Biểu đồ</h2>
    <div class="summary" id="summary"></div>
    <div id="chart" style="margin-top:14px"></div>
  </section>

  <section class="card pad">
    <h2>
      Số liệu <span class="n" id="rows-n"></span>
      <span class="spacer"></span>
      <button class="btn" id="f-csv">Tải CSV</button>
    </h2>
    <div class="scroll"><table class="wide" id="t-rows"></table></div>
  </section>
</div>

<div id="tip" role="status"></div>

<script>
  /** Một lỗi JS bất kỳ là trắng nguyên trang — bắt ra màn hình để còn biết hỏng ở đâu. */
  addEventListener('error', (e) => {
    const w = document.querySelector('.wrap');
    if (!w) return;
    w.insertAdjacentHTML('afterbegin',
      '<div class="card pad" style="border-color: var(--critical)">' +
      '<h2 style="color: var(--critical)">Trang dựng lỗi</h2>' +
      '<div class="mono" style="font-size: 12px">' + String(e.message || e.error || 'không rõ') + '</div></div>');
  });

  // Danh mục cột/phép đo do build.mjs nướng vào từ explore-schema.mjs — trang
  // KHÔNG tự khai lại, nếu không nó sẽ chào một lựa chọn mà máy chủ từ chối.
  const SCHEMA = {"DIMENSIONS":[{"key":"day","label":"Ngày","col":null,"time":true},{"key":"hour","label":"Giờ trong ngày","col":null,"time":true},{"key":"user_name","label":"Người gọi","col":"user_name"},{"key":"tool_name","label":"Tool","col":"tool_name","mono":true},{"key":"client_id","label":"Chỗ cắm","col":"client_id","mono":true},{"key":"lark_code","label":"Mã lỗi Lark","col":"lark_code","mono":true},{"key":"ok","label":"Kết quả","col":"ok"},{"key":"source","label":"Nguồn (url / zip)","col":"source"}],"MEASURES":[{"key":"calls","label":"Lượt gọi","fmt":"int"},{"key":"errors","label":"Số lỗi","fmt":"int","zeroable":true},{"key":"errRate","label":"Tỉ lệ lỗi","fmt":"pct","zeroable":true},{"key":"p50","label":"Thời gian trung vị","fmt":"ms"},{"key":"p95","label":"Thời gian p95","fmt":"ms"},{"key":"users","label":"Số người khác nhau","fmt":"int"},{"key":"tools","label":"Số tool khác nhau","fmt":"int"}],"WINDOWS":[7,30,90]};
  // Có số nướng sẵn = bản xem trước tĩnh (không backend) → vẽ một lần, khoá ô chọn.
  const BAKED = /*__DATA__*/null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = (n) => new Intl.NumberFormat('vi-VN').format(n);
  const dt = (s) => (s ? new Date(s).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
  // Locale vi ngăn nghìn bằng dấu chấm: nf(1274)+' ms' đọc thành 1,274 ms.
  const ms = (v) => (v == null ? '—' : v < 1000 ? v + ' ms' : (v / 1000).toFixed(2).replace('.', ',') + ' s');
  const cut = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s));

  const DIMS = SCHEMA.DIMENSIONS, MEASURES = SCHEMA.MEASURES, WINDOWS = SCHEMA.WINDOWS;
  const dimOf = (k) => DIMS.find((d) => d.key === k) || DIMS[0];

  /**
   * Đếm số giá trị khác nhau của CHÍNH cột đang nhóm thì nhóm nào cũng ra 1.
   * Một cột toàn số 1 không sai, nhưng nó chiếm chỗ và bắt người đọc dừng lại
   * để hiểu ra rằng nó không nói gì — bỏ hẳn khỏi ô chọn lẫn bảng.
   */
  const REDUNDANT = { user_name: 'users', tool_name: 'tools' };
  const measuresFor = (dimKey) => MEASURES.filter((m) => m.key !== REDUNDANT[dimKey]);
  const measureOf = (k) => measuresFor(state.dim).find((m) => m.key === k) || MEASURES[0];

  const KINDS = [
    { key: 'hbar', label: 'Thanh ngang' },
    { key: 'bar', label: 'Cột' },
    { key: 'line', label: 'Đường' },
  ];

  const fmt = (v, f) => {
    if (v == null) return '—';
    if (f === 'ms') return ms(v);
    if (f === 'pct') return String(v).replace('.', ',') + '%';
    return nf(v);
  };

  /** Trục tròn số: 2–5 vạch, không ra mấy con lẻ như 1.372,4. */
  function scale(max) {
    if (!(max > 0)) return { top: 1, step: 1 };
    const mag = Math.pow(10, Math.floor(Math.log10(max)));
    const r = max / mag;
    const step = r > 5 ? mag : r > 2 ? mag / 2 : mag / 5;
    return { top: Math.ceil(max / step) * step, step };
  }

  const tip = $('tip');
  function bindTip(el, html) {
    el.setAttribute('tabindex', '0');
    const show = (e) => {
      tip.innerHTML = html; tip.classList.add('on');
      const r = el.getBoundingClientRect();
      tip.style.left = Math.min(innerWidth - 260, Math.max(8, (e && e.clientX ? e.clientX : r.left + r.width / 2) - 60)) + 'px';
      tip.style.top = Math.max(8, r.top - 52) + 'px';
    };
    const hide = () => tip.classList.remove('on');
    el.addEventListener('mouseenter', show); el.addEventListener('mousemove', show);
    el.addEventListener('mouseleave', hide); el.addEventListener('focus', show); el.addEventListener('blur', hide);
  }

  // ── Trạng thái, đồng bộ với thanh địa chỉ ──────────────────────────────
  // Để trên URL chứ không localStorage: một cách nhìn đáng chú ý thì phải gửi
  // được cho người khác bằng cách dán link, không phải mô tả bằng lời.
  const DEFAULTS = { dim: 'tool_name', measure: 'calls', days: 30, kind: '', source: 'url', include: 'tools' };
  const state = { ...DEFAULTS };
  (function readUrl() {
    const q = new URLSearchParams(location.search);
    for (const k of Object.keys(DEFAULTS)) if (q.get(k)) state[k] = q.get(k);
    state.days = WINDOWS.includes(+state.days) ? +state.days : 30;
  })();

  /** Chưa chọn kiểu thì đoán theo cột: trục thời gian vẽ đường, phân loại vẽ thanh. */
  const kindNow = () => state.kind || (dimOf(state.dim).time ? 'line' : 'hbar');

  function pushUrl() {
    const q = new URLSearchParams();
    for (const [k, v] of Object.entries(state)) if (v && v !== DEFAULTS[k]) q.set(k, v);
    const s = q.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }

  // ── Thanh chọn ─────────────────────────────────────────────────────────
  function buildControls() {
    $('f-dim').innerHTML = DIMS.map((d) => `<option value="${esc(d.key)}">${esc(d.label)}</option>`).join('');
    $('f-days').innerHTML = WINDOWS.map((d) => `<button type="button" data-v="${d}">${d} ngày</button>`).join('');
    $('f-kind').innerHTML = KINDS.map((k) => `<button type="button" data-v="${esc(k.key)}">${esc(k.label)}</button>`).join('');

    $('f-source').value = state.source;
    $('f-include').checked = state.include === 'all';

    // Đổi cột / khoảng / nguồn → phải gọi lại máy chủ. Đổi phép đo / kiểu vẽ →
    // cùng một tập số, chỉ vẽ lại. Tách hai nhóm để thao tác thứ hai tức thì.
    const reload = (patch) => { Object.assign(state, patch); pushUrl(); load(); };
    const redraw = (patch) => { Object.assign(state, patch); pushUrl(); draw(); };

    $('f-dim').addEventListener('change', (e) => reload({ dim: e.target.value, kind: '' }));
    $('f-source').addEventListener('change', (e) => reload({ source: e.target.value }));
    $('f-include').addEventListener('change', (e) => reload({ include: e.target.checked ? 'all' : 'tools' }));
    $('f-days').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) reload({ days: +b.dataset.v }); });
    $('f-measure').addEventListener('change', (e) => redraw({ measure: e.target.value }));
    $('f-kind').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) redraw({ kind: b.dataset.v }); });

    $('f-csv').addEventListener('click', downloadCsv);
  }

  function syncControls() {
    // Danh sách phép đo dựng lại theo cột đang nhóm, nên phải vẽ lại ô chọn
    // mỗi lần — không thì mục vừa bị loại vẫn nằm đó và chọn được.
    const av = measuresFor(state.dim);
    if (!av.some((m) => m.key === state.measure)) state.measure = 'calls';
    $('f-measure').innerHTML = av.map((m) => `<option value="${esc(m.key)}">${esc(m.label)}</option>`).join('');
    $('f-dim').value = state.dim;
    $('f-measure').value = state.measure;
    for (const b of $('f-days').children) b.setAttribute('aria-pressed', String(+b.dataset.v === state.days));
    for (const b of $('f-kind').children) b.setAttribute('aria-pressed', String(b.dataset.v === kindNow()));
  }

  // ── Vẽ ─────────────────────────────────────────────────────────────────
  let DATA = null;

  // Trần số nhóm vẽ ra. 60 tool hay 40 người trên một biểu đồ là 40 nhãn không
  // đọc nổi; phần còn lại vẫn nằm đủ ở bảng bên dưới, và dòng tóm tắt nói rõ
  // đã cắt bao nhiêu — cắt âm thầm thì biểu đồ trông như đã bày hết.
  const MAX_BARS = 25;

  function draw() {
    if (!DATA) return;
    syncControls();

    const dim = dimOf(state.dim), me = measureOf(state.measure), kind = kindNow();
    const val = (r) => r[me.key];
    // p50/p95 null nghĩa là không có mẫu thời gian nào — bỏ hẳn khỏi biểu đồ,
    // vẽ thành 0 sẽ đọc thành "nhanh tức thì".
    let rows = DATA.rows.filter((r) => val(r) != null && (me.zeroable || val(r) > 0));

    // Trục thời gian giữ nguyên thứ tự; phân loại thì xếp theo chính phép đo
    // đang xem — chọn "tỉ lệ lỗi" mà vẫn xếp theo lượt gọi là trả lời câu khác.
    if (!dim.time) rows = rows.slice().sort((a, b) => val(b) - val(a));
    const shown = rows.slice(0, MAX_BARS);
    const cutN = rows.length - shown.length;

    $('chart-title').textContent = `${me.label} theo ${dim.label.toLowerCase()}`;
    $('summary').innerHTML = [
      `<span>Nguồn dữ liệu <b>${nf(DATA.total)}</b> lượt gọi</span>`,
      `<span>Gộp thành <b>${nf(DATA.groups)}</b> nhóm</span>`,
      `<span>Cửa sổ <b>${state.days}</b> ngày</span>`,
      cutN > 0 ? `<span>Biểu đồ hiện <b>${nf(shown.length)}</b> nhóm lớn nhất, còn <b>${nf(cutN)}</b> ở bảng dưới</span>` : '',
    ].filter(Boolean).join('');

    $('chart').innerHTML = !shown.length
      ? '<div class="ok-empty dim">Không có dữ liệu nào trong khoảng này.</div>'
      : kind === 'hbar' ? hbar(shown, me) : kind === 'bar' ? vbar(shown, me) : line(shown, me);

    $('chart').querySelectorAll('[data-i]').forEach((el) => {
      const r = shown[+el.dataset.i];
      bindTip(el, `<b>${esc(cut(r.key, 40))}</b><br>${esc(me.label)}: ${esc(fmt(r[me.key], me.fmt))}<br>
        ${nf(r.calls)} lượt · ${nf(r.errors)} lỗi (${String(r.errRate).replace('.', ',')}%)<br>p95 ${ms(r.p95)}`);
    });

    drawTable(rows, me, dim);
  }

  /** Thanh ngang — mặc định cho cột phân loại, vì tên người và tên tool đều dài. */
  function hbar(rows, me) {
    const W = 1000, rowH = 30, LW = 268, PR = 92, H = rows.length * rowH + 6;
    const max = Math.max(...rows.map((r) => r[me.key]), 0);
    const track = W - LW - PR;
    let s = '';
    rows.forEach((r, i) => {
      const y = i * rowH + 5;
      const w = max > 0 ? Math.max(2, (r[me.key] / max) * track) : 2;
      s += `<text x="0" y="${y + 14}" font-size="13" fill="var(--ink-2)">${esc(cut(r.key, 34))}</text>`;
      s += `<rect data-i="${i}" x="${LW}" y="${y + 3}" width="${w}" height="16" rx="5" fill="var(--series-1)"/>`;
      s += `<rect x="${LW}" y="${y + 3}" width="${Math.min(w, 5)}" height="16" fill="var(--series-1)"/>`;
      s += `<text x="${LW + w + 9}" y="${y + 15}" font-size="12.5" font-weight="600" fill="var(--ink-2)" class="num">${esc(fmt(r[me.key], me.fmt))}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(me.label)}">${s}</svg>`;
  }

  /** Cột dọc — hợp với ngày/giờ, ít nhóm. */
  function vbar(rows, me) {
    const H = 300, PL = 62, PR = 10, PT = 20, PB = 46;
    const band = Math.max(34, Math.min(90, 900 / rows.length));
    const W = Math.max(360, PL + band * rows.length + PR);
    const { top, step } = scale(Math.max(...rows.map((r) => r[me.key]), 0));
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const cx = (i) => PL + band * (i + 0.5);
    const bw = Math.min(38, band * 0.55);

    let s = '';
    for (let t = 0; t <= top + 1e-9; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>`;
      s += `<text x="${PL - 9}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${esc(fmt(t, me.fmt))}</text>`;
    }
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)"/>`;
    rows.forEach((r, i) => {
      const yT = y(r[me.key]), h = Math.max(2, y(0) - yT);
      s += `<rect data-i="${i}" x="${cx(i) - bw / 2}" y="${yT}" width="${bw}" height="${h}" rx="5" fill="var(--series-1)"/>`;
      s += `<rect x="${cx(i) - bw / 2}" y="${yT + Math.max(0, h - 5)}" width="${bw}" height="5" fill="var(--series-1)"/>`;
      // Nhãn trục X xoay 40° khi tên dài — nằm ngang thì chúng chồng lên nhau.
      const lb = esc(cut(r.key, 16));
      s += String(r.key).length > 6
        ? `<text x="${cx(i)}" y="${H - PB + 18}" font-size="11" fill="var(--ink-3)" text-anchor="end" transform="rotate(-40 ${cx(i)} ${H - PB + 18})">${lb}</text>`
        : `<text x="${cx(i)}" y="${H - PB + 18}" font-size="11.5" fill="var(--ink-3)" text-anchor="middle">${lb}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${esc(me.label)}" style="max-width:${W}px">${s}</svg>`;
  }

  /** Đường — mặc định cho trục thời gian, vì hình dạng xu hướng mới là thứ cần đọc. */
  function line(rows, me) {
    const W = 1000, H = 300, PL = 62, PR = 16, PT = 20, PB = 42;
    const { top, step } = scale(Math.max(...rows.map((r) => r[me.key]), 0));
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const x = (i) => (rows.length === 1 ? (PL + W - PR) / 2 : PL + ((W - PL - PR) * i) / (rows.length - 1));

    let s = '';
    for (let t = 0; t <= top + 1e-9; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>`;
      s += `<text x="${PL - 9}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${esc(fmt(t, me.fmt))}</text>`;
    }
    const pts = rows.map((r, i) => `${x(i)},${y(r[me.key])}`).join(' ');
    s += `<polygon points="${PL},${y(0)} ${pts} ${x(rows.length - 1)},${y(0)}" fill="var(--wash)"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach((r, i) => {
      s += `<circle cx="${x(i)}" cy="${y(r[me.key])}" r="4" fill="var(--card)" stroke="var(--series-1)" stroke-width="2.5"/>`;
      // Vùng bắt chuột rộng hơn chấm — chấm 4px thì phải rê rất khéo mới trúng.
      s += `<circle data-i="${i}" cx="${x(i)}" cy="${y(r[me.key])}" r="13" fill="transparent"/>`;
      // Nhãn thưa dần khi nhiều điểm, để trục X không thành một vệt chữ đè nhau.
      const every = Math.ceil(rows.length / 14);
      if (i % every === 0 || i === rows.length - 1) {
        s += `<text x="${x(i)}" y="${H - PB + 20}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(cut(r.key, 10))}</text>`;
      }
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(me.label)}">${s}</svg>`;
  }

  // ── Bảng số ────────────────────────────────────────────────────────────
  function drawTable(rows, me, dim) {
    $('rows-n').textContent = rows.length ? `· ${nf(rows.length)} nhóm` : '';
    const cls = dim.mono ? 'mono' : '';
    const MS = measuresFor(dim.key);
    $('t-rows').innerHTML =
      `<thead><tr><th>${esc(dim.label)}</th>` +
      MS.map((m) => `<th class="r nw"${m.key === me.key ? ' style="color:var(--series-1)"' : ''}>${esc(m.label)}</th>`).join('') +
      '<th class="r nw">Gần nhất</th></tr></thead><tbody>' +
      rows.map((r) => `<tr><td class="${cls}">${esc(cut(r.key, 48))}</td>` +
        // Cột đang được vẽ thì đậm lên; các cột còn lại mờ đi. Bảng bảy cột mà
        // cùng một sắc độ thì không ai tìm ra cột mình vừa chọn ở biểu đồ trên.
        MS.map((m) => m.key === me.key
          ? `<td class="r num nw" style="font-weight:660">${esc(fmt(r[m.key], m.fmt))}</td>`
          : `<td class="r num nw dim">${esc(fmt(r[m.key], m.fmt))}</td>`).join('') +
        `<td class="r num dim nw">${dt(r.last)}</td></tr>`).join('') +
      '</tbody>';
  }

  function downloadCsv() {
    if (!DATA) return;
    const dim = dimOf(state.dim), MS = measuresFor(dim.key);
    const head = [dim.label, ...MS.map((m) => m.label), 'Gần nhất'];
    // Bọc mọi ô trong ngoặc kép: tên người có dấu phẩy, và Excel sẽ tách nhầm cột.
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = [head.map(q).join(','), ...DATA.rows.map((r) =>
      [r.key, ...MS.map((m) => r[m.key] ?? ''), r.last || ''].map(q).join(','))].join('\r\n');
    // BOM ﻿: thiếu nó là Excel mở ra tiếng Việt thành ký tự rác.
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `mcp-${state.dim}-${state.days}d.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Nạp dữ liệu ────────────────────────────────────────────────────────
  async function load() {
    $('chart').innerHTML = '<div class="ok-empty dim">Đang tính…</div>';
    const q = new URLSearchParams({ dim: state.dim, days: state.days, source: state.source, include: state.include });
    try {
      const r = await fetch('/api/explore?' + q, { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      DATA = j;
      draw();
    } catch (e) {
      $('chart').innerHTML = `<div class="ok-empty" style="color:var(--critical)">Không tải được dữ liệu: ${esc(e.message)}</div>`;
    }
  }

  const clock = $('clock');
  const tick = () => { clock.textContent = new Date().toLocaleTimeString('vi-VN', { hour12: false }); };
  tick();
  setInterval(tick, 1000);

  buildControls();
  if (BAKED) {
    // Bản xem trước tĩnh: chỉ có đúng một tập số đã nướng sẵn, nên các ô đổi
    // truy vấn phải khoá lại — để mở mà bấm vào thì trang im lặng không đổi gì.
    DATA = BAKED;
    Object.assign(state, { dim: BAKED.dim, days: BAKED.days, source: BAKED.source, include: BAKED.include });
    for (const el of [$('f-dim'), $('f-source'), $('f-include')]) el.disabled = true;
    for (const b of [...$('f-days').children]) b.disabled = true;
    draw();
  } else {
    load();
  }
</script>
