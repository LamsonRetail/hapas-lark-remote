<title>Lark MCP remote — bảng vận hành</title>

<style>/*__CSS__*/</style>

<div class="wrap" id="wrap">
  <header>
    <div>
      <h1>Lark MCP remote</h1>
      <!-- Câu trả lời cho "tôi đang nhìn cái gì" — viết ra thay vì bắt đọc
           ngược lên thanh lọc rồi tự ghép lại trong đầu. -->
      <div class="scope" id="scope"></div>
    </div>
    <div class="head-right">
      <div id="verdict"></div>
      <!--
        Trước đây chỗ này là đồng hồ chạy từng giây. Nó nhấp nháy ngay cạnh badge
        phán quyết — thứ quan trọng nhất trên trang — mà chuyển động thì luôn
        thắng màu sắc ở tầm nhìn ngoại vi. Câu cần trả lời cũng không phải "mấy
        giờ rồi" (hệ điều hành đã nói) mà "số tôi đang nhìn cũ bao lâu rồi".
      -->
      <div class="stamp" id="stamp"><span class="live"></span>đang tải…</div>
    </div>
  </header>

  <!-- ══ Bộ lọc TOÀN CỤC ═══════════════════════════════════════════════════
       Dính lên đỉnh màn hình. Không phải để trang trí: đổi bộ lọc trong lúc
       đang nhìn kết quả là thao tác chính của trang này, mà thanh lọc trôi mất
       khi cuộn thì mỗi lần đổi là cuộn lên, bấm, cuộn xuống, và tới lúc nhìn
       lại thì đã quên số cũ.

       Ở đây CHỈ chứa thứ thật sự toàn cục: khoảng ngày, người, ứng dụng. Ô
       "Nhóm theo / Đo bằng / Kiểu vẽ" nằm trong chính thẻ biểu đồ mà chúng điều
       khiển — đưa lên đây là tái phạm đúng lỗi cũ theo chiều ngược lại: một
       thanh trông như lọc cả trang nhưng có nút chỉ đổi được một khối. -->
  <section class="filterbar" id="filterbar">
    <div class="fb card">
      <div class="fb-grp">
        <span class="fb-lb">Khoảng</span>
        <div class="seg" id="f-range"></div>
        <div class="calwrap">
          <button type="button" class="cal-btn" id="f-cal" aria-haspopup="dialog" aria-expanded="false">
            <span class="cal-ic" aria-hidden="true">▦</span><span id="f-cal-text">Tuỳ chọn</span>
          </button>
          <div class="cal" id="cal" role="dialog" aria-label="Chọn khoảng ngày" hidden></div>
        </div>
      </div>

      <div class="fb-grp">
        <span class="fb-lb">Người</span>
        <select id="f-user" class="mini" aria-label="Lọc theo người"></select>
      </div>

      <div class="fb-grp">
        <span class="fb-lb">Ứng dụng</span>
        <select id="f-app" class="mini" aria-label="Lọc theo ứng dụng"></select>
      </div>

      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="f-reset" hidden>Bỏ lọc</button>
    </div>
    <div class="fb-note" id="fb-note" hidden></div>
  </section>

  <!-- ══ Tầng 1: canh gác ══════════════════════════════════════════════════
       NẰM NGOÀI bộ lọc, cố ý. "Canary cách đây 2 giờ" luôn tính từ bây giờ:
       cho bộ lọc đụng vào thì chọn xem lại tuần trước sẽ ra "nhịp tim cách đây
       9 ngày" và báo đỏ — một cảnh báo giả do chính người xem vừa tạo ra bằng
       cách đổi khoảng ngày. Có một dòng chữ nói rõ điều đó ngay dưới. -->
  <section class="statusbar card" id="watchdog"></section>
  <div class="rt-note">Dải canh gác luôn tính theo thời gian thực — không đổi theo bộ lọc phía trên.</div>

  <section class="card pad" id="canary-box" hidden>
    <h2>Probe canary <span class="n" id="canary-n"></span></h2>
    <div class="scroll"><table id="t-canary"></table></div>
    <div id="canary-pager"></div>
  </section>

  <!-- ══ Tầng 2: KPI ═══════════════════════════════════════════════════════ -->
  <section class="g4" id="kpi"></section>

  <!-- ══ Tầng 3: biểu đồ ═══════════════════════════════════════════════════
       MỘT biểu đồ, không phải ba.

       Trước đây trên đầu trang có "Lượt gọi theo ngày" và "Tool nhiều/ít nhất",
       rồi cuối trang có khu "Đào sâu" vẽ lại đúng hai thứ đó qua ô chọn. Cùng
       một câu hỏi, cùng một tập số, ba chỗ vẽ. Nay còn một chỗ, và nó mở sẵn ở
       "Ngày × Lượt gọi" — tức là đúng cái biểu đồ vừa bị bỏ, nằm đúng chỗ mắt
       tìm, chỉ khác là giờ đổi được góc nhìn mà không phải cuộn đi đâu. -->
  <div class="zone">Phân tích</div>
  <section class="card pad" id="chart-card">
    <h2>
      <span id="chart-title">Biểu đồ</span>
      <span class="spacer"></span>
      <span class="seg seg-sm" id="f-kind"></span>
    </h2>
    <div class="cc">
      <div class="field">
        <label for="f-dim">Nhóm theo</label>
        <select id="f-dim"></select>
      </div>
      <div class="field">
        <label for="f-measure">Đo bằng</label>
        <select id="f-measure"></select>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </section>

  <!-- ══ Tầng 4: chi tiết ══════════════════════════════════════════════════
       Bảng người GIỮ LẠI dù biểu đồ có thể nhóm theo "Người gọi": hai cột
       "Cắm bằng" và "Token còn" đến từ bảng `machines`, không nằm trong
       audit_logs nên không có phép gộp nào dựng lại được chúng. Riêng "Token
       còn" là con số DUY NHẤT trên trang đòi hành động TRƯỚC khi hỏng. -->
  <div class="zone">Chi tiết</div>
  <section class="card pad">
    <h2>Người dùng <span class="n" id="people-n"></span></h2>
    <div class="scroll"><table class="wide" id="t-people"></table></div>
    <div id="people-pager"></div>
  </section>

  <section class="card pad">
    <h2>
      Số liệu <span class="n" id="rows-n"></span>
      <span class="spacer"></span>
      <button class="btn" id="f-csv">Tải CSV</button>
    </h2>
    <div class="scroll"><table class="wide" id="t-rows"></table></div>
    <div id="rows-pager"></div>
  </section>
</div>

<div id="tip" role="status"></div>

<script>
  /**
   * Mọi phần của trang đều do JS dựng, nên một lỗi bất kỳ là trắng nguyên trang.
   * Bắt lỗi ra màn hình để lần sau trang hỏng còn nói được nó hỏng ở đâu.
   */
  addEventListener('error', (e) => {
    const w = document.querySelector('.wrap');
    if (!w) return;
    w.insertAdjacentHTML('afterbegin',
      '<div class="card pad" style="border-color: var(--critical)">' +
      '<h2 style="color: var(--critical)">Trang dựng lỗi</h2>' +
      '<div class="mono" style="font-size: 12px">' + String(e.message || e.error || 'không rõ') + '</div></div>');
  });

  const BAKED = /*__DATA__*/null;
  // Danh mục cột/phép đo/mốc sẵn, build.mjs nướng vào từ explore-schema.mjs +
  // range.mjs — trang KHÔNG tự khai lại, nếu không nó sẽ chào một lựa chọn mà
  // máy chủ từ chối.
  const SCHEMA = /*__SCHEMA__*/null;
  // Bản xem trước tĩnh: số của khu biểu đồ nướng sẵn theo TỪNG cột nhóm, để mở
  // preview.html không cần backend vẫn đổi được "Nhóm theo". Bản live = null.
  const BAKED_EX = /*__EXPLORE__*/null;
  /**
   * Bản xem trước tĩnh (mở preview.html, không backend) hay bản chạy thật?
   *
   * Ranh giới này quyết định thứ trang được phép hứa. Bản tĩnh nướng số cho
   * ĐÚNG một khoảng, nên bộ lọc toàn cục không có gì để lọc sang — và cách
   * đúng là KHOÁ nó lại, không phải để bấm được rồi âm thầm bật về chỗ cũ.
   */
  const STATIC = Boolean(BAKED);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = (n) => new Intl.NumberFormat('vi-VN').format(n);
  const dt = (s) => (s ? new Date(s).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
  const day2 = (s) => s.slice(8, 10) + '/' + s.slice(5, 7);
  // Locale vi ngăn nghìn bằng dấu chấm: nf(1274)+' ms' đọc thành 1,274 ms.
  const ms = (v) => (v == null ? '—' : v < 1000 ? v + ' ms' : (v / 1000).toFixed(2).replace('.', ',') + ' s');
  const ageH = (s) => (s ? (Date.now() - new Date(s)) / 3600000 : Infinity);
  const age = (s) => {
    const h = ageH(s);
    if (!isFinite(h)) return 'chưa có';
    if (h < 1) return Math.round(h * 60) + ' phút trước';
    if (h < 48) return h.toFixed(1).replace('.0', '') + ' giờ trước';
    return Math.round(h / 24) + ' ngày trước';
  };
  const cut = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s));

  /**
   * ── Ngày, theo giờ Việt Nam ──────────────────────────────────────────────
   *
   * Ba dòng số học ngày tháng, cố ý viết lại ở đây thay vì gọi range.mjs: file
   * đó là mô-đun phía máy chủ, còn trang này là một file HTML rời phải mở được
   * cả khi không có backend.
   *
   * Trùng lặp có kiểm soát, vì QUYỀN QUYẾT ĐỊNH không nằm ở đây: trang chỉ ĐỀ
   * NGHỊ một khoảng, máy chủ kẹp biên rồi trả về `range` thật, và trang hiện
   * lại đúng cái nó nhận được. Lệch nhau thì máy chủ đúng.
   */
  const TZ_MS = SCHEMA.TZ_MIN * 60000, DAY_MS = 86400000;
  const today = () => new Date(Date.now() + TZ_MS).toISOString().slice(0, 10);
  const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * DAY_MS).toISOString().slice(0, 10);
  const spanDays = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / DAY_MS) + 1;
  const presetRange = (key) => {
    const p = SCHEMA.PRESETS.find((x) => x.key === key) || SCHEMA.PRESETS[2];
    const to = today();
    return { from: addDays(to, -(p.days - 1)), to };
  };

  /**
   * Ghi innerHTML CHỈ KHI nội dung thật sự đổi. Trả về true nếu đã dựng lại.
   *
   * Trang tự nạp lại mỗi 30 giây, và bản đầu cứ thế ghi đè innerHTML của dải
   * canh gác, KPI, hai cái bảng và hai ô chọn — kể cả khi không có gì đổi. Ghi
   * đè là huỷ phần tử cũ và tạo phần tử mới, mà điều đó xảy ra giữa lúc có
   * người đang thao tác thì:
   *
   *   - đang mở danh sách ô chọn "Người" → danh sách sập xuống, mất chỗ đang dò
   *   - đang bấm nút chuyển trang → `mousedown` một nút, `mouseup` nút khác,
   *     trình duyệt không phát `click`, cú bấm bốc hơi không dấu vết
   *
   * Đúng cái bẫy đã làm hỏng lịch chọn ngày, chỉ khác là ở đây nó cần trúng
   * đúng 30 giây một lần nên hiếm hơn và khó tin hơn khi có người báo lỗi.
   *
   * So chuỗi trên một thuộc tính JS chứ không đọc `el.innerHTML`: trình duyệt
   * chuẩn hoá lại markup khi đọc ra (thứ tự thuộc tính, dấu nháy), nên so với
   * chuỗi mình vừa ghi vào là gần như luôn lệch — và tối ưu này thành vô dụng.
   */
  function setHtml(el, html) {
    if (!el || el.__html === html) return false;
    el.__html = html;
    el.innerHTML = html;
    return true;
  }

  const tip = $('tip');
  function bindTip(el, html) {
    el.setAttribute('tabindex', '0');
    const show = (e) => {
      tip.innerHTML = html; tip.classList.add('on');
      const r = el.getBoundingClientRect();
      tip.style.left = Math.min(innerWidth - 260, Math.max(8, (e && e.clientX ? e.clientX : r.left + r.width / 2) - 60)) + 'px';
      tip.style.top = Math.max(8, r.top - 42) + 'px';
    };
    const hide = () => tip.classList.remove('on');
    el.addEventListener('mouseenter', show); el.addEventListener('mousemove', show);
    el.addEventListener('mouseleave', hide); el.addEventListener('focus', show); el.addEventListener('blur', hide);
  }

  /**
   * ── Trạng thái ───────────────────────────────────────────────────────────
   *
   * `FILTER` là bộ lọc TOÀN CỤC — nó đi vào cả hai endpoint.
   * `VIEW` chỉ đổi cách vẽ MỘT thẻ biểu đồ, không ai khác quan tâm.
   *
   * Tách hai cái ra không phải cho gọn code mà vì chúng có chi phí khác nhau:
   * đổi FILTER là đi mạng hai lần, đổi VIEW là vẽ lại tại chỗ, tức thì. Trộn
   * chung thì sớm muộn một thao tác đáng lẽ tức thì lại chờ một giây.
   */
  const DEF_FILTER = { preset: SCHEMA.DEFAULT_PRESET, from: '', to: '', user: '', app: '' };
  const DEF_VIEW = { dim: 'day', measure: 'calls', kind: '' };
  const FILTER = { ...DEF_FILTER };
  const VIEW = { ...DEF_VIEW };

  let DATA = null;          // kết quả /api/data gần nhất
  let EX = null;            // kết quả /api/explore gần nhất
  let toolRank = 'top';     // giữ NGOÀI render, xem canaryOpen
  let canaryOpen = false;   // bảng probe đang mở? giữ qua mỗi lần poll 30s

  (function readUrl() {
    const q = new URLSearchParams(location.search);
    for (const k of Object.keys(DEF_FILTER)) if (q.get(k)) FILTER[k] = q.get(k);
    for (const k of Object.keys(DEF_VIEW)) if (q.get(k)) VIEW[k] = q.get(k);
    // from/to và preset loại trừ nhau: có cặp ngày tay thì bỏ mốc sẵn, không
    // thì máy chủ ưu tiên preset và cặp ngày trên URL thành chữ chết.
    if (FILTER.from && FILTER.to) FILTER.preset = '';
    else { FILTER.from = ''; FILTER.to = ''; if (!FILTER.preset) FILTER.preset = DEF_FILTER.preset; }
  })();

  function pushUrl() {
    const q = new URLSearchParams();
    const put = (o, d) => { for (const [k, v] of Object.entries(o)) if (v && v !== d[k]) q.set(k, v); };
    put(FILTER, DEF_FILTER); put(VIEW, DEF_VIEW);
    const s = q.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }

  /** Bộ lọc → query string chung cho CẢ hai endpoint. Một nguồn, không lệch. */
  function filterQuery() {
    const q = new URLSearchParams();
    if (FILTER.preset) q.set('preset', FILTER.preset);
    else { q.set('from', FILTER.from); q.set('to', FILTER.to); }
    if (FILTER.user) q.set('user', FILTER.user);
    if (FILTER.app) q.set('app', FILTER.app);
    return q;
  }

  /**
   * ── Phân trang ────────────────────────────────────────────────────────
   *
   * Số trang giữ NGOÀI hàm render, vì trang tự nạp lại dữ liệu mỗi 30s: để
   * bên trong thì cứ nửa phút người đọc lại bị ném về trang 1 giữa chừng.
   *
   * Chỉ vẽ thanh chuyển trang khi thật sự tràn — bảng 7 dòng mà vẫn có
   * "Trang 1/1" là thêm một dòng chữ không nói gì.
   */
  const PAGE_SIZE = 12;
  const pageAt = {};
  const pageOf = (key, total) => {
    const max = Math.max(1, Math.ceil(total / PAGE_SIZE));
    pageAt[key] = Math.min(pageAt[key] || 1, max);
    return { page: pageAt[key], max, from: (pageAt[key] - 1) * PAGE_SIZE };
  };

  function pager(elId, key, total, redraw) {
    const { page, max } = pageOf(key, total);
    const el = $(elId);
    if (!el) return;
    if (max < 2) { setHtml(el, ''); return; }
    // Chỉ "3 / 5". Tổng số dòng đã nằm ngay tiêu đề bảng phía trên, nhắc lại ở
    // đây là bắt mắt đọc hai lần cùng một con số.
    const html = `<div class="pager">
        <button class="btn" data-d="-1"${page === 1 ? ' disabled' : ''}>← Trước</button>
        <span class="pnum"><b>${page}</b> / ${max}</span>
        <button class="btn" data-d="1"${page === max ? ' disabled' : ''}>Sau →</button>
      </div>`;
    // Hàm vẽ lại giữ TRÊN phần tử, không trong bao đóng của listener: khi HTML
    // không đổi ta không gắn lại listener, mà `redraw` của khu Đào sâu là một
    // bao đóng MỚI ôm tập dòng mới mỗi lần vẽ. Nhốt nó trong listener cũ là bấm
    // chuyển trang xong nhận lại đúng tập dòng của lần nạp trước.
    el.__redraw = redraw;
    // Gắn trình xử lý CHỈ khi vừa dựng lại. Không có cái chốt này thì mỗi lần
    // poll lại chồng thêm một listener lên đúng hai cái nút — bấm một cái nhảy
    // hai trang, rồi ba, rồi bốn, và càng để trang mở lâu càng loạn.
    if (!setHtml(el, html)) return;
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      pageAt[key] = Math.min(max, Math.max(1, page + Number(b.dataset.d)));
      el.__redraw();
    }));
  }

  /**
   * Chú giải hai màu, chỉ vẽ khi biểu đồ THẬT SỰ có phần đỏ. Xanh lá không
   * phải "tốt", nó là "chạy được"; đỏ không phải "lỗi", nó là "người dùng
   * không dùng được" — hai chữ đó khác nhau và bảng này chỉ đếm chữ thứ hai.
   */
  const LEGEND2 = (show) => (show
    ? '<div class="legend"><span><i style="background:var(--good)"></i>Chạy được</span>' +
      '<span><i style="background:var(--critical)"></i>Không dùng được</span></div>'
    : '');

  // ══════════════════════════════════════════════════════════════════════════
  // BỘ LỌC TOÀN CỤC
  // ══════════════════════════════════════════════════════════════════════════

  /** Khoảng mà trang ĐANG ĐỀ NGHỊ, tính ngay tại chỗ, không chờ mạng. */
  const wantedRange = () => (FILTER.preset
    ? { ...presetRange(FILTER.preset), preset: FILTER.preset }
    : { from: FILTER.from, to: FILTER.to, preset: null });

  /**
   * Khoảng đang áp dụng.
   *
   * Lấy lời máy chủ CHỈ KHI nó đang nói về đúng bộ lọc hiện tại — nó mang theo
   * ghi chú kẹp biên nên đáng tin hơn. Chưa khớp nghĩa là câu trả lời còn trên
   * đường về, và trong lúc đó phải hiện khoảng VỪA CHỌN chứ không phải khoảng
   * của lần trước: bấm "3 ngày" mà nhãn còn ghi "30 ngày" thì thao tác trông
   * như đã trượt, và người ta bấm lại lần nữa.
   */
  function activeRange() {
    const w = wantedRange();
    const d = DATA && DATA.range;
    if (d && (d.preset || null) === w.preset && (w.preset || (d.from === w.from && d.to === w.to))) return d;
    return { ...w, days: w.from && w.to ? spanDays(w.from, w.to) : 0, clamped: [] };
  }

  const rangeText = (r) => {
    if (!r || !r.from) return '—';
    const d = spanDays(r.from, r.to);
    if (d === 1) return day2(r.from);
    return `${day2(r.from)} – ${day2(r.to)}`;
  };

  function buildFilterBar() {
    $('f-range').innerHTML = SCHEMA.PRESETS
      .map((p) => `<button type="button" data-v="${esc(p.key)}">${esc(p.label)}</button>`).join('');

    $('f-range').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      closeCal();
      Object.assign(FILTER, { preset: b.dataset.v, from: '', to: '' });
      applyFilter();
    });
    $('f-user').addEventListener('change', (e) => { FILTER.user = e.target.value; applyFilter(); });
    $('f-app').addEventListener('change', (e) => { FILTER.app = e.target.value; applyFilter(); });
    $('f-reset').addEventListener('click', () => { Object.assign(FILTER, DEF_FILTER); applyFilter(); });
    $('f-cal').addEventListener('click', () => (calOpen ? closeCal() : openCal()));

    // Uỷ nhiệm lên `#cal` — phần tử này KHÔNG bao giờ bị thay, chỉ ruột nó bị
    // dựng lại. Gắn một lần ở đây thì không có lần dựng nào làm mất trình xử lý,
    // và không có lần dựng nào bị kích hoạt bởi chính việc rê chuột.
    $('cal').addEventListener('click', onCalClick);
    $('cal').addEventListener('mouseover', onCalHover);
    $('cal').addEventListener('mouseleave', () => {
      // Rời khỏi lịch thì bỏ vệt tô thử, không thì nó đứng lại ở ô cuối cùng
      // con trỏ đi qua và trông như đã chọn tới đó rồi.
      if (calHover) { calHover = ''; calPaint(); }
    });

    // Bấm ra ngoài / bấm Esc là đóng lịch. Thiếu hai cái này thì một popover
    // mở ra là nó nằm lì trên màn cho tới khi bấm trúng đúng cái nút đã mở nó.
    document.addEventListener('click', (e) => {
      if (calOpen && !e.target.closest('.calwrap')) closeCal();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && calOpen) closeCal(); });

    /**
     * Viền dưới thanh lọc CHỈ hiện khi nó đã dính lên đỉnh. Lúc trang chưa cuộn
     * thì nó là một thẻ như mọi thẻ khác; kẻ sẵn một đường ngang ở đó là thêm
     * một nét chia mà chưa có gì để chia.
     *
     * Một phép so `top <= 0` trong chính sự kiện cuộn, không IntersectionObserver
     * và không requestAnimationFrame. Bản đầu dùng IO với một ô mốc 1px, bản
     * thứ hai bọc rAF — cả hai đều là API chỉ chạy khi trang ĐANG ĐƯỢC VẼ, nên
     * mỗi lần thêm một cái là thêm một đường để trạng thái này lệch khỏi sự
     * thật, mà lệch thì không có lỗi nào báo: thanh vẫn dính, chỉ là mất đường
     * phân tách và nội dung cuộn qua trông như dán đè lên nhau.
     *
     * Chỉ GHI khi giá trị đổi. Đọc getBoundingClientRect rồi đổi class ngay
     * trong cùng một nhịp cuộn là công thức làm trình duyệt tính lại bố cục
     * liên tục; ghi theo cạnh lên/xuống thì cả một lần cuộn dài chỉ có đúng hai
     * lần ghi.
     */
    const bar = $('filterbar');
    let isStuck = false;
    const onScroll = () => {
      const now = bar.getBoundingClientRect().top <= 0;
      if (now !== isStuck) { isStuck = now; bar.classList.toggle('stuck', now); }
    };
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll, { passive: true });
    onScroll();

    // Đổi bề rộng cửa sổ là nút lịch đổi chỗ — popover phải bám theo, không thì
    // nó đứng lại ở toạ độ cũ và thò ra ngoài màn.
    addEventListener('resize', () => { if (calOpen) calPlace(); }, { passive: true });

    if (STATIC) lockGlobalFilters();
  }

  /**
   * Bản tĩnh: KHOÁ hẳn bộ lọc toàn cục.
   *
   * Bản đầu để nguyên cho bấm, rồi khi bấm xong thì lặng lẽ đặt bộ lọc về mốc
   * đã nướng và ghi một dòng chú thích nhỏ. Đo thực tế: người dùng chọn ngày,
   * thấy nó bật ngược lại, và kết luận là TÍNH NĂNG HỎNG — hoàn toàn hợp lý,
   * vì một cái nút bấm được là một lời hứa. Nút khoá nói thật ngay từ đầu; nút
   * tự bật lại thì bắt người ta phải tự đoán ra lý do.
   *
   * "Nhóm theo / Đo bằng / Kiểu vẽ" KHÔNG khoá: build nướng sẵn phép gộp cho
   * từng cột nhóm nên chúng chạy được thật, kể cả offline.
   */
  function lockGlobalFilters() {
    const why = 'Bản xem trước tĩnh — số đã nướng sẵn cho một khoảng. Chạy `npm run dashboard` để lọc thật.';
    for (const el of [...$('f-range').children, $('f-cal'), $('f-user'), $('f-app')]) {
      el.disabled = true;
      el.title = why;
    }
    $('f-reset').hidden = true;
  }

  function syncFilterBar() {
    const r = activeRange();
    for (const b of $('f-range').children) b.setAttribute('aria-pressed', String(b.dataset.v === FILTER.preset));
    $('f-cal').setAttribute('aria-pressed', String(!FILTER.preset));
    $('f-cal-text').textContent = FILTER.preset ? 'Tuỳ chọn' : rangeText(r);
    $('f-cal').classList.toggle('on', !FILTER.preset);

    const f = (DATA && DATA.filters) || { users: [], apps: [], noApp: 0 };
    const opts = (list, cur, all) => `<option value="">${all}</option>` +
      list.map((v) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(cut(v, 38))}</option>`).join('');
    // Giá trị đang chọn mà không còn trong danh sách (đổi khoảng ngày là người
    // không hoạt động biến mất) thì vẫn phải nằm trong ô — không thì ô hiện
    // "Tất cả" trong khi số liệu vẫn đang lọc theo người đó.
    const withCur = (list, cur) => (cur && !list.includes(cur) ? [cur, ...list] : list);
    // Hai ô này là chỗ setHtml quan trọng nhất: người dùng mở danh sách ra dò
    // tên, vòng poll 30s ập tới ghi đè <option>, danh sách sập ngay dưới tay.
    setHtml($('f-user'), opts(withCur(f.users, FILTER.user), FILTER.user, 'Tất cả mọi người'));
    setHtml($('f-app'), opts(withCur(f.apps, FILTER.app), FILTER.app, 'Tất cả ứng dụng'));

    const dirty = FILTER.user || FILTER.app || FILTER.preset !== DEF_FILTER.preset;
    $('f-reset').hidden = !dirty || STATIC;

    // Dòng ghi chú dưới thanh lọc: chỉ nói khi có gì BẤT NGỜ cần nói.
    const notes = [];
    if (STATIC) {
      notes.push(`Bản xem trước tĩnh — số nướng sẵn cho ${rangeText(r)}, bộ lọc đã khoá.`
        + ' Chạy `npm run dashboard` để có bản đầy đủ, lọc được theo ngày / người / ứng dụng.');
    }
    if (r && r.clamped && r.clamped.length) notes.push(...r.clamped);
    if (FILTER.app && f.noApp) {
      notes.push(`${nf(f.noApp)} lượt gọi ghi trước khi hệ thống bắt đầu lưu tên ứng dụng — không nằm trong bộ lọc này.`);
    }
    setHtml($('fb-note'), notes.map((n) => `<span>⚠ ${esc(n)}</span>`).join(''));
    $('fb-note').hidden = !notes.length;

    // Dòng phạm vi dưới tiêu đề trang.
    const d = r && r.from ? spanDays(r.from, r.to) : 0;
    setHtml($('scope'), [
      `<b>${esc(rangeText(r))}</b>`,
      d ? `${nf(d)} ngày` : '',
      FILTER.user ? `chỉ <b>${esc(cut(FILTER.user, 28))}</b>` : 'tất cả mọi người',
      FILTER.app ? `qua <b>${esc(FILTER.app)}</b>` : '',
    ].filter(Boolean).join(' · '));
  }

  // ── Lịch chọn khoảng ────────────────────────────────────────────────────
  /**
   * Lịch tự vẽ, không thư viện: CSP của Vercel chặn host ngoài, và bản
   * preview.html phải mở được như một file rời không mạng.
   *
   * Nó ĐỨNG CẠNH các mốc sẵn chứ không thay chúng. "30 ngày" là một cú bấm;
   * qua lịch là mở, định vị tháng, bấm hai đầu — bốn thao tác cho đúng thứ mà
   * hầu hết lượt mở trang cần. Bỏ mốc sẵn là bắt cả tổ trả giá cho một nhu cầu
   * thỉnh thoảng.
   */
  /**
   * ⚠ LUẬT SỐNG CÒN CỦA FILE NÀY: rê chuột KHÔNG được dựng lại DOM.
   *
   * Bản đầu gắn `mouseenter` lên từng ô ngày, và trong đó gọi `drawCal()` —
   * hàm ghi đè `innerHTML` của cả cái lịch. Hậu quả không hiện ra ở bất kỳ phép
   * thử tự động nào, vì `el.click()` chạy mà không có con trỏ nào rê qua:
   *
   *   người dùng bấm ngày đầu  → ok
   *   đưa tay tới ngày thứ hai → mỗi ô lướt qua bắn `mouseenter` → dựng lại DOM
   *   bấm ngày thứ hai         → `mousedown` rơi trên nút A, DOM bị thay,
   *                              `mouseup` rơi trên nút B
   *   → trình duyệt KHÔNG phát `click` (nó đòi hai nửa rơi cùng một phần tử)
   *   → cú bấm biến mất, không lỗi, không log. Lịch "bấm không ăn".
   *
   * Nên tách làm hai việc, và chỉ việc thứ nhất được đụng tới `innerHTML`:
   *
   *   calRender()  dựng khung — CHỈ khi mở lịch hoặc đổi tháng, đều là thao tác
   *                rời rạc, không có cú bấm nào đang dở dang
   *   calPaint()   đổi class trên các ô SẴN CÓ + chữ gợi ý. Không tạo, không
   *                xoá phần tử nào, nên không cú bấm nào bị cắt ngang
   *
   * Và mọi sự kiện uỷ nhiệm lên `#cal` — gắn MỘT lần, sống qua mọi lần dựng
   * lại khung. Gắn lại từng ô sau mỗi lần vẽ chính là thứ đẻ ra lỗi trên.
   */
  let calOpen = false, calCursor = '', calPick = null, calHover = '';
  const DOW = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  const MONTH = (ym) => `Tháng ${+ym.slice(5, 7)}/${ym.slice(0, 4)}`;
  const ymOf = (d) => d.slice(0, 7);
  const ymAdd = (ym, n) => {
    const m = (+ym.slice(5, 7)) - 1 + n, y = +ym.slice(0, 4) + Math.floor(m / 12);
    return `${y}-${String(((m % 12) + 12) % 12 + 1).padStart(2, '0')}`;
  };

  const calMin = () => addDays(today(), -(SCHEMA.MAX_RANGE_DAYS - 1));

  function openCal() {
    const r = activeRange();
    calPick = { from: r.from, to: r.to };
    calHover = '';
    // Mở ra ở tháng của ĐẦU CUỐI khoảng, và nó là tháng bên PHẢI — vì khoảng
    // gần nhất luôn kết thúc ở hôm nay, mà mắt tìm hôm nay trước tiên.
    calCursor = ymAdd(ymOf(r.to || today()), -1);
    calOpen = true;
    $('cal').hidden = false;
    $('f-cal').setAttribute('aria-expanded', 'true');
    calRender();
    calPlace();
  }

  /**
   * Kẹp popover nằm trọn trong khung nhìn.
   *
   * Neo bằng CSS thuần thì phải đoán trước nút lịch nằm ở đâu, mà chỗ đó lại
   * trôi theo bề rộng màn (dải mốc sẵn xuống dòng ở những ngưỡng khác nhau).
   * Đo thật thì thấy đoán trật cả hai phía: ở 782px lịch thò sang PHẢI và kéo
   * cả trang cuộn ngang; ở 390px nó thò sang TRÁI và mất mấy cột ngày đầu tuần.
   *
   * Đo rồi kẹp thì đúng ở mọi bề rộng, kể cả những bề rộng chưa ai thử.
   */
  function calPlace() {
    const cal = $('cal');
    const anchor = $('f-cal').closest('.calwrap');
    if (!cal || !anchor) return;
    const M = 8;
    cal.style.right = 'auto';
    cal.style.left = '0px';
    const a = anchor.getBoundingClientRect();
    const w = cal.offsetWidth;
    // `clientWidth` chứ KHÔNG `innerWidth`: innerWidth tính cả thanh cuộn dọc,
    // nên kẹp theo nó là lịch vẫn thò ra đúng bằng bề rộng thanh cuộn (~15px)
    // và trang vẫn cuộn ngang. Đo ra ở 820/782/740/560/320px, mỗi chỗ lố vài
    // pixel — vừa đủ để không ai nhìn thấy nguyên nhân, chỉ thấy trang bị rung
    // ngang khi mở lịch.
    const vw = document.documentElement.clientWidth;
    let left = 0;
    const over = (a.left + left + w) - (vw - M);
    if (over > 0) left -= over;
    if (a.left + left < M) left = M - a.left;
    cal.style.left = Math.round(left) + 'px';
  }
  function closeCal() {
    calOpen = false;
    calHover = '';
    $('cal').hidden = true;
    $('f-cal').setAttribute('aria-expanded', 'false');
  }

  /**
   * Khung một tháng. CHỈ cấu trúc + những gì cố định trong suốt lần vẽ này
   * (ngày nào ngoài tầm, ngày nào là hôm nay). Trạng thái chọn/rê KHÔNG nằm ở
   * đây — nó do calPaint() bôi lên sau, và bôi lại được bao nhiêu lần tuỳ ý.
   */
  function monthShell(ym) {
    // getUTCDay: CN = 0. Tuần bắt đầu THỨ HAI nên xoay về Mon = 0.
    const lead = (new Date(ym + '-01T00:00:00Z').getUTCDay() + 6) % 7;
    const days = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
    const min = calMin(), max = today();

    let s = `<div class="cal-m"><div class="cal-mh">${esc(MONTH(ym))}</div><div class="cal-g">`;
    s += DOW.map((d) => `<span class="cal-dow">${d}</span>`).join('');
    for (let i = 0; i < lead; i++) s += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const iso = `${ym}-${String(d).padStart(2, '0')}`;
      const off = iso > max || iso < min;
      s += `<button type="button" class="cal-d${iso === max ? ' now' : ''}"`
        + `${off ? ' disabled' : ''} data-d="${iso}">${d}</button>`;
    }
    return s + '</div></div>';
  }

  /** Dựng khung. CHỈ gọi khi mở lịch hoặc đổi tháng — xem luật ở đầu khối này. */
  function calRender() {
    $('cal').innerHTML =
      `<div class="cal-nav">
         <button type="button" class="btn ghost" data-mv="-1" aria-label="Tháng trước">←</button>
         <span class="cal-hint"></span>
         <button type="button" class="btn ghost" data-mv="1" aria-label="Tháng sau"${ymAdd(calCursor, 1) >= ymOf(today()) ? ' disabled' : ''}>→</button>
       </div>
       <div class="cal-ms">${monthShell(calCursor)}${monthShell(ymAdd(calCursor, 1))}</div>
       <div class="cal-ft">
         <span class="dim">Tối đa ${SCHEMA.MAX_RANGE_DAYS} ngày</span>
         <span class="spacer"></span>
         <button type="button" class="btn" data-cancel>Huỷ</button>
       </div>`;
    calPaint();
    // Đổi tháng có thể đổi bề rộng (tháng 5 tuần với tháng 6 tuần) — kẹp lại.
    if (calOpen) calPlace();
  }

  /**
   * Bôi trạng thái lên các ô SẴN CÓ. Không tạo, không xoá phần tử nào — đây là
   * hàm duy nhất được phép chạy trong lúc con trỏ đang ở trên lịch.
   */
  function calPaint() {
    const cal = $('cal');
    const hint = cal.querySelector('.cal-hint');
    if (hint) hint.textContent = calPick.from && !calPick.to ? 'Chọn ngày kết thúc' : 'Chọn ngày bắt đầu';

    const a = calPick.from, b = calPick.to || calHover || calPick.from;
    const lo = a && b ? (a < b ? a : b) : a, hi = a && b ? (a < b ? b : a) : a;
    for (const el of cal.querySelectorAll('.cal-d')) {
      const iso = el.dataset.d;
      const inR = !el.disabled && lo && hi && iso >= lo && iso <= hi;
      el.classList.toggle('in', Boolean(inR));
      el.classList.toggle('e0', Boolean(inR) && iso === lo);
      el.classList.toggle('e1', Boolean(inR) && iso === hi);
    }
  }

  /** Bấm trong lịch. Uỷ nhiệm ở `#cal` nên sống qua mọi lần dựng lại khung. */
  function onCalClick(e) {
    const mv = e.target.closest('[data-mv]');
    if (mv && !mv.disabled) { calCursor = ymAdd(calCursor, +mv.dataset.mv); calRender(); return; }
    if (e.target.closest('[data-cancel]')) { closeCal(); return; }

    const cell = e.target.closest('.cal-d');
    if (!cell || cell.disabled) return;
    const d = cell.dataset.d;

    // Đầu thứ nhất: chỉ ghi nhận rồi bôi lại. KHÔNG dựng lại khung — con trỏ
    // đang nằm ngay trên ô vừa bấm, và cú bấm tiếp theo sẽ rơi vào đây.
    if (!calPick.from || calPick.to) { calPick = { from: d, to: '' }; calHover = ''; calPaint(); return; }

    let from = calPick.from, to = d;
    if (from > to) { const t = from; from = to; to = t; }
    // Kẹp ngay tại chỗ để người chọn thấy hậu quả liền, thay vì bấm xong mới
    // nhận về một khoảng bị máy chủ cắt ngắn không báo trước.
    if (spanDays(from, to) > SCHEMA.MAX_RANGE_DAYS) from = addDays(to, -(SCHEMA.MAX_RANGE_DAYS - 1));
    calPick = { from, to };
    Object.assign(FILTER, { preset: '', from, to });
    closeCal();
    applyFilter();
  }

  /**
   * Tô sẵn khoảng khi rê chuột, chỉ trong lúc đang chọn đầu thứ hai — không thì
   * không nhìn ra mình sắp chọn tới đâu cho tới khi đã bấm.
   *
   * `mouseover` chứ không `mouseenter`: mouseenter KHÔNG nổi bọt nên không uỷ
   * nhiệm được, mà gắn từng ô thì lại quay về đúng cái bẫy đã nói ở trên.
   */
  function onCalHover(e) {
    if (!calPick || !calPick.from || calPick.to) return;
    const cell = e.target.closest('.cal-d');
    if (!cell || cell.disabled || cell.dataset.d === calHover) return;
    calHover = cell.dataset.d;
    calPaint();
  }

  // ══════════════════════════════════════════════════════════════════════════
  // TẦNG TRÊN: canh gác · KPI · bảng người
  // ══════════════════════════════════════════════════════════════════════════

  function renderTop() {
  const D = DATA;
  // ── canh gác + phán quyết tổng ───────────────────────────────────────
  const w = D.watchdog;
  const cAge = ageH(w.canary && w.canary.at), iAge = ageH(w.ingest && w.ingest.at);
  const ICON = { good: '●', warning: '▲', serious: '▲', critical: '■' };
  const RANK = { good: 0, warning: 1, serious: 2, critical: 3 };

  /**
   * Hai ô, không phải ba. "Phiên Lark — 17 sống" đã bỏ: nó là bản tổng của
   * đúng thứ mà cột "Token còn" trong bảng người nói chi tiết hơn, và một con
   * số tổng đứng cạnh bảng chi tiết chỉ tổ phải cộng nhẩm để đối chiếu.
   *
   * Dòng phụ chỉ hiện khi có gì để CẢNH BÁO. "Dòng audit gần nhất còn tươi"
   * lặp lại đúng ý con số ngay trên nó bằng chữ khác — thừa.
   */
  const watches = [
    { key: 'canary',
      sev: !w.canary ? 'critical' : cAge > 36 ? 'critical' : w.canary.failing ? 'serious' : 'good',
      k: 'Canary', v: !w.canary ? 'Không có nhịp tim' : `${w.canary.probes} probe · ${w.canary.failing} lỗi`,
      d: cAge > 36 ? 'Quá 36h không có nhịp tim — bộ phát hiện coi như đã chết' : age(w.canary && w.canary.at) },
    { sev: iAge > 24 ? 'critical' : iAge > 6 ? 'warning' : 'good',
      k: 'Đường nạp dữ liệu', v: age(w.ingest && w.ingest.at),
      d: iAge > 6 ? 'Lâu bất thường — kiểm tra server còn ghi audit không' : '' },
  ];

  const watchdogRebuilt = setHtml($('watchdog'), watches.map((c) => {
    const mo = c.key === 'canary' && (D.canaryProbes || []).length;
    return `<div class="item sev-x${mo ? ' js-canary' : ''}" style="--sev: var(--${c.sev})"${mo ? ' role="button" tabindex="0" title="Bấm để xem từng probe"' : ''}>
      <div class="ic" aria-hidden="true">${ICON[c.sev]}</div>
      <div><div class="k">${esc(c.k)}${mo ? '<span class="more"></span>' : ''}</div>
        <div class="v">${esc(c.v)}</div>${c.d ? `<div class="d">${esc(c.d)}</div>` : ''}</div>
    </div>`;
  }).join(''));

  const worst = watches.reduce((a, c) => (RANK[c.sev] > RANK[a] ? c.sev : a), 'good');
  const VERDICT = {
    good: ['●', 'Hệ thống ổn'], warning: ['▲', 'Có cảnh báo'],
    serious: ['▲', 'Có sự cố'], critical: ['■', 'Cần chú ý ngay'],
  };
  setHtml($('verdict'), `<span class="verdict" style="--sev: var(--${worst}); color: var(--${worst})">
      <span class="dot"></span>${VERDICT[worst][1]}</span>`);

  // ── KPI ──────────────────────────────────────────────────────────────
  const k = D.kpi;
  // Chỉ đếm lượt CHẶN người dùng — lúc model phải nói "không dùng được tool
  // này". Thiếu quyền, sai tham số, quá hạn mức đều là Lark đã trả lời và model
  // đi tiếp được, đưa lên đây thì bảng lúc nào cũng đỏ trong khi tool chạy mượt.
  const blockSev = k.blockRate >= 5 ? 'critical' : k.blocked ? 'warning' : 'good';
  const nd = D.daily.length;
  setHtml($('kpi'), [
    // Mọi con số dưới đây là CỦA KHOẢNG ĐANG LỌC, không phải "từ trước tới
    // giờ". Ghi rõ số ngày có dữ liệu ngay dưới ô hero: hai người mở hai màn
    // hình với hai bộ lọc khác nhau sẽ cãi nhau về cùng một con số nếu không có
    // dòng này.
    { hero: 1, k: 'Lượt gọi', v: nf(k.calls), d: nd ? `${nd} / ${D.range.days} ngày có dữ liệu` : 'không có ngày nào có dữ liệu' },
    { k: 'Không dùng được', v: nf(k.blocked), sev: blockSev,
      d: k.blocked ? `${String(k.blockRate).replace('.', ',')}% lượt gọi bị chặn` : 'Không lượt nào bị chặn' },
    // "Đã cắm" là số người ĐĂNG NHẬP được, "đã gọi" là số người thật sự dùng.
    // Chênh lệch giữa hai số là thứ cần biết khi vừa phát link cho phòng ban.
    { k: 'Người đã cắm', v: nf(k.connected ?? k.users), d: `${nf(k.users)} người đã gọi tool` },
    { k: 'Độ trễ p95', v: ms(k.p95), d: 'trung vị ' + ms(k.p50) },
    { k: 'Tool đã dùng', v: `${k.toolsUsed}<small>/${k.toolsTotal}</small>`, d: `${D.unused.length} chưa ai gọi` },
  ].map((t) => `<div class="card kpi${t.hero ? ' hero' : ''}">
      <div class="k">${esc(t.k)}</div>
      <div class="v num"${t.sev ? ` style="color: var(--${t.sev})"` : ''}>${t.v}</div>
      <div class="d">${esc(t.d)}</div></div>`).join(''));

  // ── người dùng ───────────────────────────────────────────────────────
  // Cột "Không dùng được" CHỈ hiện khi có người thật sự bị chặn. Một cột toàn
  // số 0 không nói gì mà vẫn bắt mắt dừng lại đọc — đúng thứ cần bỏ.
  const anyBlocked = D.people.some((p) => p.blocked);
  const SEV_STATUS = { active: 'good', revoked: 'critical', inactive: 'warning' };

  /**
   * Đồng hồ đếm ngược tới hạn refresh token — 7 ngày kể từ lần chạm cuối.
   * Hết hạn là người đó phải quét mã đăng nhập lại, nên đây là con số DUY NHẤT
   * trên bảng đòi hành động trước khi hỏng, chứ không phải báo sau khi hỏng.
   */
  const countdown = (iso) => {
    if (!iso) return '<span class="dim">—</span>';
    const h = (new Date(iso) - Date.now()) / 3600000;
    if (h <= 0) return '<span style="color:var(--critical);font-weight:640">đã hết hạn</span>';
    const sev = h < 24 ? 'critical' : h < 72 ? 'warning' : 'good';
    const txt = h < 48 ? `${Math.round(h)} giờ` : `${Math.floor(h / 24)} ngày ${Math.round(h % 24)} giờ`;
    return `<span style="color:var(--${sev})">${txt}</span>`;
  };

  const personRow = (p) => `<tr>
      <td>${esc(p.name || p.openId || '—')}</td>
      <td>${p.clients.length
        ? `<div class="chips">${p.clients.map((c) => `<span class="pill sev-x" style="--sev: var(--${SEV_STATUS[c.status] || 'ink-3'})" title="${esc(c.app)} · thấy ${esc(age(c.seen))}"><span class="dot"></span>${esc(c.app)}</span>`).join('')}</div>`
        : '<span class="dim">—</span>'}</td>
      <td class="r num">${p.calls ? nf(p.calls) : '<span class="dim">chưa gọi</span>'}</td>` +
      (anyBlocked
        ? (p.blocked
          ? `<td class="r num" style="color: var(--critical); font-weight:640">${nf(p.blocked)}</td>`
          : '<td class="r num dim">0</td>')
        : '') +
      `<td class="r num">${nf(p.tools)}</td>
      <td class="r nw">${countdown(p.tokenExpires)}</td>
      <td class="r num dim nw">${dt(p.last)}</td>
    </tr>`;

  const drawPeople = () => {
    const { from } = pageOf('people', D.people.length);
    $('people-n').textContent = D.people.length ? `· ${nf(D.people.length)}` : '';
    setHtml($('t-people'), !D.people.length
      ? '<tbody><tr><td class="dim">Không có ai khớp bộ lọc này.</td></tr></tbody>'
      : '<thead><tr><th>Người</th><th>Cắm bằng</th><th class="r">Lượt</th>' +
        (anyBlocked ? '<th class="r nw">Không dùng được</th>' : '') +
        '<th class="r">Tool</th><th class="r nw">Token còn</th><th class="r nw">Gần nhất</th></tr></thead><tbody>' +
        D.people.slice(from, from + PAGE_SIZE).map(personRow).join('') + '</tbody>');
    pager('people-pager', 'people', D.people.length, drawPeople);
  };
  drawPeople();

  // ── canary ───────────────────────────────────────────────────────────
  const cp = D.canaryProbes || [];
  const drawCanary = () => {
    const { from } = pageOf('canary', cp.length);
    $('canary-n').textContent = cp.length ? `· ${nf(cp.length)}` : '';
    setHtml($('t-canary'), !cp.length
      ? '<tbody><tr><td class="dim">Chưa có chi tiết probe — chờ nhịp tim canary kế tiếp.</td></tr></tbody>'
      : '<thead><tr><th>Tool</th><th>Kết quả</th><th class="r nw">Thời gian</th><th class="r nw">Mã lỗi</th></tr></thead><tbody>' +
        cp.slice(from, from + PAGE_SIZE).map((p) => `<tr>
          <td class="mono">${esc(p.name)}</td>
          <td class="nw"><span class="pill sev-x" style="--sev: var(--${p.ok ? 'good' : 'critical'})"><span class="dot"></span>${p.ok ? 'đạt' : 'hỏng'}</span></td>
          <td class="r num dim nw">${ms(p.ms)}</td>
          <td class="r num nw${p.code ? '' : ' dim'}">${p.code ? esc(p.code) : '—'}</td>
        </tr>`).join('') + '</tbody>');
    pager('canary-pager', 'canary', cp.length, drawCanary);
  };
  drawCanary();

  // Đóng/mở giữ NGOÀI render (biến `canaryOpen`) — trang tự nạp lại mỗi 30s,
  // để bên trong thì cứ nửa phút bảng lại tự sập xuống khi đang đọc.
  $('canary-box').hidden = !canaryOpen;
  const cbtn = $('watchdog').querySelector('.js-canary');
  if (cbtn) {
    // Chữ trên nhãn viết bằng textContent, KHÔNG nhét vào chuỗi HTML ở trên:
    // nhét vào thì mỗi lần đóng/mở là chuỗi đổi, là dựng lại cả dải canh gác —
    // đúng thứ setHtml sinh ra để tránh.
    cbtn.querySelector('.more').textContent = canaryOpen ? 'đóng ▴' : 'xem probe ▾';
    // Gắn MỘT lần cho mỗi lần dựng. Bỏ chốt này thì listener chồng lên nhau sau
    // mỗi vòng poll: bấm một cái, `canaryOpen` bị lật hai lần, bảng không nhúc
    // nhích, và nhìn ra y hệt một cái nút hỏng.
    if (watchdogRebuilt) {
      const toggle = () => { canaryOpen = !canaryOpen; renderTop(); };
      cbtn.addEventListener('click', toggle);
      cbtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    }
  }
  }

  // ══════════════════════════════════════════════════════════════════════════
  // BIỂU ĐỒ
  // ══════════════════════════════════════════════════════════════════════════

  const DIMS = SCHEMA.DIMENSIONS, MEASURES = SCHEMA.MEASURES;
  const dimOf = (k) => DIMS.find((d) => d.key === k) || DIMS[0];

  /**
   * Đếm số giá trị khác nhau của CHÍNH cột đang nhóm thì nhóm nào cũng ra 1.
   * Một cột toàn số 1 không sai, nhưng nó chiếm chỗ và bắt người đọc dừng lại
   * để hiểu ra rằng nó không nói gì — bỏ hẳn khỏi ô chọn lẫn bảng.
   */
  const REDUNDANT = { user_name: 'users', tool_name: 'tools' };
  const measuresFor = (dimKey) => MEASURES.filter((m) => m.key !== REDUNDANT[dimKey]);
  const measureOf = (k) => measuresFor(VIEW.dim).find((m) => m.key === k) || MEASURES[0];

  const KINDS = [
    { key: 'hbar', label: 'Thanh ngang' },
    { key: 'bar', label: 'Cột' },
    { key: 'line', label: 'Đường' },
  ];

  const fmt = (v, f) => {
    if (v == null) return '—';
    if (f === 'ms') return ms(v);
    if (f === 'pct') return String(v).replace('.', ',') + '%';
    return nf(v);
  };

  /**
   * Màu của một cột = nhóm đó có CHẶN người dùng không, không phải màu trang trí.
   *
   * Tô theo lượt KHÔNG DÙNG ĐƯỢC, không theo lỗi thô: thiếu quyền và sai tham
   * số là Lark đã trả lời, model đi tiếp được và người dùng không thấy gì. Tô
   * đỏ cả chúng thì gần như cột nào cũng đỏ, và một màu đỏ luôn bật là màu đỏ
   * không ai còn nhìn.
   *
   * Ba mức chứ không hai: 1 lượt hỏng trên 200 mà đỏ chót thì lần sau không ai
   * tin màu đỏ nữa.
   */
  const HEALTH = [
    { sev: 'good', label: 'Dùng được hết' },
    { sev: 'warning', label: 'Dưới 20% không dùng được' },
    { sev: 'critical', label: 'Từ 20% không dùng được' },
  ];
  const health = (r) => (!r.blocked ? 'good' : r.blockRate >= 20 ? 'critical' : 'warning');
  const fill = (r) => `var(--${health(r)})`;

  /** Trục tròn số: 2–5 vạch, không ra mấy con lẻ như 1.372,4. */
  function scale(max) {
    if (!(max > 0)) return { top: 1, step: 1 };
    const mag = Math.pow(10, Math.floor(Math.log10(max)));
    const r = max / mag;
    const step = r > 5 ? mag : r > 2 ? mag / 2 : mag / 5;
    return { top: Math.ceil(max / step) * step, step };
  }

  /** Chưa chọn kiểu thì đoán theo cột: trục thời gian vẽ đường, phân loại vẽ thanh. */
  const kindNow = () => VIEW.kind || (dimOf(VIEW.dim).time ? 'line' : 'hbar');

  function buildChartControls() {
    $('f-dim').innerHTML = DIMS.map((d) => `<option value="${esc(d.key)}">${esc(d.label)}</option>`).join('');
    $('f-kind').innerHTML = KINDS.map((k) => `<button type="button" data-v="${esc(k.key)}">${esc(k.label)}</button>`).join('');

    // Đổi cột nhóm → phải gọi lại máy chủ. Đổi phép đo / kiểu vẽ → cùng một tập
    // số, chỉ vẽ lại. Tách hai nhóm để thao tác thứ hai tức thì.
    // Đổi cột nhóm chỉ đụng khu biểu đồ, nên chỉ khu đó bận — không mờ cả trang.
    $('f-dim').addEventListener('change', async (e) => {
      VIEW.dim = e.target.value; VIEW.kind = ''; pushUrl();
      $('chart-card').classList.add('one-busy');
      try { await loadExplore(); } finally { $('chart-card').classList.remove('one-busy'); }
    });
    $('f-measure').addEventListener('change', (e) => { VIEW.measure = e.target.value; pushUrl(); drawChart(); });
    $('f-kind').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) { VIEW.kind = b.dataset.v; pushUrl(); drawChart(); }
    });
    $('f-csv').addEventListener('click', downloadCsv);
  }

  function syncChartControls() {
    // Danh sách phép đo dựng lại theo cột đang nhóm, nên phải vẽ lại ô chọn
    // mỗi lần — không thì mục vừa bị loại vẫn nằm đó và chọn được.
    const av = measuresFor(VIEW.dim);
    if (!av.some((m) => m.key === VIEW.measure)) VIEW.measure = 'calls';
    setHtml($('f-measure'), av.map((m) => `<option value="${esc(m.key)}">${esc(m.label)}</option>`).join(''));
    $('f-dim').value = VIEW.dim;
    $('f-measure').value = VIEW.measure;
    for (const b of $('f-kind').children) b.setAttribute('aria-pressed', String(b.dataset.v === kindNow()));
  }

  // Trần số nhóm vẽ ra. 60 tool hay 40 người trên một biểu đồ là 40 nhãn không
  // đọc nổi; phần còn lại vẫn nằm đủ ở bảng bên dưới, và dòng tóm tắt nói rõ
  // đã cắt bao nhiêu — cắt âm thầm thì biểu đồ trông như đã bày hết.
  const MAX_BARS = 25;

  function drawChart() {
    if (!EX) return;
    syncChartControls();

    const dim = dimOf(VIEW.dim), me = measureOf(VIEW.measure), kind = kindNow();
    const val = (r) => r[me.key];
    // p50/p95 null nghĩa là không có mẫu thời gian nào — bỏ hẳn khỏi biểu đồ,
    // vẽ thành 0 sẽ đọc thành "nhanh tức thì".
    let rows = EX.rows.filter((r) => val(r) != null && (me.zeroable || val(r) > 0));

    // Trục thời gian giữ nguyên thứ tự; phân loại thì xếp theo chính phép đo
    // đang xem — chọn "tỉ lệ lỗi" mà vẫn xếp theo lượt gọi là trả lời câu khác.
    if (!dim.time) rows = rows.slice().sort((a, b) => val(b) - val(a));
    const shown = rows.slice(0, MAX_BARS);
    const cutN = rows.length - shown.length;

    $('chart-title').textContent = `${me.label} theo ${dim.label.toLowerCase()}`;
    setHtml($('summary'), [
      `<span>Nguồn dữ liệu <b>${nf(EX.total)}</b> lượt gọi</span>`,
      `<span>Gộp thành <b>${nf(EX.groups)}</b> nhóm</span>`,
      EX.skipped ? `<span>Bỏ qua <b>${nf(EX.skipped)}</b> lượt chưa ghi cột này</span>` : '',
      cutN > 0 ? `<span>Biểu đồ hiện <b>${nf(shown.length)}</b> nhóm lớn nhất, còn <b>${nf(cutN)}</b> ở bảng dưới</span>` : '',
    ].filter(Boolean).join(''));

    /**
     * Với phép đo "Lượt gọi", cột vẽ CHỒNG: phần chạy được xanh, phần bị chặn
     * đỏ nối tiếp. Đây chính là thứ hai biểu đồ cũ ở đầu trang làm được — gộp
     * về một chỗ mà đánh rơi nó thì cái mới nghèo hơn cái nó vừa thay.
     *
     * Chỉ áp cho `calls`: chồng "p95" hay "tỉ lệ lỗi" lên nhau thì hai phần
     * cộng lại không ra con số nào có nghĩa.
     */
    const stacked = me.key === 'calls' && shown.some((r) => r.blocked);
    const seen = [...new Set(shown.map(health))];
    setHtml($('legend'), stacked
      ? '<span><i style="background:var(--good)"></i>Chạy được</span>'
        + '<span><i style="background:var(--critical)"></i>Không dùng được</span>'
      // Chú giải chỉ có nghĩa khi thật sự có nhiều màu trên biểu đồ — mọi nhóm
      // đều sạch lỗi thì ba ô màu chỉ là nhiễu.
      : seen.length < 2 ? ''
        : HEALTH.filter((h) => seen.includes(h.sev))
          .map((h) => `<span><i style="background: var(--${h.sev})"></i>${esc(h.label)}</span>`).join(''));

    // Vẽ lại biểu đồ là huỷ mọi <rect>/<circle> đang có. Vòng poll 30s chạy
    // qua đây, nên nếu SVG không đổi thì đừng đụng vào: con trỏ đang đặt trên
    // một cột sẽ mất tooltip giữa chừng, và gắn lại bindTip lên phần tử cũ là
    // chồng listener.
    const chartRebuilt = setHtml($('chart'), !shown.length
      ? emptyChart()
      : kind === 'hbar' ? hbar(shown, me, stacked)
        : kind === 'bar' ? vbar(shown, me, stacked) : line(shown, me));

    if (chartRebuilt) $('chart').querySelectorAll('[data-i]').forEach((el) => {
      const r = shown[+el.dataset.i];
      bindTip(el, `<b>${esc(cut(r.key, 40))}</b><br>${esc(me.label)}: ${esc(fmt(r[me.key], me.fmt))}<br>
        ${nf(r.calls)} lượt · p95 ${ms(r.p95)}` +
        (r.blocked ? `<br>${nf(r.blocked)} không dùng được (${String(r.blockRate).replace('.', ',')}%)` : ''));
    });

    drawTable(rows, me, dim);
  }

  /**
   * Rỗng vì KHÔNG CÓ GÌ, hay rỗng vì lọc quá tay? Hai chuyện khác nhau, và câu
   * thứ hai có cách sửa ngay tại chỗ. Một biểu đồ trống không chú thích thì
   * đọc thành "hệ thống chết".
   */
  function emptyChart() {
    const filtered = FILTER.user || FILTER.app;
    return `<div class="empty">
      <div class="empty-t">Không có lượt gọi nào trong khoảng này${filtered ? ' với bộ lọc đang bật' : ''}.</div>
      ${filtered ? '<button class="btn" onclick="document.getElementById(\'f-reset\').click()">Bỏ lọc người / ứng dụng</button>' : ''}
    </div>`;
  }

  /** Thanh ngang — mặc định cho cột phân loại, vì tên người và tên tool đều dài. */
  function hbar(rows, me, stacked) {
    const W = 1000, rowH = 30, LW = 268, PR = 92, H = rows.length * rowH + 6;
    const max = Math.max(...rows.map((r) => r[me.key]), 0);
    const track = W - LW - PR;
    let s = '';
    rows.forEach((r, i) => {
      const y = i * rowH + 5;
      const w = max > 0 ? Math.max(2, (r[me.key] / max) * track) : 2;
      const bad = stacked && r.blocked ? Math.max(2, (r.blocked / max) * track) : 0;
      const ok = Math.max(0, w - bad);
      s += `<text x="0" y="${y + 14}" font-size="13.5" fill="var(--ink-2)"${dimOf(VIEW.dim).mono ? ' class="mono"' : ''}>${esc(cut(r.key, 34))}</text>`;
      // Vẽ nền đỏ hết bề rộng rồi phủ phần xanh lên: hai hình chữ nhật bo góc
      // đặt cạnh nhau sẽ hở một khe sáng ở chỗ nối.
      s += `<rect x="${LW}" y="${y + 3}" width="${w}" height="16" rx="5" fill="${bad ? 'var(--critical)' : fill(r)}"/>`;
      if (bad && ok > 0) {
        s += `<rect x="${LW}" y="${y + 3}" width="${ok}" height="16" rx="5" fill="var(--good)"/>`;
        s += `<rect x="${LW + Math.max(0, ok - 5)}" y="${y + 3}" width="5" height="16" fill="var(--good)"/>`;
      }
      s += `<rect x="${LW}" y="${y + 3}" width="${Math.min(w, 5)}" height="16" fill="${bad && ok <= 0 ? 'var(--critical)' : bad ? 'var(--good)' : fill(r)}"/>`;
      s += `<rect data-i="${i}" x="${LW}" y="${y + 3}" width="${w}" height="16" fill="transparent"/>`;
      s += `<text x="${LW + w + 9}" y="${y + 15}" font-size="12.5" font-weight="600" fill="var(--ink-2)" class="num">${esc(fmt(r[me.key], me.fmt))}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(me.label)}">${s}</svg>`;
  }

  /** Cột dọc — hợp với ngày/giờ, ít nhóm. */
  function vbar(rows, me, stacked) {
    const H = 320, PL = 62, PR = 10, PT = 24, PB = 46;
    // Ít nhóm thì cột DÀY hẳn ra thay vì để nửa thẻ trống — bản cũ chốt bề rộng
    // nên 5 ngày dữ liệu vẽ xong còn thừa hơn nửa chiều ngang.
    const band = rows.length < 10 ? Math.min(150, 900 / rows.length) : Math.max(30, Math.min(90, 940 / rows.length));
    const W = Math.max(360, PL + band * rows.length + PR);
    const { top, step } = scale(Math.max(...rows.map((r) => r[me.key]), 0));
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const cx = (i) => PL + band * (i + 0.5);
    const bw = Math.min(74, band * 0.56);
    // Nhãn số trên đầu cột chỉ khi cột đủ thưa — 40 cột thì chúng đè lên nhau.
    const showVal = rows.length <= 16;

    let s = '';
    for (let t = 0; t <= top + 1e-9; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>`;
      s += `<text x="${PL - 9}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${esc(fmt(t, me.fmt))}</text>`;
    }
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)"/>`;

    /** Khối bo góc trên, đáy vuông để neo vào trục (hoặc vào khối bên dưới). */
    const block = (x0, yT, h, color) => (h <= 0 ? '' :
      `<rect x="${x0}" y="${yT}" width="${bw}" height="${Math.max(2, h)}" rx="5" fill="${color}"/>` +
      `<rect x="${x0}" y="${yT + Math.max(0, Math.max(2, h) - 5)}" width="${bw}" height="5" fill="${color}"/>`);

    rows.forEach((r, i) => {
      const x0 = cx(i) - bw / 2, v = r[me.key];
      if (stacked) {
        const okN = Math.max(0, v - r.blocked);
        s += block(x0, y(okN), y(0) - y(okN), 'var(--good)');
        s += block(x0, y(v), y(okN) - y(v), 'var(--critical)');
      } else {
        s += block(x0, y(v), y(0) - y(v), fill(r));
      }
      // Vùng bắt chuột phủ cả cột — bắt theo từng khối thì tooltip nhấp nháy
      // mỗi lần con trỏ đi qua ranh giới xanh/đỏ.
      s += `<rect data-i="${i}" x="${x0}" y="${y(v)}" width="${bw}" height="${Math.max(2, y(0) - y(v))}" fill="transparent"/>`;
      if (showVal) {
        s += `<text x="${cx(i)}" y="${y(v) - 6}" text-anchor="middle" font-size="13" font-weight="660" fill="var(--ink-2)" class="num">${esc(fmt(v, me.fmt))}</text>`;
      }
      // Nhãn trục X xoay 40° khi tên dài — nằm ngang thì chúng chồng lên nhau.
      const lb = esc(cut(r.key, 16));
      s += String(r.key).length > 6
        ? `<text x="${cx(i)}" y="${H - PB + 18}" font-size="11" fill="var(--ink-3)" text-anchor="end" transform="rotate(-40 ${cx(i)} ${H - PB + 18})">${lb}</text>`
        : `<text x="${cx(i)}" y="${H - PB + 18}" font-size="12.5" fill="var(--ink-3)" text-anchor="middle" class="num">${lb}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${esc(me.label)}" style="max-width:${W}px">${s}</svg>`;
  }

  /** Đường — mặc định cho trục thời gian, vì hình dạng xu hướng mới là thứ cần đọc. */
  function line(rows, me) {
    const W = 1000, H = 320, PL = 62, PR = 16, PT = 22, PB = 42;
    const { top, step } = scale(Math.max(...rows.map((r) => r[me.key]), 0));
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const x = (i) => (rows.length === 1 ? (PL + W - PR) / 2 : PL + ((W - PL - PR) * i) / (rows.length - 1));

    let s = '';
    for (let t = 0; t <= top + 1e-9; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>`;
      s += `<text x="${PL - 9}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${esc(fmt(t, me.fmt))}</text>`;
    }
    const pts = rows.map((r, i) => `${x(i)},${y(r[me.key])}`).join(' ');
    s += `<polygon points="${PL},${y(0)} ${pts} ${x(rows.length - 1)},${y(0)}" fill="var(--wash)"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach((r, i) => {
      // Đường giữ một màu để đọc được hình dạng xu hướng; CHẤM mới đổi màu theo
      // sức khoẻ của ngày đó. Đổi màu cả đường thì nó vỡ thành từng khúc rời.
      s += `<circle cx="${x(i)}" cy="${y(r[me.key])}" r="5" fill="var(--card)" stroke="${fill(r)}" stroke-width="3"/>`;
      // Vùng bắt chuột rộng hơn chấm — chấm 4px thì phải rê rất khéo mới trúng.
      s += `<circle data-i="${i}" cx="${x(i)}" cy="${y(r[me.key])}" r="13" fill="transparent"/>`;
      // Nhãn thưa dần khi nhiều điểm, để trục X không thành một vệt chữ đè nhau.
      const every = Math.ceil(rows.length / 14);
      if (i % every === 0 || i === rows.length - 1) {
        s += `<text x="${x(i)}" y="${H - PB + 20}" text-anchor="middle" font-size="11" fill="var(--ink-3)" class="num">${esc(cut(r.key, 10))}</text>`;
      }
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(me.label)}">${s}</svg>`;
  }

  // ── Bảng số ────────────────────────────────────────────────────────────
  function drawTable(rows, me, dim) {
    $('rows-n').textContent = rows.length ? `· ${nf(rows.length)} nhóm` : '';
    const cls = dim.mono ? 'mono' : '';
    const MS = measuresFor(dim.key);
    // Nhóm theo tool ra 39 dòng, theo giờ ra 24 — đổ hết xuống thì bảng dài
    // gấp ba biểu đồ ngay trên nó. Phân trang dùng chung với bảng người.
    const { from: exFrom } = pageOf('exrows', rows.length);
    setHtml($('t-rows'), !rows.length
      ? '<tbody><tr><td class="dim">Không có nhóm nào để hiện.</td></tr></tbody>'
      : `<thead><tr><th>${esc(dim.label)}</th>` +
        MS.map((m) => `<th class="r nw"${m.key === me.key ? ' style="color:var(--series-1)"' : ''}>${esc(m.label)}</th>`).join('') +
        '<th class="r nw">Gần nhất</th></tr></thead><tbody>' +
        rows.slice(exFrom, exFrom + PAGE_SIZE).map((r) => `<tr><td class="${cls}">${esc(cut(r.key, 48))}</td>` +
          // Cột đang được vẽ thì đậm lên; các cột còn lại mờ đi. Bảng bảy cột mà
          // cùng một sắc độ thì không ai tìm ra cột mình vừa chọn ở biểu đồ trên.
          MS.map((m) => m.key === me.key
            ? `<td class="r num nw" style="font-weight:660">${esc(fmt(r[m.key], m.fmt))}</td>`
            : `<td class="r num nw dim">${esc(fmt(r[m.key], m.fmt))}</td>`).join('') +
          `<td class="r num dim nw">${dt(r.last)}</td></tr>`).join('') +
        '</tbody>');
    pager('rows-pager', 'exrows', rows.length, () => drawTable(rows, me, dim));
  }

  function downloadCsv() {
    if (!EX) return;
    const dim = dimOf(VIEW.dim), MS = measuresFor(dim.key);
    const head = [dim.label, ...MS.map((m) => m.label), 'Gần nhất'];
    // Bọc mọi ô trong ngoặc kép: tên người có dấu phẩy, và Excel sẽ tách nhầm cột.
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = [head.map(q).join(','), ...EX.rows.map((r) =>
      [r.key, ...MS.map((m) => r[m.key] ?? ''), r.last || ''].map(q).join(','))].join('\r\n');
    // BOM ﻿: thiếu nó là Excel mở ra tiếng Việt thành ký tự rác.
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    const r = activeRange();
    // Tên file mang theo cả khoảng VÀ bộ lọc: hai lần tải về cùng tên mà khác
    // nội dung là kiểu nhầm không ai truy ra được sau một tuần.
    a.href = url;
    a.download = ['mcp', VIEW.dim, r.from, r.to, FILTER.user && 'nguoi', FILTER.app].filter(Boolean).join('-') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // NẠP DỮ LIỆU
  // ══════════════════════════════════════════════════════════════════════════

  const REFRESH_MS = 30000;
  const stamp = (ok) => {
    $('stamp').innerHTML = ok
      ? `<span class="live"></span>Cập nhật <b>${new Date().toLocaleTimeString('vi-VN', { hour12: false })}</b>`
      : '<span class="live off"></span>Mất kết nối — đang giữ số cũ';
    $('stamp').classList.toggle('stale', !ok);
  };

  const getJson = async (url) => {
    const r = await fetch(url, { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  };

  /** Làm mờ TẠI CHỖ, không thay nội dung bằng chữ "Đang tính…". Thay nội dung
   *  là thẻ tụt chiều cao và cả trang nhảy một cái mỗi lần bấm bộ lọc. */
  const busy = (on) => $('wrap').classList.toggle('busy', on);

  async function loadTop() {
    DATA = await getJson('/api/data?' + filterQuery());
    /**
     * Máy chủ đã sửa khoảng (URL dán tay đòi 2 năm chẳng hạn) thì SỬA LUÔN
     * trạng thái trang cho khớp. Không đồng bộ lại thì trang cứ đề nghị một
     * khoảng, máy chủ cứ trả về khoảng khác, và nhãn trên nút mãi mãi nói khác
     * con số bên dưới nó.
     */
    const r = DATA.range;
    if (r && r.clamped && r.clamped.length) {
      Object.assign(FILTER, { preset: r.preset || '', from: r.preset ? '' : r.from, to: r.preset ? '' : r.to });
      pushUrl();
    }
    renderTop();
    syncFilterBar();
  }

  /**
   * Nhánh tĩnh nằm ở ĐÂY, không ở chỗ gọi.
   *
   * Bản đầu chỉ xử lý bản tĩnh trong applyFilter, nên ô "Nhóm theo" — vốn gọi
   * thẳng loadExplore — vẫn đi tìm /api/explore và mở preview.html ra đổi cột
   * là biểu đồ chết với dòng "Không tải được". Chặn một nơi duy nhất thì không
   * còn đường nào đi vòng qua được.
   */
  async function loadExplore() {
    if (STATIC) {
      EX = (BAKED_EX && BAKED_EX.byDim[VIEW.dim]) || null;
      if (EX) drawChart();
      else $('chart').innerHTML = '<div class="empty">Bản xem trước này chưa nướng số cho cột đó.</div>';
      return;
    }
    try {
      EX = await getJson(`/api/explore?dim=${encodeURIComponent(VIEW.dim)}&` + filterQuery());
      drawChart();
    } catch (e) {
      $('chart').innerHTML = `<div class="empty" style="color:var(--critical)">Không tải được biểu đồ: ${esc(e.message)}</div>`;
    }
  }

  /**
   * Đổi bộ lọc → cả hai khu đi lấy lại số, SONG SONG.
   *
   * `busy` chỉ bật cho thao tác NGƯỜI DÙNG vừa bấm, tuyệt đối không cho vòng
   * poll 30s. Bản đầu để nó trong loadExplore nên cả trang mờ đi rồi sáng lại
   * hai lần mỗi phút — ngay giữa lúc có người đang đọc bảng, và không hề có
   * thao tác nào để giải thích cái nháy đó. Chỉ báo bận khi có người đang chờ.
   */
  async function applyFilter() {
    // Bản tĩnh đã khoá mọi ô lọc toàn cục nên không có đường nào tới đây. Chốt
    // lại một lần nữa cho chắc: một lần gọi lọt là một lần fetch chết vô cớ.
    if (STATIC) return;
    pushUrl();
    syncFilterBar();
    busy(true);
    try {
      const [a] = await Promise.allSettled([loadTop(), loadExplore()]);
      stamp(a.status !== 'rejected');
    } finally {
      busy(false);
    }
  }

  /** Nạp lại lặng lẽ — dùng cho poll định kỳ. Không mờ trang, không giật. */
  async function refreshQuiet() {
    const r = await Promise.allSettled([loadTop(), loadExplore()]);
    stamp(!r.some((x) => x.status === 'rejected'));
  }

  (async function boot() {
    buildFilterBar();
    buildChartControls();

    if (STATIC) {
      DATA = BAKED;
      renderTop();
      // Bộ lọc TRẢ về đúng khoảng đã nướng trước khi vẽ thanh: mặc định của
      // trang là "30 ngày tính tới hôm nay", mà bản nướng thì đứng yên ở ngày
      // build — mở lại sau một tuần là nhãn nói một khoảng, số nói khoảng khác.
      const b = (BAKED.range) || {};
      Object.assign(FILTER, { preset: b.preset || '', from: b.preset ? '' : b.from, to: b.preset ? '' : b.to });
      syncFilterBar();
      await loadExplore();
      $('stamp').innerHTML = '<span class="live off"></span>Bản xem trước tĩnh';
      return;
    }

    try {
      // Hai khu gọi hai endpoint khác nhau và khởi động ĐỘC LẬP: một bên hỏng
      // thì bên kia vẫn hiện số. Trước đây initExplore chạy sau render nên
      // /api/data chết là kéo cả biểu đồ chết theo, dù nó không liên quan.
      await Promise.allSettled([loadTop(), loadExplore()]);
      stamp(true);
    } catch (e) {
      document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
        `<div class="card pad" style="border-color: var(--critical)">Không tải được dữ liệu: ${esc(e.message)}</div>`);
      return;
    }

    // Lỗi mạng thoáng qua thì giữ số cũ, không làm trắng trang — chỉ đổi dấu
    // hiệu ở góc trên để người xem biết con số đang đứng yên.
    /**
     * Hàng rào cuối cùng cho cùng một lớp lỗi.
     *
     * `setHtml` đã lo phần lớn: poll mà số không đổi thì không đụng DOM. Nhưng
     * đúng lúc có người vừa gọi tool thì số ĐỔI THẬT, DOM dựng lại thật, và nếu
     * nó rơi vào giữa `mousedown` với `mouseup` thì cú bấm vẫn bốc hơi.
     *
     * Nút chuột đang giữ = có một thao tác đang dở. Hoãn 30 giây nữa, số liệu
     * không mất đi đâu cả.
     */
    let pressing = false;
    addEventListener('pointerdown', () => { pressing = true; }, true);
    for (const ev of ['pointerup', 'pointercancel', 'blur']) {
      addEventListener(ev, () => { pressing = false; }, true);
    }

    setInterval(() => {
      // Đang mở lịch thì hoãn: vẽ lại giữa chừng là lịch tự đóng dưới tay người
      // đang chọn dở.
      if (calOpen || pressing) return;
      refreshQuiet();
    }, REFRESH_MS);
  })();
</script>
