<title>Lark MCP remote — bảng vận hành</title>

<style>/*__CSS__*/</style>

<div class="wrap">
  <header>
    <div>
      <h1>Lark MCP remote</h1>
      <nav class="nav">
        <a href="/" aria-current="page">Bảng vận hành</a>
        <a href="/explore">Biểu đồ</a>
      </nav>
    </div>
    <div class="head-right">
      <div class="clock" id="clock"></div>
      <div id="verdict"></div>
    </div>
  </header>

  <!-- Tầng 1: dải canh gác -->
  <section class="statusbar card" id="watchdog"></section>

  <!-- Tầng 2: KPI -->
  <section class="g4" id="kpi"></section>

  <!-- Tầng 3: xu hướng -->
  <section class="g2">
    <div class="card pad">
      <h2>Lượt gọi theo ngày</h2>
      <div id="c-daily"></div>
    </div>
    <div class="card pad">
      <h2>Tool dùng nhiều nhất</h2>
      <div id="c-tools"></div>
    </div>
  </section>

  <!-- Tầng 4: sử dụng -->
  <div class="zone">Sử dụng</div>

  <!-- MỘT bảng người, ăn nguyên chiều ngang. Trước đây là hai bảng "Người
       dùng" và "Chỗ cắm" đặt cạnh nhau — hai lát cắt của cùng một tập người,
       bắt phải đối chiếu bằng mắt xem dòng nào là ai. -->
  <section class="card pad">
    <h2>Người dùng <span class="n" id="people-n"></span></h2>
    <div class="scroll"><table class="wide" id="t-people"></table></div>
    <div id="people-pager"></div>
  </section>

  <section class="card pad">
    <h2>Tool chưa ai gọi <span class="n" id="unused-n"></span></h2>
    <div class="tags" id="unused"></div>
  </section>
</div>

<div id="tip" role="status"></div>

<script>
  /**
   * Mọi phần của trang đều do JS dựng, nên một lỗi bất kỳ là trắng nguyên trang.
   * Bắt lỗi ra màn hình để lần sau trang hỏng còn nói được nó hỏng ở đâu.
   */
  addEventListener('error', (e) => {
    const w = document.querySelector('.wrap');
    if (!w) return;
    w.insertAdjacentHTML('afterbegin',
      '<div class="card pad" style="border-color: var(--critical)">' +
      '<h2 style="color: var(--critical)">Trang dựng lỗi</h2>' +
      '<div class="mono" style="font-size: 12px">' + String(e.message || e.error || 'không rõ') + '</div></div>');
  });

  const BAKED = /*__DATA__*/null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = (n) => new Intl.NumberFormat('vi-VN').format(n);
  const dt = (s) => (s ? new Date(s).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
  const day2 = (s) => s.slice(8, 10) + '/' + s.slice(5, 7);
  // Locale vi ngăn nghìn bằng dấu chấm: nf(1274)+' ms' đọc thành 1,274 ms.
  const ms = (v) => (v == null ? '—' : v < 1000 ? v + ' ms' : (v / 1000).toFixed(2).replace('.', ',') + ' s');
  const ageH = (s) => (s ? (Date.now() - new Date(s)) / 3600000 : Infinity);
  const age = (s) => {
    const h = ageH(s);
    if (!isFinite(h)) return 'chưa có';
    if (h < 1) return Math.round(h * 60) + ' phút trước';
    if (h < 48) return h.toFixed(1).replace('.0', '') + ' giờ trước';
    return Math.round(h / 24) + ' ngày trước';
  };

  const tip = $('tip');
  function bindTip(el, html) {
    el.setAttribute('tabindex', '0');
    const show = (e) => {
      tip.innerHTML = html; tip.classList.add('on');
      const r = el.getBoundingClientRect();
      tip.style.left = Math.min(innerWidth - 260, Math.max(8, (e && e.clientX ? e.clientX : r.left + r.width / 2) - 60)) + 'px';
      tip.style.top = Math.max(8, r.top - 42) + 'px';
    };
    const hide = () => tip.classList.remove('on');
    el.addEventListener('mouseenter', show); el.addEventListener('mousemove', show);
    el.addEventListener('mouseleave', hide); el.addEventListener('focus', show); el.addEventListener('blur', hide);
  }

  let LAST = null;  // dữ liệu lần render gần nhất — để vẽ lại mà khỏi gọi mạng

  /**
   * ── Phân trang ────────────────────────────────────────────────────────
   *
   * Số trang giữ NGOÀI hàm render, vì trang tự nạp lại dữ liệu mỗi 30s: để
   * bên trong thì cứ nửa phút người đọc lại bị ném về trang 1 giữa chừng.
   *
   * Chỉ vẽ thanh chuyển trang khi thật sự tràn — bảng 7 dòng mà vẫn có
   * "Trang 1/1" là thêm một dòng chữ không nói gì.
   */
  const PAGE_SIZE = 12;
  const pageAt = {};
  const pageOf = (key, total) => {
    const max = Math.max(1, Math.ceil(total / PAGE_SIZE));
    pageAt[key] = Math.min(pageAt[key] || 1, max);
    return { page: pageAt[key], max, from: (pageAt[key] - 1) * PAGE_SIZE };
  };

  function pager(elId, key, total, redraw) {
    const { page, max } = pageOf(key, total);
    const el = $(elId);
    if (!el) return;
    if (max < 2) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="pager">
        <button class="btn" data-d="-1"${page === 1 ? ' disabled' : ''}>← Trước</button>
        <span class="dim">Trang <b>${page}</b>/${max} · ${nf(total)} dòng</span>
        <button class="btn" data-d="1"${page === max ? ' disabled' : ''}>Sau →</button>
      </div>`;
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      pageAt[key] = Math.min(max, Math.max(1, page + Number(b.dataset.d)));
      redraw();
    }));
  }

  /**
   * Chú giải hai màu, chỉ vẽ khi biểu đồ THẬT SỰ có phần đỏ. Xanh lá không
   * phải "tốt", nó là "chạy được"; đỏ không phải "lỗi", nó là "người dùng
   * không dùng được" — hai chữ đó khác nhau và bảng này chỉ đếm chữ thứ hai.
   */
  const LEGEND = (show) => (show
    ? '<div class="legend"><span><i style="background:var(--good)"></i>Chạy được</span>' +
      '<span><i style="background:var(--critical)"></i>Không dùng được</span></div>'
    : '');

  function render(DATA) {
  LAST = DATA;
  // ── canh gác + phán quyết tổng ───────────────────────────────────────
  const w = DATA.watchdog, sess = w.session || {};
  const cAge = ageH(w.canary && w.canary.at), iAge = ageH(w.ingest && w.ingest.at);
  const ICON = { good: '●', warning: '▲', serious: '▲', critical: '■' };
  const RANK = { good: 0, warning: 1, serious: 2, critical: 3 };

  const watches = [
    { sev: !w.canary ? 'critical' : cAge > 36 ? 'critical' : w.canary.failing ? 'serious' : 'good',
      k: 'Canary', v: !w.canary ? 'Không có nhịp tim' : `${w.canary.probes} probe · ${w.canary.failing} lỗi`,
      d: cAge > 36 ? 'Quá 36h không có nhịp tim — bộ phát hiện coi như đã chết' : age(w.canary && w.canary.at) },
    { sev: sess.deadCount ? 'critical' : sess.dyingCount ? 'warning' : 'good',
      k: 'Phiên Lark', v: `${sess.alive ?? '—'} sống`,
      d: sess.deadCount ? `${sess.deadCount} vừa mất` : sess.dyingCount ? `${sess.dyingCount} sắp hết hạn` : 'Không có phiên sắp hết' },
    { sev: iAge > 24 ? 'critical' : iAge > 6 ? 'warning' : 'good',
      k: 'Đường nạp dữ liệu', v: age(w.ingest && w.ingest.at),
      d: iAge > 6 ? 'Lâu bất thường — kiểm tra server còn ghi audit không' : 'Dòng audit gần nhất còn tươi' },
  ];

  $('watchdog').innerHTML = watches.map((c) => `<div class="item sev-x" style="--sev: var(--${c.sev})">
      <div class="ic" aria-hidden="true">${ICON[c.sev]}</div>
      <div><div class="k">${esc(c.k)}</div><div class="v">${esc(c.v)}</div><div class="d">${esc(c.d)}</div></div>
    </div>`).join('');

  const worst = watches.reduce((a, c) => (RANK[c.sev] > RANK[a] ? c.sev : a), 'good');
  const VERDICT = {
    good: ['●', 'Hệ thống ổn'], warning: ['▲', 'Có cảnh báo'],
    serious: ['▲', 'Có sự cố'], critical: ['■', 'Cần chú ý ngay'],
  };
  $('verdict').innerHTML = `<span class="verdict" style="--sev: var(--${worst}); color: var(--${worst})">
      <span class="dot"></span>${VERDICT[worst][1]}</span>`;

  // ── KPI ──────────────────────────────────────────────────────────────
  const k = DATA.kpi;
  // Chỉ đếm lượt CHẶN người dùng — lúc model phải nói "không dùng được tool
  // này". Thiếu quyền, sai tham số, quá hạn mức đều là Lark đã trả lời và model
  // đi tiếp được, đưa lên đây thì bảng lúc nào cũng đỏ trong khi tool chạy mượt.
  const blockSev = k.blockRate >= 5 ? 'critical' : k.blocked ? 'warning' : 'good';
  $('kpi').innerHTML = [
    { hero: 1, k: 'Lượt gọi', v: nf(k.calls), d: `${DATA.daily.length} ngày có dữ liệu` },
    { k: 'Không dùng được', v: nf(k.blocked), sev: blockSev,
      d: k.blocked ? `${String(k.blockRate).replace('.', ',')}% lượt gọi bị chặn` : 'Không lượt nào bị chặn' },
    // "Đã cắm" là số người ĐĂNG NHẬP được, "đã gọi" là số người thật sự dùng.
    // Chênh lệch giữa hai số là thứ cần biết khi vừa phát link cho phòng ban.
    { k: 'Người đã cắm', v: nf(k.connected ?? k.users), d: `${nf(k.users)} người đã gọi tool` },
    { k: 'Độ trễ p95', v: ms(k.p95), d: 'trung vị ' + ms(k.p50) },
    { k: 'Tool đã dùng', v: `${k.toolsUsed}<small>/${k.toolsTotal}</small>`, d: `${DATA.unused.length} chưa ai gọi` },
  ].map((t) => `<div class="card kpi${t.hero ? ' hero' : ''}">
      <div class="k">${esc(t.k)}</div>
      <div class="v num"${t.sev ? ` style="color: var(--${t.sev})"` : ''}>${t.v}</div>
      <div class="d">${esc(t.d)}</div></div>`).join('');

  // ── cột: lượt gọi theo ngày ─────────────────────────────────────────
  (function () {
    const d = DATA.daily;
    if (!d.length) { $('c-daily').innerHTML = '<div class="ok-empty dim">Chưa có dữ liệu theo ngày.</div>'; return; }
    // Ít ngày thì đừng kéo giãn hết chiều ngang — cột dày vừa phải, canh trái,
    // tránh cảnh 3 cột lọt thỏm giữa khoảng trắng mênh mông.
    const band = d.length < 8 ? 58 : (520 - 42) / d.length;
    const W = Math.max(300, 42 + band * d.length + 6), H = 190, PL = 36, PR = 6, PT = 14, PB = 24;
    const max = Math.max(1, ...d.map((x) => x.calls));
    const step = Math.max(1, Math.pow(10, Math.floor(Math.log10(max))) / 2);
    const top = Math.ceil(max / step) * step;
    const bw = Math.min(26, band * 0.5);
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const cx = (i) => PL + band * (i + 0.5);

    let s = '';
    for (let t = 0; t <= top; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
      s += `<text x="${PL - 7}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)" class="num">${nf(t)}</text>`;
    }
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)" stroke-width="1"/>`;

    /** Khối bo góc trên, đáy vuông để neo vào trục (hoặc vào khối bên dưới). */
    const block = (x0, yT, h, color) => h <= 0 ? '' :
      `<rect x="${x0}" y="${yT}" width="${bw}" height="${Math.max(2, h)}" rx="4" fill="${color}"/>` +
      `<rect x="${x0}" y="${yT + Math.max(0, Math.max(2, h) - 4)}" width="${bw}" height="4" fill="${color}"/>`;

    d.forEach((x, i) => {
      // Cột CHỒNG: chạy được xanh ở dưới, bị chặn đỏ ở trên. Một cột đơn sắc
      // chỉ nói được "hôm đó bận hay rảnh"; chồng lên thì nó nói luôn "hôm đó
      // có ai không dùng được không" — mà đó mới là câu đang hỏi.
      const x0 = cx(i) - bw / 2, okN = x.calls - x.blocked;
      s += block(x0, y(okN), y(0) - y(okN), 'var(--good)');
      s += block(x0, y(x.calls), y(okN) - y(x.calls), 'var(--critical)');
      // Vùng bắt chuột phủ cả cột — bắt theo từng khối thì tooltip nhấp nháy
      // mỗi lần con trỏ đi qua ranh giới xanh/đỏ.
      s += `<rect class="sg" x="${x0}" y="${y(x.calls)}" width="${bw}" height="${Math.max(2, y(0) - y(x.calls))}" fill="transparent" data-i="${i}"/>`;
      s += `<text x="${cx(i)}" y="${y(x.calls) - 5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink-2)" class="num">${nf(x.calls)}</text>`;
      s += `<text x="${cx(i)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--ink-3)" class="num">${day2(x.day)}</text>`;
    });
    // Chú giải chỉ hiện khi thật sự có màu thứ hai trên biểu đồ. Không ngày nào
    // bị chặn thì hai ô màu chỉ tổ làm người đọc đi tìm phần đỏ không tồn tại.
    $('c-daily').innerHTML = LEGEND(d.some((x) => x.blocked)) +
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Lượt gọi theo ngày" style="max-width:${W}px">${s}</svg>`;
    $('c-daily').querySelectorAll('.sg').forEach((el) => {
      const x = d[+el.dataset.i];
      bindTip(el, `<b>${day2(x.day)}</b><br>${nf(x.calls)} lượt gọi` +
        (x.blocked ? `<br>${nf(x.blocked)} không dùng được` : ''));
    });
  })();

  // ── thanh ngang: top tool ───────────────────────────────────────────
  (function () {
    const t = DATA.tools.slice(0, 10);
    if (!t.length) { $('c-tools').innerHTML = '<div class="ok-empty dim">Chưa có tool nào được gọi.</div>'; return; }
    const W = 520, rowH = 25, LW = 172, PR = 46, H = t.length * rowH + 4;
    const max = Math.max(1, ...t.map((x) => x.calls));
    const track = W - LW - PR;
    let s = '';
    t.forEach((x, i) => {
      const yy = i * rowH + 4, bw = Math.max(2, (x.calls / max) * track);
      // Cùng luật với cột theo ngày: phần xanh là lượt chạy được, phần đỏ nối
      // đuôi là lượt người dùng không dùng được. Tool đang hỏng thật lộ ra ngay
      // ở đây; tool chỉ bị Lark từ chối vì thiếu quyền thì vẫn xanh nguyên.
      const ew = x.blocked ? Math.max(2, (x.blocked / max) * track) : 0;
      const ok = Math.max(0, bw - ew);
      s += `<text x="0" y="${yy + 12}" font-size="11.5" fill="var(--ink-2)" class="mono">${esc(x.name)}</text>`;
      s += `<rect x="${LW}" y="${yy + 2}" width="${bw}" height="12" rx="4" fill="var(--critical)"/>`;
      s += ok > 0 ? `<rect x="${LW}" y="${yy + 2}" width="${ok}" height="12" rx="4" fill="var(--good)"/>` : '';
      s += `<rect x="${LW}" y="${yy + 2}" width="${Math.min(bw, 4)}" height="12" fill="var(--${ok > 0 ? 'good' : 'critical'})"/>`;
      s += `<rect class="br" x="${LW}" y="${yy + 2}" width="${bw}" height="12" fill="transparent" data-i="${i}"/>`;
      s += `<text x="${LW + bw + 7}" y="${yy + 12}" font-size="11" font-weight="600" fill="var(--ink-2)" class="num">${nf(x.calls)}</text>`;
    });
    $('c-tools').innerHTML = LEGEND(t.some((x) => x.blocked)) +
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tool dùng nhiều nhất">${s}</svg>`;
    $('c-tools').querySelectorAll('.br').forEach((el) => {
      const x = t[+el.dataset.i];
      bindTip(el, `<b>${esc(x.name)}</b><br>${nf(x.calls)} lượt · p95 ${ms(x.p95)}` +
        (x.blocked ? `<br>${nf(x.blocked)} không dùng được (${String(x.blockRate).replace('.', ',')}%)` : ''));
    });
  })();

  const count = (id, n) => { if ($(id)) $(id).textContent = n ? `· ${nf(n)}` : ''; };

  // ── người dùng ───────────────────────────────────────────────────────
  // Cột "Không dùng được" CHỈ hiện khi có người thật sự bị chặn. Một cột toàn
  // số 0 không nói gì mà vẫn bắt mắt dừng lại đọc — đúng thứ cần bỏ.
  const anyBlocked = DATA.people.some((p) => p.blocked);
  const SEV_STATUS = { active: 'good', revoked: 'critical', inactive: 'warning' };

  /**
   * Đồng hồ đếm ngược tới hạn refresh token — 7 ngày kể từ lần chạm cuối.
   * Hết hạn là người đó phải quét mã đăng nhập lại, nên đây là con số DUY NHẤT
   * trên bảng đòi hành động trước khi hỏng, chứ không phải báo sau khi hỏng.
   */
  const countdown = (iso) => {
    if (!iso) return '<span class="dim">—</span>';
    const h = (new Date(iso) - Date.now()) / 3600000;
    if (h <= 0) return '<span style="color:var(--critical);font-weight:640">đã hết hạn</span>';
    const sev = h < 24 ? 'critical' : h < 72 ? 'warning' : 'good';
    const txt = h < 48 ? `${Math.round(h)} giờ` : `${Math.floor(h / 24)} ngày ${Math.round(h % 24)} giờ`;
    return `<span style="color:var(--${sev})">${txt}</span>`;
  };

  const personRow = (p) => `<tr>
      <td>${esc(p.name || p.openId || '—')}</td>
      <td>${p.clients.length
        ? `<div class="chips">${p.clients.map((c) => `<span class="pill sev-x" style="--sev: var(--${SEV_STATUS[c.status] || 'ink-3'})" title="${esc(c.app)} · thấy ${esc(age(c.seen))}"><span class="dot"></span>${esc(c.app)}</span>`).join('')}</div>`
        : '<span class="dim">—</span>'}</td>
      <td class="r num">${p.calls ? nf(p.calls) : '<span class="dim">chưa gọi</span>'}</td>` +
      (anyBlocked
        ? (p.blocked
          ? `<td class="r num" style="color: var(--critical); font-weight:640">${nf(p.blocked)}</td>`
          : '<td class="r num dim">0</td>')
        : '') +
      `<td class="r num">${nf(p.tools)}</td>
      <td class="r nw">${countdown(p.tokenExpires)}</td>
      <td class="r num dim nw">${dt(p.last)}</td>
    </tr>`;

  const drawPeople = () => {
    const { from } = pageOf('people', DATA.people.length);
    count('people-n', DATA.people.length);
    $('t-people').innerHTML =
      '<thead><tr><th>Người</th><th>Cắm bằng</th><th class="r">Lượt</th>' +
      (anyBlocked ? '<th class="r nw">Không dùng được</th>' : '') +
      '<th class="r">Tool</th><th class="r nw">Token còn</th><th class="r nw">Gần nhất</th></tr></thead><tbody>' +
      DATA.people.slice(from, from + PAGE_SIZE).map(personRow).join('') + '</tbody>';
    pager('people-pager', 'people', DATA.people.length, drawPeople);
  };
  drawPeople();

  // ── tool chưa dùng ───────────────────────────────────────────────────
  count('unused-n', DATA.unused.length);
  $('unused').innerHTML = DATA.unused.length
    ? DATA.unused.map((n) => `<span class="tag mono">${esc(n)}</span>`).join('')
    : '<div class="ok-empty"><span class="ic">●</span>Mọi tool đều đã có người gọi.</div>';
  }

  // ── Đồng hồ real-time (góc trên) ─────────────────────────────────────
  const clock = $('clock');
  const tick = () => { if (clock) clock.textContent = new Date().toLocaleTimeString('vi-VN', { hour12: false }); };
  tick();
  setInterval(tick, 1000);

  // ── Tự cập nhật dữ liệu ──────────────────────────────────────────────
  // BAKED có sẵn = bản xem trước tĩnh (không backend) → render một lần.
  // BAKED null = bản live trên Vercel → fetch /api/data rồi poll lại mỗi 30s.
  const REFRESH_MS = 30000;
  const fetchData = async () => {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  };

  (async function boot() {
    if (BAKED) { render(BAKED); return; }
    try {
      render(await fetchData());
    } catch (e) {
      document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
        `<div class="card pad" style="border-color: var(--critical)">Không tải được dữ liệu: ${esc(e.message)}</div>`);
      return;
    }
    // Lỗi mạng thoáng qua thì giữ số cũ, không làm trắng trang.
    setInterval(async () => {
      try { render(await fetchData()); } catch (e) { console.warn('[refresh]', e.message); }
    }, REFRESH_MS);
  })();
</script>
