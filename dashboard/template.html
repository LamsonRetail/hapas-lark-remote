<title>Lark MCP remote — bảng vận hành</title>

<style>/*__CSS__*/</style>

<div class="wrap">
  <header>
    <div>
      <h1>Lark MCP remote</h1>
    </div>
    <div class="head-right">
      <div class="clock" id="clock"></div>
      <div id="verdict"></div>
    </div>
  </header>

  <!-- Tầng 1: dải canh gác -->
  <section class="statusbar card" id="watchdog"></section>

  <!-- Bảng canary nằm NGAY DƯỚI ô Canary của dải canh gác và mặc định đóng.
       Trước đây nó là một khu riêng ở giữa trang: 12 dòng "đạt" nằm chình ình
       trên đường đi mỗi lần cuộn, trong khi thứ cần biết hằng ngày chỉ là con
       số "0 lỗi" đã có sẵn ở dải trên. Mở ra khi muốn xem 12 cái đó là gì. -->
  <section class="card pad" id="canary-box" hidden>
    <h2>Probe canary <span class="n" id="canary-n"></span></h2>
    <div class="scroll"><table id="t-canary"></table></div>
    <div id="canary-pager"></div>
  </section>

  <!-- Tầng 2: KPI -->
  <section class="g4" id="kpi"></section>

  <!-- Tầng 3: xu hướng -->
  <section class="g2">
    <div class="card pad">
      <h2>Lượt gọi theo ngày</h2>
      <div id="c-daily"></div>
    </div>
    <div class="card pad">
      <h2>
        Tool <span class="n" id="tools-n"></span>
        <span class="spacer"></span>
        <span class="seg seg-sm" id="f-toolrank">
          <button type="button" data-v="top">Nhiều nhất</button>
          <button type="button" data-v="bottom">Ít nhất</button>
        </span>
      </h2>
      <div id="c-tools"></div>
    </div>
  </section>

  <!-- Tầng 4: sử dụng -->
  <div class="zone">Sử dụng</div>

  <!-- MỘT bảng người, ăn nguyên chiều ngang. Trước đây là hai bảng "Người
       dùng" và "Chỗ cắm" đặt cạnh nhau — hai lát cắt của cùng một tập người,
       bắt phải đối chiếu bằng mắt xem dòng nào là ai. -->
  <section class="card pad">
    <h2>Người dùng <span class="n" id="people-n"></span></h2>
    <div class="scroll"><table class="wide" id="t-people"></table></div>
    <div id="people-pager"></div>
  </section>

  <!-- Đào sâu: phần trước đây là trang /explore riêng -->
  <div class="zone">Đào sâu</div>
  <section class="card pad">
    <div class="controls">
      <div class="field">
        <label for="f-dim">Nhóm theo</label>
        <select id="f-dim"></select>
      </div>
      <div class="field">
        <label for="f-measure">Đo bằng</label>
        <select id="f-measure"></select>
      </div>
      <div class="field">
        <label for="f-user">Lọc người</label>
        <select id="f-user"></select>
      </div>
      <div class="field">
        <label>Khoảng</label>
        <div class="seg" id="f-days"></div>
      </div>
      <div class="field">
        <label>Kiểu vẽ</label>
        <div class="seg" id="f-kind"></div>
      </div>
    </div>
  </section>

  <section class="card pad">
    <h2 id="chart-title">Biểu đồ</h2>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend" style="margin-top:12px"></div>
    <div id="chart"></div>
  </section>

  <section class="card pad">
    <h2>
      Số liệu <span class="n" id="rows-n"></span>
      <span class="spacer"></span>
      <button class="btn" id="f-csv">Tải CSV</button>
    </h2>
    <div class="scroll"><table class="wide" id="t-rows"></table></div>
    <div id="rows-pager"></div>
  </section>
</div>

<div id="tip" role="status"></div>

<script>
  /**
   * Mọi phần của trang đều do JS dựng, nên một lỗi bất kỳ là trắng nguyên trang.
   * Bắt lỗi ra màn hình để lần sau trang hỏng còn nói được nó hỏng ở đâu.
   */
  addEventListener('error', (e) => {
    const w = document.querySelector('.wrap');
    if (!w) return;
    w.insertAdjacentHTML('afterbegin',
      '<div class="card pad" style="border-color: var(--critical)">' +
      '<h2 style="color: var(--critical)">Trang dựng lỗi</h2>' +
      '<div class="mono" style="font-size: 12px">' + String(e.message || e.error || 'không rõ') + '</div></div>');
  });

  const BAKED = /*__DATA__*/null;
  // Danh mục cột/phép đo của phần "Đào sâu", build.mjs nướng vào từ
  // explore-schema.mjs — trang KHÔNG tự khai lại, nếu không nó sẽ chào một
  // lựa chọn mà máy chủ từ chối.
  const SCHEMA = /*__SCHEMA__*/null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = (n) => new Intl.NumberFormat('vi-VN').format(n);
  const dt = (s) => (s ? new Date(s).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
  const day2 = (s) => s.slice(8, 10) + '/' + s.slice(5, 7);
  // Locale vi ngăn nghìn bằng dấu chấm: nf(1274)+' ms' đọc thành 1,274 ms.
  const ms = (v) => (v == null ? '—' : v < 1000 ? v + ' ms' : (v / 1000).toFixed(2).replace('.', ',') + ' s');
  const ageH = (s) => (s ? (Date.now() - new Date(s)) / 3600000 : Infinity);
  const age = (s) => {
    const h = ageH(s);
    if (!isFinite(h)) return 'chưa có';
    if (h < 1) return Math.round(h * 60) + ' phút trước';
    if (h < 48) return h.toFixed(1).replace('.0', '') + ' giờ trước';
    return Math.round(h / 24) + ' ngày trước';
  };

  const tip = $('tip');
  function bindTip(el, html) {
    el.setAttribute('tabindex', '0');
    const show = (e) => {
      tip.innerHTML = html; tip.classList.add('on');
      const r = el.getBoundingClientRect();
      tip.style.left = Math.min(innerWidth - 260, Math.max(8, (e && e.clientX ? e.clientX : r.left + r.width / 2) - 60)) + 'px';
      tip.style.top = Math.max(8, r.top - 42) + 'px';
    };
    const hide = () => tip.classList.remove('on');
    el.addEventListener('mouseenter', show); el.addEventListener('mousemove', show);
    el.addEventListener('mouseleave', hide); el.addEventListener('focus', show); el.addEventListener('blur', hide);
  }

  let LAST = null;         // dữ liệu lần render gần nhất — để vẽ lại mà khỏi gọi mạng
  let toolRank = 'top';    // 'top' | 'bottom' — giữ ngoài render, xem canaryOpen
  let canaryOpen = false;  // bảng probe đang mở? giữ qua mỗi lần poll 30s

  /**
   * ── Phân trang ────────────────────────────────────────────────────────
   *
   * Số trang giữ NGOÀI hàm render, vì trang tự nạp lại dữ liệu mỗi 30s: để
   * bên trong thì cứ nửa phút người đọc lại bị ném về trang 1 giữa chừng.
   *
   * Chỉ vẽ thanh chuyển trang khi thật sự tràn — bảng 7 dòng mà vẫn có
   * "Trang 1/1" là thêm một dòng chữ không nói gì.
   */
  const PAGE_SIZE = 12;
  const pageAt = {};
  const pageOf = (key, total) => {
    const max = Math.max(1, Math.ceil(total / PAGE_SIZE));
    pageAt[key] = Math.min(pageAt[key] || 1, max);
    return { page: pageAt[key], max, from: (pageAt[key] - 1) * PAGE_SIZE };
  };

  function pager(elId, key, total, redraw) {
    const { page, max } = pageOf(key, total);
    const el = $(elId);
    if (!el) return;
    if (max < 2) { el.innerHTML = ''; return; }
    // Chỉ "3 / 5". Tổng số dòng đã nằm ngay tiêu đề bảng phía trên, nhắc lại ở
    // đây là bắt mắt đọc hai lần cùng một con số.
    el.innerHTML = `<div class="pager">
        <button class="btn" data-d="-1"${page === 1 ? ' disabled' : ''}>← Trước</button>
        <span class="pnum"><b>${page}</b> / ${max}</span>
        <button class="btn" data-d="1"${page === max ? ' disabled' : ''}>Sau →</button>
      </div>`;
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      pageAt[key] = Math.min(max, Math.max(1, page + Number(b.dataset.d)));
      redraw();
    }));
  }

  /**
   * Chú giải hai màu, chỉ vẽ khi biểu đồ THẬT SỰ có phần đỏ. Xanh lá không
   * phải "tốt", nó là "chạy được"; đỏ không phải "lỗi", nó là "người dùng
   * không dùng được" — hai chữ đó khác nhau và bảng này chỉ đếm chữ thứ hai.
   */
  const LEGEND = (show) => (show
    ? '<div class="legend"><span><i style="background:var(--good)"></i>Chạy được</span>' +
      '<span><i style="background:var(--critical)"></i>Không dùng được</span></div>'
    : '');

  function render(DATA) {
  LAST = DATA;
  // ── canh gác + phán quyết tổng ───────────────────────────────────────
  const w = DATA.watchdog;
  const cAge = ageH(w.canary && w.canary.at), iAge = ageH(w.ingest && w.ingest.at);
  const ICON = { good: '●', warning: '▲', serious: '▲', critical: '■' };
  const RANK = { good: 0, warning: 1, serious: 2, critical: 3 };

  /**
   * Hai ô, không phải ba. "Phiên Lark — 17 sống" đã bỏ: nó là bản tổng của
   * đúng thứ mà cột "Token còn" trong bảng người nói chi tiết hơn, và một con
   * số tổng đứng cạnh bảng chi tiết chỉ tổ phải cộng nhẩm để đối chiếu.
   *
   * Dòng phụ chỉ hiện khi có gì để CẢNH BÁO. "Dòng audit gần nhất còn tươi"
   * lặp lại đúng ý con số ngay trên nó bằng chữ khác — thừa.
   */
  const watches = [
    { key: 'canary',
      sev: !w.canary ? 'critical' : cAge > 36 ? 'critical' : w.canary.failing ? 'serious' : 'good',
      k: 'Canary', v: !w.canary ? 'Không có nhịp tim' : `${w.canary.probes} probe · ${w.canary.failing} lỗi`,
      d: cAge > 36 ? 'Quá 36h không có nhịp tim — bộ phát hiện coi như đã chết' : age(w.canary && w.canary.at) },
    { sev: iAge > 24 ? 'critical' : iAge > 6 ? 'warning' : 'good',
      k: 'Đường nạp dữ liệu', v: age(w.ingest && w.ingest.at),
      d: iAge > 6 ? 'Lâu bất thường — kiểm tra server còn ghi audit không' : '' },
  ];

  $('watchdog').innerHTML = watches.map((c) => {
    const mo = c.key === 'canary' && (DATA.canaryProbes || []).length;
    return `<div class="item sev-x${mo ? ' js-canary' : ''}" style="--sev: var(--${c.sev})"${mo ? ' role="button" tabindex="0" title="Bấm để xem từng probe"' : ''}>
      <div class="ic" aria-hidden="true">${ICON[c.sev]}</div>
      <div><div class="k">${esc(c.k)}${mo ? '<span class="more">xem probe ▾</span>' : ''}</div>
        <div class="v">${esc(c.v)}</div>${c.d ? `<div class="d">${esc(c.d)}</div>` : ''}</div>
    </div>`;
  }).join('');

  const worst = watches.reduce((a, c) => (RANK[c.sev] > RANK[a] ? c.sev : a), 'good');
  const VERDICT = {
    good: ['●', 'Hệ thống ổn'], warning: ['▲', 'Có cảnh báo'],
    serious: ['▲', 'Có sự cố'], critical: ['■', 'Cần chú ý ngay'],
  };
  $('verdict').innerHTML = `<span class="verdict" style="--sev: var(--${worst}); color: var(--${worst})">
      <span class="dot"></span>${VERDICT[worst][1]}</span>`;

  // ── KPI ──────────────────────────────────────────────────────────────
  const k = DATA.kpi;
  // Chỉ đếm lượt CHẶN người dùng — lúc model phải nói "không dùng được tool
  // này". Thiếu quyền, sai tham số, quá hạn mức đều là Lark đã trả lời và model
  // đi tiếp được, đưa lên đây thì bảng lúc nào cũng đỏ trong khi tool chạy mượt.
  const blockSev = k.blockRate >= 5 ? 'critical' : k.blocked ? 'warning' : 'good';
  $('kpi').innerHTML = [
    { hero: 1, k: 'Lượt gọi', v: nf(k.calls), d: `${DATA.daily.length} ngày có dữ liệu` },
    { k: 'Không dùng được', v: nf(k.blocked), sev: blockSev,
      d: k.blocked ? `${String(k.blockRate).replace('.', ',')}% lượt gọi bị chặn` : 'Không lượt nào bị chặn' },
    // "Đã cắm" là số người ĐĂNG NHẬP được, "đã gọi" là số người thật sự dùng.
    // Chênh lệch giữa hai số là thứ cần biết khi vừa phát link cho phòng ban.
    { k: 'Người đã cắm', v: nf(k.connected ?? k.users), d: `${nf(k.users)} người đã gọi tool` },
    { k: 'Độ trễ p95', v: ms(k.p95), d: 'trung vị ' + ms(k.p50) },
    { k: 'Tool đã dùng', v: `${k.toolsUsed}<small>/${k.toolsTotal}</small>`, d: `${DATA.unused.length} chưa ai gọi` },
  ].map((t) => `<div class="card kpi${t.hero ? ' hero' : ''}">
      <div class="k">${esc(t.k)}</div>
      <div class="v num"${t.sev ? ` style="color: var(--${t.sev})"` : ''}>${t.v}</div>
      <div class="d">${esc(t.d)}</div></div>`).join('');

  // ── cột: lượt gọi theo ngày ─────────────────────────────────────────
  (function () {
    const d = DATA.daily;
    if (!d.length) { $('c-daily').innerHTML = '<div class="ok-empty dim">Chưa có dữ liệu theo ngày.</div>'; return; }
    // Ít ngày thì đừng kéo giãn hết chiều ngang — cột dày vừa phải, canh trái,
    // tránh cảnh 3 cột lọt thỏm giữa khoảng trắng mênh mông.
    // Ít ngày thì cột DÀY hẳn ra thay vì để nửa thẻ trống. Bản trước chốt bề
    // rộng cột ở 58px nên 5 ngày dữ liệu vẽ xong còn thừa hơn nửa chiều ngang.
    const band = d.length < 10 ? Math.min(150, 900 / d.length) : (900 - 52) / d.length;
    const W = Math.max(300, 52 + band * d.length + 10), H = 300, PL = 48, PR = 10, PT = 22, PB = 30;
    const max = Math.max(1, ...d.map((x) => x.calls));
    const step = Math.max(1, Math.pow(10, Math.floor(Math.log10(max))) / 2);
    const top = Math.ceil(max / step) * step;
    const bw = Math.min(74, band * 0.56);
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const cx = (i) => PL + band * (i + 0.5);

    let s = '';
    for (let t = 0; t <= top; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
      s += `<text x="${PL - 7}" y="${y(t) + 4}" text-anchor="end" font-size="12.5" fill="var(--ink-3)" class="num">${nf(t)}</text>`;
    }
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)" stroke-width="1"/>`;

    /** Khối bo góc trên, đáy vuông để neo vào trục (hoặc vào khối bên dưới). */
    const block = (x0, yT, h, color) => h <= 0 ? '' :
      `<rect x="${x0}" y="${yT}" width="${bw}" height="${Math.max(2, h)}" rx="4" fill="${color}"/>` +
      `<rect x="${x0}" y="${yT + Math.max(0, Math.max(2, h) - 4)}" width="${bw}" height="4" fill="${color}"/>`;

    d.forEach((x, i) => {
      // Cột CHỒNG: chạy được xanh ở dưới, bị chặn đỏ ở trên. Một cột đơn sắc
      // chỉ nói được "hôm đó bận hay rảnh"; chồng lên thì nó nói luôn "hôm đó
      // có ai không dùng được không" — mà đó mới là câu đang hỏi.
      const x0 = cx(i) - bw / 2, okN = x.calls - x.blocked;
      s += block(x0, y(okN), y(0) - y(okN), 'var(--good)');
      s += block(x0, y(x.calls), y(okN) - y(x.calls), 'var(--critical)');
      // Vùng bắt chuột phủ cả cột — bắt theo từng khối thì tooltip nhấp nháy
      // mỗi lần con trỏ đi qua ranh giới xanh/đỏ.
      s += `<rect class="sg" x="${x0}" y="${y(x.calls)}" width="${bw}" height="${Math.max(2, y(0) - y(x.calls))}" fill="transparent" data-i="${i}"/>`;
      s += `<text x="${cx(i)}" y="${y(x.calls) - 5}" text-anchor="middle" font-size="13.5" font-weight="660" fill="var(--ink-2)" class="num">${nf(x.calls)}</text>`;
      s += `<text x="${cx(i)}" y="${H - 9}" text-anchor="middle" font-size="12.5" fill="var(--ink-3)" class="num">${day2(x.day)}</text>`;
    });
    // Chú giải chỉ hiện khi thật sự có màu thứ hai trên biểu đồ. Không ngày nào
    // bị chặn thì hai ô màu chỉ tổ làm người đọc đi tìm phần đỏ không tồn tại.
    $('c-daily').innerHTML = LEGEND(d.some((x) => x.blocked)) +
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Lượt gọi theo ngày" style="max-width:${W}px">${s}</svg>`;
    $('c-daily').querySelectorAll('.sg').forEach((el) => {
      const x = d[+el.dataset.i];
      bindTip(el, `<b>${day2(x.day)}</b><br>${nf(x.calls)} lượt gọi` +
        (x.blocked ? `<br>${nf(x.blocked)} không dùng được` : ''));
    });
  })();

  // ── thanh ngang: tool nhiều / ít nhất ────────────────────────────────
  const drawTools = () => {
    /**
     * `DATA.tools` giờ gồm CẢ tool chưa ai gọi (calls = 0) — thẻ "Tool chưa ai
     * gọi" cũ đã bỏ. Nhánh "Ít nhất" tự trả lời luôn câu đó, mà không bắt người
     * đọc nhảy sang một danh sách nhãn riêng ở nửa dưới trang.
     *
     * Đồng hạng thì xếp theo tên: 22 tool cùng 0 lượt mà để thứ tự tuỳ ý thì
     * mỗi lần poll 30s danh sách lại xáo, đọc dở dang là mất chỗ.
     */
    const src = DATA.tools.slice().sort((a, b) => (toolRank === 'top'
      ? b.calls - a.calls || a.name.localeCompare(b.name)
      : a.calls - b.calls || a.name.localeCompare(b.name)));
    const t = src.slice(0, 10);
    $('tools-n').textContent = `· ${nf(DATA.kpi.toolsUsed)}/${nf(DATA.kpi.toolsTotal)} đã dùng`;
    for (const b of $('f-toolrank').children) b.setAttribute('aria-pressed', String(b.dataset.v === toolRank));

    if (!t.length) { $('c-tools').innerHTML = '<div class="ok-empty dim">Chưa có tool nào.</div>'; return; }
    const W = 520, rowH = 25, LW = 172, PR = 46, H = t.length * rowH + 4;
    const max = Math.max(1, ...t.map((x) => x.calls));
    const track = W - LW - PR;
    let s = '';
    t.forEach((x, i) => {
      const yy = i * rowH + 4;
      // 0 lượt thì KHÔNG vẽ thanh tối thiểu 2px — một vạch mờ trông y hệt "có
      // gọi một tí", mà sự thật là chưa ai gọi. Để trống và ghi chữ.
      if (!x.calls) {
        s += `<text x="0" y="${yy + 12}" font-size="12.5" fill="var(--ink-3)" class="mono">${esc(x.name)}</text>`;
        s += `<line x1="${LW}" x2="${LW + track}" y1="${yy + 8}" y2="${yy + 8}" stroke="var(--grid)" stroke-width="2"/>`;
        s += `<text x="${LW + track + 7}" y="${yy + 12}" font-size="11" fill="var(--ink-3)">chưa gọi</text>`;
        return;
      }
      const bw = Math.max(2, (x.calls / max) * track);
      // Cùng luật với cột theo ngày: phần xanh là lượt chạy được, phần đỏ nối
      // đuôi là lượt người dùng không dùng được. Tool đang hỏng thật lộ ra ngay
      // ở đây; tool chỉ bị Lark từ chối vì thiếu quyền thì vẫn xanh nguyên.
      const ew = x.blocked ? Math.max(2, (x.blocked / max) * track) : 0;
      const ok = Math.max(0, bw - ew);
      s += `<text x="0" y="${yy + 12}" font-size="12.5" fill="var(--ink-2)" class="mono">${esc(x.name)}</text>`;
      s += `<rect x="${LW}" y="${yy + 2}" width="${bw}" height="12" rx="4" fill="var(--critical)"/>`;
      s += ok > 0 ? `<rect x="${LW}" y="${yy + 2}" width="${ok}" height="12" rx="4" fill="var(--good)"/>` : '';
      s += `<rect x="${LW}" y="${yy + 2}" width="${Math.min(bw, 4)}" height="12" fill="var(--${ok > 0 ? 'good' : 'critical'})"/>`;
      s += `<rect class="br" x="${LW}" y="${yy + 2}" width="${bw}" height="12" fill="transparent" data-i="${i}"/>`;
      s += `<text x="${LW + bw + 7}" y="${yy + 12}" font-size="11" font-weight="600" fill="var(--ink-2)" class="num">${nf(x.calls)}</text>`;
    });
    $('c-tools').innerHTML = LEGEND(t.some((x) => x.blocked)) +
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tool theo lượt gọi">${s}</svg>`;
    $('c-tools').querySelectorAll('.br').forEach((el) => {
      const x = t[+el.dataset.i];
      bindTip(el, `<b>${esc(x.name)}</b><br>${nf(x.calls)} lượt · p95 ${ms(x.p95)}` +
        (x.blocked ? `<br>${nf(x.blocked)} không dùng được (${String(x.blockRate).replace('.', ',')}%)` : ''));
    });
  };
  drawTools();
  $('f-toolrank').onclick = (e) => {
    const b = e.target.closest('button');
    if (b) { toolRank = b.dataset.v; drawTools(); }
  };

  const count = (id, n) => { if ($(id)) $(id).textContent = n ? `· ${nf(n)}` : ''; };

  // ── người dùng ───────────────────────────────────────────────────────
  // Cột "Không dùng được" CHỈ hiện khi có người thật sự bị chặn. Một cột toàn
  // số 0 không nói gì mà vẫn bắt mắt dừng lại đọc — đúng thứ cần bỏ.
  const anyBlocked = DATA.people.some((p) => p.blocked);
  const SEV_STATUS = { active: 'good', revoked: 'critical', inactive: 'warning' };

  /**
   * Đồng hồ đếm ngược tới hạn refresh token — 7 ngày kể từ lần chạm cuối.
   * Hết hạn là người đó phải quét mã đăng nhập lại, nên đây là con số DUY NHẤT
   * trên bảng đòi hành động trước khi hỏng, chứ không phải báo sau khi hỏng.
   */
  const countdown = (iso) => {
    if (!iso) return '<span class="dim">—</span>';
    const h = (new Date(iso) - Date.now()) / 3600000;
    if (h <= 0) return '<span style="color:var(--critical);font-weight:640">đã hết hạn</span>';
    const sev = h < 24 ? 'critical' : h < 72 ? 'warning' : 'good';
    const txt = h < 48 ? `${Math.round(h)} giờ` : `${Math.floor(h / 24)} ngày ${Math.round(h % 24)} giờ`;
    return `<span style="color:var(--${sev})">${txt}</span>`;
  };

  const personRow = (p) => `<tr>
      <td>${esc(p.name || p.openId || '—')}</td>
      <td>${p.clients.length
        ? `<div class="chips">${p.clients.map((c) => `<span class="pill sev-x" style="--sev: var(--${SEV_STATUS[c.status] || 'ink-3'})" title="${esc(c.app)} · thấy ${esc(age(c.seen))}"><span class="dot"></span>${esc(c.app)}</span>`).join('')}</div>`
        : '<span class="dim">—</span>'}</td>
      <td class="r num">${p.calls ? nf(p.calls) : '<span class="dim">chưa gọi</span>'}</td>` +
      (anyBlocked
        ? (p.blocked
          ? `<td class="r num" style="color: var(--critical); font-weight:640">${nf(p.blocked)}</td>`
          : '<td class="r num dim">0</td>')
        : '') +
      `<td class="r num">${nf(p.tools)}</td>
      <td class="r nw">${countdown(p.tokenExpires)}</td>
      <td class="r num dim nw">${dt(p.last)}</td>
    </tr>`;

  const drawPeople = () => {
    const { from } = pageOf('people', DATA.people.length);
    count('people-n', DATA.people.length);
    $('t-people').innerHTML =
      '<thead><tr><th>Người</th><th>Cắm bằng</th><th class="r">Lượt</th>' +
      (anyBlocked ? '<th class="r nw">Không dùng được</th>' : '') +
      '<th class="r">Tool</th><th class="r nw">Token còn</th><th class="r nw">Gần nhất</th></tr></thead><tbody>' +
      DATA.people.slice(from, from + PAGE_SIZE).map(personRow).join('') + '</tbody>';
    pager('people-pager', 'people', DATA.people.length, drawPeople);
  };
  drawPeople();


  // ── canary ───────────────────────────────────────────────────────────
  const cp = DATA.canaryProbes || [];
  const drawCanary = () => {
    const { from } = pageOf('canary', cp.length);
    count('canary-n', cp.length);
    $('t-canary').innerHTML = !cp.length
      ? ''
      : '<thead><tr><th>Tool</th><th>Kết quả</th><th class="r nw">Thời gian</th><th class="r nw">Mã lỗi</th></tr></thead><tbody>' +
        cp.slice(from, from + PAGE_SIZE).map((p) => `<tr>
          <td class="mono">${esc(p.name)}</td>
          <td class="nw"><span class="pill sev-x" style="--sev: var(--${p.ok ? 'good' : 'critical'})"><span class="dot"></span>${p.ok ? 'đạt' : 'hỏng'}</span></td>
          <td class="r num dim nw">${ms(p.ms)}</td>
          <td class="r num nw${p.code ? '' : ' dim'}">${p.code ? esc(p.code) : '—'}</td>
        </tr>`).join('') + '</tbody>';
    if (!cp.length) {
      $('t-canary').innerHTML = '<tbody><tr><td class="dim">Chưa có chi tiết probe — chờ nhịp tim canary kế tiếp.</td></tr></tbody>';
    }
    pager('canary-pager', 'canary', cp.length, drawCanary);
  };
  drawCanary();

  // Đóng/mở giữ NGOÀI render (biến `canaryOpen`) — trang tự nạp lại mỗi 30s,
  // để bên trong thì cứ nửa phút bảng lại tự sập xuống khi đang đọc.
  $('canary-box').hidden = !canaryOpen;
  const cbtn = $('watchdog').querySelector('.js-canary');
  if (cbtn) {
    const toggle = () => { canaryOpen = !canaryOpen; render(LAST); };
    cbtn.addEventListener('click', toggle);
    cbtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    cbtn.querySelector('.more').textContent = canaryOpen ? 'đóng ▴' : 'xem probe ▾';
  }
  }


  /**
   * ── Đào sâu ───────────────────────────────────────────────────────────
   *
   * Trước đây là trang /explore riêng. Gộp về đây vì hai trang cùng trả lời
   * một câu hỏi trên cùng một tập dữ liệu, mà tách ra thì phải nhớ trang nào
   * có gì và mọi con số phải đối chiếu bằng cách mở hai tab.
   *
   * Đóng gói trong một hàm riêng để không đụng tên với phần trên: nó có
   * state, draw, EX của riêng nó. Dùng chung $, esc, nf, dt, ms,
   * bindTip, pageOf, pager, PAGE_SIZE của trang.
   *
   * KHÔNG còn ô chọn nguồn: bảng này chỉ theo dõi MCP remote. Nguồn zip là
   * client khác, ghi chung bảng audit nhưng không phải thứ trang này canh —
   * để lẫn vào chỉ làm mọi con số phải kèm một câu hỏi "của bản nào?".
   */
  function initExplore() {
  const cut = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s));
  const DIMS = SCHEMA.DIMENSIONS, MEASURES = SCHEMA.MEASURES, WINDOWS = SCHEMA.WINDOWS;
  const dimOf = (k) => DIMS.find((d) => d.key === k) || DIMS[0];

  /**
   * Đếm số giá trị khác nhau của CHÍNH cột đang nhóm thì nhóm nào cũng ra 1.
   * Một cột toàn số 1 không sai, nhưng nó chiếm chỗ và bắt người đọc dừng lại
   * để hiểu ra rằng nó không nói gì — bỏ hẳn khỏi ô chọn lẫn bảng.
   */
  const REDUNDANT = { user_name: 'users', tool_name: 'tools' };
  const measuresFor = (dimKey) => MEASURES.filter((m) => m.key !== REDUNDANT[dimKey]);
  const measureOf = (k) => measuresFor(state.dim).find((m) => m.key === k) || MEASURES[0];

  const KINDS = [
    { key: 'hbar', label: 'Thanh ngang' },
    { key: 'bar', label: 'Cột' },
    { key: 'line', label: 'Đường' },
  ];

  const fmt = (v, f) => {
    if (v == null) return '—';
    if (f === 'ms') return ms(v);
    if (f === 'pct') return String(v).replace('.', ',') + '%';
    return nf(v);
  };

  /**
   * Màu của một cột = nhóm đó có CHẶN người dùng không, không phải màu trang trí.
   *
   * Trước đây mọi cột cùng một sắc chàm, nên biểu đồ "lượt gọi theo tool" chỉ
   * trả lời được "cái nào nhiều" — muốn biết cái nào đang hỏng phải dò xuống
   * bảng bên dưới.
   *
   * Tô theo lượt KHÔNG DÙNG ĐƯỢC, không theo lỗi thô: thiếu quyền và sai tham
   * số là Lark đã trả lời, model đi tiếp được và người dùng không thấy gì. Tô
   * đỏ cả chúng thì gần như cột nào cũng đỏ, và một màu đỏ luôn bật là màu đỏ
   * không ai còn nhìn.
   *
   * Ba mức chứ không hai: 1 lượt hỏng trên 200 mà đỏ chót thì lần sau không ai
   * tin màu đỏ nữa.
   */
  const HEALTH = [
    { sev: 'good', label: 'Dùng được hết' },
    { sev: 'warning', label: 'Dưới 20% không dùng được' },
    { sev: 'critical', label: 'Từ 20% không dùng được' },
  ];
  const health = (r) => (!r.blocked ? 'good' : r.blockRate >= 20 ? 'critical' : 'warning');
  const fill = (r) => `var(--${health(r)})`;

  /** Trục tròn số: 2–5 vạch, không ra mấy con lẻ như 1.372,4. */
  function scale(max) {
    if (!(max > 0)) return { top: 1, step: 1 };
    const mag = Math.pow(10, Math.floor(Math.log10(max)));
    const r = max / mag;
    const step = r > 5 ? mag : r > 2 ? mag / 2 : mag / 5;
    return { top: Math.ceil(max / step) * step, step };
  }

  const DEFAULTS = { dim: 'tool_name', measure: 'calls', days: 30, kind: '', user: '' };
  const state = { ...DEFAULTS };
  (function readUrl() {
    const q = new URLSearchParams(location.search);
    for (const k of Object.keys(DEFAULTS)) if (q.get(k)) state[k] = q.get(k);
    state.days = WINDOWS.includes(+state.days) ? +state.days : 30;
  })();

  /** Chưa chọn kiểu thì đoán theo cột: trục thời gian vẽ đường, phân loại vẽ thanh. */
  const kindNow = () => state.kind || (dimOf(state.dim).time ? 'line' : 'hbar');

  function pushUrl() {
    const q = new URLSearchParams();
    for (const [k, v] of Object.entries(state)) if (v && v !== DEFAULTS[k]) q.set(k, v);
    const s = q.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }

  // ── Thanh chọn ─────────────────────────────────────────────────────────
  function buildControls() {
    $('f-dim').innerHTML = DIMS.map((d) => `<option value="${esc(d.key)}">${esc(d.label)}</option>`).join('');
    $('f-days').innerHTML = WINDOWS.map((d) => `<button type="button" data-v="${d}">${d} ngày</button>`).join('');
    $('f-kind').innerHTML = KINDS.map((k) => `<button type="button" data-v="${esc(k.key)}">${esc(k.label)}</button>`).join('');


    // Đổi cột / khoảng / nguồn → phải gọi lại máy chủ. Đổi phép đo / kiểu vẽ →
    // cùng một tập số, chỉ vẽ lại. Tách hai nhóm để thao tác thứ hai tức thì.
    const reload = (patch) => { Object.assign(state, patch); pushUrl(); load(); };
    const redraw = (patch) => { Object.assign(state, patch); pushUrl(); draw(); };

    $('f-dim').addEventListener('change', (e) => reload({ dim: e.target.value, kind: '' }));
    $('f-user').addEventListener('change', (e) => reload({ user: e.target.value }));
    $('f-days').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) reload({ days: +b.dataset.v }); });
    $('f-measure').addEventListener('change', (e) => redraw({ measure: e.target.value }));
    $('f-kind').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) redraw({ kind: b.dataset.v }); });

    $('f-csv').addEventListener('click', downloadCsv);
  }

  function syncControls() {
    // Danh sách người do máy chủ trả về theo từng cửa sổ thời gian — đổi sang
    // 7 ngày thì người không hoạt động trong 7 ngày đó phải biến mất khỏi ô chọn.
    const us = (EX && EX.users) || [];
    $('f-user').innerHTML = '<option value="">Tất cả</option>' +
      us.map((u) => `<option value="${esc(u)}">${esc(cut(u, 40))}</option>`).join('');
    $('f-user').value = us.includes(state.user) ? state.user : '';

    // Danh sách phép đo dựng lại theo cột đang nhóm, nên phải vẽ lại ô chọn
    // mỗi lần — không thì mục vừa bị loại vẫn nằm đó và chọn được.
    const av = measuresFor(state.dim);
    if (!av.some((m) => m.key === state.measure)) state.measure = 'calls';
    $('f-measure').innerHTML = av.map((m) => `<option value="${esc(m.key)}">${esc(m.label)}</option>`).join('');
    $('f-dim').value = state.dim;
    $('f-measure').value = state.measure;
    for (const b of $('f-days').children) b.setAttribute('aria-pressed', String(+b.dataset.v === state.days));
    for (const b of $('f-kind').children) b.setAttribute('aria-pressed', String(b.dataset.v === kindNow()));
  }

  // ── Vẽ ─────────────────────────────────────────────────────────────────
  let EX = null;

  // Trần số nhóm vẽ ra. 60 tool hay 40 người trên một biểu đồ là 40 nhãn không
  // đọc nổi; phần còn lại vẫn nằm đủ ở bảng bên dưới, và dòng tóm tắt nói rõ
  // đã cắt bao nhiêu — cắt âm thầm thì biểu đồ trông như đã bày hết.
  const MAX_BARS = 25;

  function draw() {
    if (!EX) return;
    syncControls();

    const dim = dimOf(state.dim), me = measureOf(state.measure), kind = kindNow();
    const val = (r) => r[me.key];
    // p50/p95 null nghĩa là không có mẫu thời gian nào — bỏ hẳn khỏi biểu đồ,
    // vẽ thành 0 sẽ đọc thành "nhanh tức thì".
    let rows = EX.rows.filter((r) => val(r) != null && (me.zeroable || val(r) > 0));

    // Trục thời gian giữ nguyên thứ tự; phân loại thì xếp theo chính phép đo
    // đang xem — chọn "tỉ lệ lỗi" mà vẫn xếp theo lượt gọi là trả lời câu khác.
    if (!dim.time) rows = rows.slice().sort((a, b) => val(b) - val(a));
    const shown = rows.slice(0, MAX_BARS);
    const cutN = rows.length - shown.length;

    $('chart-title').textContent = `${me.label} theo ${dim.label.toLowerCase()}`
      + (EX.user ? ` — chỉ ${cut(EX.user, 34)}` : '');
    $('summary').innerHTML = [
      `<span>Nguồn dữ liệu <b>${nf(EX.total)}</b> lượt gọi</span>`,
      `<span>Gộp thành <b>${nf(EX.groups)}</b> nhóm</span>`,
      `<span>Cửa sổ <b>${state.days}</b> ngày</span>`,
      EX.skipped ? `<span>Bỏ qua <b>${nf(EX.skipped)}</b> lượt chưa ghi cột này</span>` : '',
      EX.user ? `<span>Đang lọc <b>1</b>/${nf(EX.users.length)} người</span>` : '',
      cutN > 0 ? `<span>Biểu đồ hiện <b>${nf(shown.length)}</b> nhóm lớn nhất, còn <b>${nf(cutN)}</b> ở bảng dưới</span>` : '',
    ].filter(Boolean).join('');

    // Chú giải chỉ có nghĩa khi thật sự có nhiều màu trên biểu đồ — mọi nhóm
    // đều sạch lỗi thì ba ô màu chỉ là nhiễu.
    const seen = [...new Set(shown.map(health))];
    $('legend').innerHTML = seen.length < 2 ? '' :
      HEALTH.filter((h) => seen.includes(h.sev))
        .map((h) => `<span><i style="background: var(--${h.sev})"></i>${esc(h.label)}</span>`).join('');

    $('chart').innerHTML = !shown.length
      ? '<div class="ok-empty dim">Không có dữ liệu nào trong khoảng này.</div>'
      : kind === 'hbar' ? hbar(shown, me) : kind === 'bar' ? vbar(shown, me) : line(shown, me);

    $('chart').querySelectorAll('[data-i]').forEach((el) => {
      const r = shown[+el.dataset.i];
      bindTip(el, `<b>${esc(cut(r.key, 40))}</b><br>${esc(me.label)}: ${esc(fmt(r[me.key], me.fmt))}<br>
        ${nf(r.calls)} lượt · p95 ${ms(r.p95)}` +
        (r.blocked ? `<br>${nf(r.blocked)} không dùng được (${String(r.blockRate).replace('.', ',')}%)` : ''));
    });

    drawTable(rows, me, dim);
  }

  /** Thanh ngang — mặc định cho cột phân loại, vì tên người và tên tool đều dài. */
  function hbar(rows, me) {
    const W = 1000, rowH = 30, LW = 268, PR = 92, H = rows.length * rowH + 6;
    const max = Math.max(...rows.map((r) => r[me.key]), 0);
    const track = W - LW - PR;
    let s = '';
    rows.forEach((r, i) => {
      const y = i * rowH + 5;
      const w = max > 0 ? Math.max(2, (r[me.key] / max) * track) : 2;
      s += `<text x="0" y="${y + 14}" font-size="13.5" fill="var(--ink-2)">${esc(cut(r.key, 34))}</text>`;
      s += `<rect data-i="${i}" x="${LW}" y="${y + 3}" width="${w}" height="16" rx="5" fill="${fill(r)}"/>`;
      s += `<rect x="${LW}" y="${y + 3}" width="${Math.min(w, 5)}" height="16" fill="${fill(r)}"/>`;
      s += `<text x="${LW + w + 9}" y="${y + 15}" font-size="12.5" font-weight="600" fill="var(--ink-2)" class="num">${esc(fmt(r[me.key], me.fmt))}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(me.label)}">${s}</svg>`;
  }

  /** Cột dọc — hợp với ngày/giờ, ít nhóm. */
  function vbar(rows, me) {
    const H = 300, PL = 62, PR = 10, PT = 20, PB = 46;
    const band = Math.max(34, Math.min(90, 900 / rows.length));
    const W = Math.max(360, PL + band * rows.length + PR);
    const { top, step } = scale(Math.max(...rows.map((r) => r[me.key]), 0));
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const cx = (i) => PL + band * (i + 0.5);
    const bw = Math.min(38, band * 0.55);

    let s = '';
    for (let t = 0; t <= top + 1e-9; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>`;
      s += `<text x="${PL - 9}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${esc(fmt(t, me.fmt))}</text>`;
    }
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)"/>`;
    rows.forEach((r, i) => {
      const yT = y(r[me.key]), h = Math.max(2, y(0) - yT);
      s += `<rect data-i="${i}" x="${cx(i) - bw / 2}" y="${yT}" width="${bw}" height="${h}" rx="5" fill="${fill(r)}"/>`;
      s += `<rect x="${cx(i) - bw / 2}" y="${yT + Math.max(0, h - 5)}" width="${bw}" height="5" fill="${fill(r)}"/>`;
      // Nhãn trục X xoay 40° khi tên dài — nằm ngang thì chúng chồng lên nhau.
      const lb = esc(cut(r.key, 16));
      s += String(r.key).length > 6
        ? `<text x="${cx(i)}" y="${H - PB + 18}" font-size="11" fill="var(--ink-3)" text-anchor="end" transform="rotate(-40 ${cx(i)} ${H - PB + 18})">${lb}</text>`
        : `<text x="${cx(i)}" y="${H - PB + 18}" font-size="12.5" fill="var(--ink-3)" text-anchor="middle">${lb}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${esc(me.label)}" style="max-width:${W}px">${s}</svg>`;
  }

  /** Đường — mặc định cho trục thời gian, vì hình dạng xu hướng mới là thứ cần đọc. */
  function line(rows, me) {
    const W = 1000, H = 300, PL = 62, PR = 16, PT = 20, PB = 42;
    const { top, step } = scale(Math.max(...rows.map((r) => r[me.key]), 0));
    const y = (v) => PT + (H - PT - PB) * (1 - v / top);
    const x = (i) => (rows.length === 1 ? (PL + W - PR) / 2 : PL + ((W - PL - PR) * i) / (rows.length - 1));

    let s = '';
    for (let t = 0; t <= top + 1e-9; t += step) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>`;
      s += `<text x="${PL - 9}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="num">${esc(fmt(t, me.fmt))}</text>`;
    }
    const pts = rows.map((r, i) => `${x(i)},${y(r[me.key])}`).join(' ');
    s += `<polygon points="${PL},${y(0)} ${pts} ${x(rows.length - 1)},${y(0)}" fill="var(--wash)"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach((r, i) => {
      // Đường giữ một màu để đọc được hình dạng xu hướng; CHẤM mới đổi màu theo
      // sức khoẻ của ngày đó. Đổi màu cả đường thì nó vỡ thành từng khúc rời.
      s += `<circle cx="${x(i)}" cy="${y(r[me.key])}" r="5" fill="var(--card)" stroke="${fill(r)}" stroke-width="3"/>`;
      // Vùng bắt chuột rộng hơn chấm — chấm 4px thì phải rê rất khéo mới trúng.
      s += `<circle data-i="${i}" cx="${x(i)}" cy="${y(r[me.key])}" r="13" fill="transparent"/>`;
      // Nhãn thưa dần khi nhiều điểm, để trục X không thành một vệt chữ đè nhau.
      const every = Math.ceil(rows.length / 14);
      if (i % every === 0 || i === rows.length - 1) {
        s += `<text x="${x(i)}" y="${H - PB + 20}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(cut(r.key, 10))}</text>`;
      }
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(me.label)}">${s}</svg>`;
  }

  // ── Bảng số ────────────────────────────────────────────────────────────
  function drawTable(rows, me, dim) {
    $('rows-n').textContent = rows.length ? `· ${nf(rows.length)} nhóm` : '';
    const cls = dim.mono ? 'mono' : '';
    const MS = measuresFor(dim.key);
    // Nhóm theo tool ra 39 dòng, theo giờ ra 24 — đổ hết xuống thì bảng dài
    // gấp ba biểu đồ ngay trên nó. Phân trang dùng chung với bảng người.
    const { from: exFrom } = pageOf('exrows', rows.length);
    $('t-rows').innerHTML =
      `<thead><tr><th>${esc(dim.label)}</th>` +
      MS.map((m) => `<th class="r nw"${m.key === me.key ? ' style="color:var(--series-1)"' : ''}>${esc(m.label)}</th>`).join('') +
      '<th class="r nw">Gần nhất</th></tr></thead><tbody>' +
      rows.slice(exFrom, exFrom + PAGE_SIZE).map((r) => `<tr><td class="${cls}">${esc(cut(r.key, 48))}</td>` +
        // Cột đang được vẽ thì đậm lên; các cột còn lại mờ đi. Bảng bảy cột mà
        // cùng một sắc độ thì không ai tìm ra cột mình vừa chọn ở biểu đồ trên.
        MS.map((m) => m.key === me.key
          ? `<td class="r num nw" style="font-weight:660">${esc(fmt(r[m.key], m.fmt))}</td>`
          : `<td class="r num nw dim">${esc(fmt(r[m.key], m.fmt))}</td>`).join('') +
        `<td class="r num dim nw">${dt(r.last)}</td></tr>`).join('') +
      '</tbody>';
    pager('rows-pager', 'exrows', rows.length, () => drawTable(rows, me, dim));
  }

  function downloadCsv() {
    if (!EX) return;
    const dim = dimOf(state.dim), MS = measuresFor(dim.key);
    const head = [dim.label, ...MS.map((m) => m.label), 'Gần nhất'];
    // Bọc mọi ô trong ngoặc kép: tên người có dấu phẩy, và Excel sẽ tách nhầm cột.
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = [head.map(q).join(','), ...EX.rows.map((r) =>
      [r.key, ...MS.map((m) => r[m.key] ?? ''), r.last || ''].map(q).join(','))].join('\r\n');
    // BOM ﻿: thiếu nó là Excel mở ra tiếng Việt thành ký tự rác.
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `mcp-${state.dim}-${state.days}d.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Nạp dữ liệu ────────────────────────────────────────────────────────
  async function load() {
    $('chart').innerHTML = '<div class="ok-empty dim">Đang tính…</div>';
    const q = new URLSearchParams({ dim: state.dim, days: state.days, user: state.user });
    try {
      const r = await fetch('/api/explore?' + q, { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      EX = j;
      draw();
    } catch (e) {
      $('chart').innerHTML = `<div class="ok-empty" style="color:var(--critical)">Không tải được dữ liệu: ${esc(e.message)}</div>`;
    }
  }
  // buildControls dựng tuỳ chọn cho f-dim/f-days/f-kind VÀ gắn sự kiện; thiếu
  // nó thì ô chọn rỗng và mọi thao tác im lặng không làm gì. Phải chạy TRƯỚC
  // syncControls, vì syncControls đọc lại giá trị đang chọn của chính chúng.
  buildControls();
  syncControls();
  load();
  }

  // ── Đồng hồ real-time (góc trên) ─────────────────────────────────────
  const clock = $('clock');
  const tick = () => { if (clock) clock.textContent = new Date().toLocaleTimeString('vi-VN', { hour12: false }); };
  tick();
  setInterval(tick, 1000);

  // ── Tự cập nhật dữ liệu ──────────────────────────────────────────────
  // BAKED có sẵn = bản xem trước tĩnh (không backend) → render một lần.
  // BAKED null = bản live trên Vercel → fetch /api/data rồi poll lại mỗi 30s.
  const REFRESH_MS = 30000;
  const fetchData = async () => {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  };

  (async function boot() {
    // Phần "Đào sâu" tự gọi /api/explore riêng, nên khởi động nó ĐỘC LẬP với
    // phần trên: một bên hỏng thì bên kia vẫn hiện số.
    if (BAKED) { render(BAKED); initExplore(); return; }
    try {
      render(await fetchData());
      initExplore();
    } catch (e) {
      document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
        `<div class="card pad" style="border-color: var(--critical)">Không tải được dữ liệu: ${esc(e.message)}</div>`);
      return;
    }
    // Lỗi mạng thoáng qua thì giữ số cũ, không làm trắng trang.
    setInterval(async () => {
      try { render(await fetchData()); } catch (e) { console.warn('[refresh]', e.message); }
    }, REFRESH_MS);
  })();
</script>
