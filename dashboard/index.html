<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lark MCP remote — bảng vận hành</title>

<style>/**
 * Giao diện dùng chung cho MỌI trang của dashboard.
 *
 * build.mjs nhúng thẳng file này vào chỗ đánh dấu __CSS__ trong thẻ style của
 * từng template. Nhúng chứ không <link>: bản preview.html phải mở được như một
 * file rời (không máy chủ, không thư mục kèm theo), mà stylesheet ngoài thì mở
 * kiểu đó là mất sạch giao diện.
 *
 * ĐỪNG viết tên chỗ đánh dấu đó kèm đủ hai dấu comment vào đây. Bản đầu có, và
 * dấu đóng của nó kết thúc sớm chính khối chú thích này: trình duyệt nuốt luôn
 * khối :root ngay bên dưới, mọi biến màu thành rỗng và cả trang ra đen trắng.
 * Không có lỗi nào trong console — CSS hỏng thì im lặng bỏ qua, không kêu.
 *
 * Sửa ở đây là cả hai trang đổi theo — đó là điểm của việc tách file.
 */

  /* Nền phải TÁCH hẳn khỏi thẻ. Bản đầu dùng #eef1f5 với #fbfcfd — chênh nhau
     quá ít nên cả trang đọc thành một mảng trắng phẳng không thấy đâu là khối. */
  :root {
    color-scheme: light;
    --plane: #eef1f6; --card: #ffffff; --raise: #f3f5f9; --sunken: #f5f7fa;
    --ink: #0f172a; --ink-2: #475569; --ink-3: #94a3b8;
    --grid: #eef1f5; --rule: #dbe1ea; --hairline: rgba(15, 23, 42, .07);
    --series-1: #4f46e5; --wash: rgba(79, 70, 229, .09);
    --good: #16a34a; --warning: #d99408; --serious: #ea6c3a; --critical: #dc2626;
    --chip: rgba(15, 23, 42, .05);
    --elev: 0 1px 2px rgba(15, 23, 42, .05), 0 2px 8px rgba(15, 23, 42, .05);
    --elev-hi: 0 8px 24px rgba(15, 23, 42, .11);
  }
  /* ── Thang chữ ──────────────────────────────────────────────────────────
     BẢY cỡ, không hơn. Thêm một cỡ nữa là thêm một cấp mà mắt không phân biệt
     nổi với cấp bên cạnh, và mọi thứ lại trông như đang cãi nhau.

       fs-1  nhãn VIẾT HOA, chú thích nhỏ nhất
       fs-2  chữ phụ / mờ
       fs-3  bảng, nút, ô chọn
       fs-4  chữ thường
       fs-5  số nổi (đồng hồ, số trang, giá trị dải canh gác)
       fs-6  số KPI, tiêu đề trang
       fs-7  số KPI hero — chỉ dùng đúng một chỗ
  */
  :root {
    --fs-1: 11px; --fs-2: 12.5px; --fs-3: 13.5px; --fs-4: 15px;
    --fs-5: 21px; --fs-6: 27px; --fs-7: 36px;
  }

  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane: #0a0c10; --card: #15181e; --raise: #1c2128; --sunken: #12151a;
      --ink: #f1f5f9; --ink-2: #aab4c2; --ink-3: #6b7484;
      --grid: #23272f; --rule: #313742; --hairline: rgba(255, 255, 255, .08);
      --series-1: #7c7cf5; --wash: rgba(124, 124, 245, .13);
      --chip: rgba(255, 255, 255, .06);
      --elev: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
      --elev-hi: 0 10px 28px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0a0c10; --card: #15181e; --raise: #1c2128; --sunken: #12151a;
    --ink: #f1f5f9; --ink-2: #aab4c2; --ink-3: #6b7484;
    --grid: #23272f; --rule: #313742; --hairline: rgba(255, 255, 255, .08);
    --series-1: #7c7cf5; --wash: rgba(124, 124, 245, .13);
    --chip: rgba(255, 255, 255, .06);
    --elev: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
    --elev-hi: 0 10px 28px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: var(--fs-4); line-height: 1.55;
    -webkit-font-smoothing: antialiased; }
  /* 1200px trên màn 1440+ để lại hai dải trắng rộng bằng cả một cột bảng, mà
     bảng chỗ cắm bên trong thì phải cuộn ngang. Nới trần và cho padding co
     giãn theo màn: rộng thì dùng hết, hẹp thì vẫn không dính mép. */
  .wrap { max-width: 1560px; margin: 0 auto; padding: 34px clamp(16px, 3vw, 40px) 72px;
    display: flex; flex-direction: column; gap: 18px; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: var(--fs-6); font-weight: 680; margin: 0; letter-spacing: -.02em; }

  /* Điều hướng giữa bảng vận hành và trang biểu đồ */
  .nav { display: flex; gap: 4px; margin-top: 9px; }
  .nav a { font-size: var(--fs-3); font-weight: 600; text-decoration: none; padding: 5px 12px; border-radius: 999px;
    color: var(--ink-2); background: transparent; border: 1px solid transparent; }
  .nav a:hover { background: var(--chip); color: var(--ink); }
  .nav a[aria-current] { background: var(--wash); color: color-mix(in srgb, var(--series-1) 70%, var(--ink));
    border-color: color-mix(in srgb, var(--series-1) 26%, transparent); }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  /* Dòng phạm vi dưới tiêu đề: "12/08 – 16/08 · 5 ngày · tất cả mọi người".
     Viết ra thay vì bắt người đọc nhìn ngược lên thanh lọc rồi tự ghép lại. */
  .scope { font-size: var(--fs-3); color: var(--ink-2); margin-top: 3px; }
  .scope b { color: var(--ink); font-weight: 660; font-variant-numeric: tabular-nums; }

  /* ── Dấu thời gian ────────────────────────────────────────────────────
     Chỗ này TỪNG là đồng hồ chạy từng giây. Nó nhấp nháy ngay cạnh badge phán
     quyết, mà chuyển động luôn thắng màu sắc ở tầm nhìn ngoại vi — con số quan
     trọng nhất trên trang bị chính cái đồng hồ trang trí giành mất chỗ.
     Giờ chỉ nhích khi có dữ liệu MỚI, và chấm nhịp là thứ duy nhất còn động. */
  .stamp { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-2);
    color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .stamp b { color: var(--ink-2); font-weight: 640; }
  .stamp.stale { color: var(--warning); }
  .stamp.stale b { color: var(--warning); }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); animation: livepulse 2.4s infinite; }
  .live.off { background: var(--ink-3); animation: none; }
  @keyframes livepulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .live { animation: none; } }

  /* Nhãn tầng — mốc phân cấp CAO hơn tiêu đề thẻ, để mắt biết đang ở khu nào */
  .zone { font-size: var(--fs-2); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); margin: 14px 2px 2px; display: flex; align-items: center; gap: 10px; }
  .zone::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .zone .n { color: var(--ink-3); font-weight: 600; }

  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px; box-shadow: var(--elev);
    transition: box-shadow .16s ease, transform .16s ease; }
  .pad { padding: 16px 18px; }
  h2 { font-size: var(--fs-1); font-weight: 680; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 13px; display: flex; align-items: baseline; gap: 7px; }
  h2 .n { font-size: var(--fs-1); color: var(--ink-3); font-weight: 600; letter-spacing: 0; text-transform: none; }

  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  /* Ô đầu rộng hơn vì nó là ô hero. Năm cột từ khi tách "Lỗi" ra riêng — gộp
     vào ô "Lượt gọi" thì con số cần nhìn nhất lại nằm ở dòng chú thích mờ.

     NĂM thẻ, nên điểm gãy phải chọn theo ước số của 5, không theo con số nào
     nghe hợp lý. Bản trước rơi xuống 3 cột: 5 thẻ thành hàng 3 + hàng 2, để lại
     một khoảng trống bằng cả một thẻ ở góc dưới phải — mắt đọc khoảng trống đó
     thành "còn một ô nữa chưa tải xong". Hai cột với ô hero ăn trọn hàng đầu
     thì mọi hàng đều đầy ở mọi bề rộng. */
  .g4 { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1240px) {
    .g4 { grid-template-columns: repeat(2, 1fr); }
    .g4 .hero { grid-column: 1 / -1; }
  }
  @media (max-width: 920px) { .g2 { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .g4 { grid-template-columns: 1fr; } }

  /* ── Phán quyết + dải trạng thái (Tầng 1) ── */
  .verdict { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; font-size: var(--fs-3);
    padding: 8px 16px 8px 13px; border-radius: 999px;
    background: color-mix(in srgb, var(--sev) 12%, var(--card));
    border: 1px solid color-mix(in srgb, var(--sev) 30%, transparent);
    color: color-mix(in srgb, var(--sev) 55%, var(--ink)); box-shadow: var(--elev); }
  .verdict .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sev);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--sev) 22%, transparent); }
  .statusbar { display: flex; flex-wrap: wrap; padding: 0; overflow: hidden; }
  .statusbar .item { flex: 1 1 220px; display: flex; gap: 12px; align-items: flex-start; padding: 15px 18px;
    background: color-mix(in srgb, var(--sev) 4%, var(--card));
    border-left: 3px solid var(--sev); border-top: 1px solid var(--hairline); }
  .statusbar .item:first-child { border-top: 0; }
  @media (min-width: 720px) { .statusbar .item { border-top: 0; border-right: 1px solid var(--hairline); }
    .statusbar .item:last-child { border-right: 0; } }
  .statusbar .ic { color: var(--sev); font-size: var(--fs-2); line-height: 1.7; }
  .statusbar .k { font-size: var(--fs-2); color: var(--ink-3); font-weight: 500; }
  .statusbar .v { font-size: var(--fs-4); font-weight: 660; letter-spacing: -.01em; margin-top: 1px; }
  .statusbar .d { font-size: var(--fs-2); color: var(--ink-2); margin-top: 2px; }

  /* ── KPI (Tầng 2) ── */
  .kpi { padding: 15px 17px; display: flex; flex-direction: column; }
  .kpi:hover { box-shadow: var(--elev-hi); transform: translateY(-2px); }
  .kpi .k { font-size: var(--fs-2); color: var(--ink-3); font-weight: 500; }
  .kpi .v { font-size: var(--fs-6); font-weight: 680; letter-spacing: -.025em; line-height: 1.1; margin-top: 4px; }
  .kpi .d { font-size: var(--fs-2); color: var(--ink-3); margin-top: auto; padding-top: 4px; }
  .kpi.hero { background:
      linear-gradient(150deg, color-mix(in srgb, var(--series-1) 13%, var(--card)), color-mix(in srgb, var(--series-1) 3%, var(--card)));
    border-color: color-mix(in srgb, var(--series-1) 22%, transparent); }
  .kpi.hero .v { font-size: var(--fs-7); color: color-mix(in srgb, var(--series-1) 72%, var(--ink)); }
  .kpi .v small { font-size: .68em; font-weight: 640; color: var(--ink-2); letter-spacing: 0; }

  /* Ô bảng trước đây chỉ có đệm PHẢI (`7px 10px 7px 0`), nên cột này chạm sát
     chữ cột kia — ở bảng chỗ cắm 7 cột thì đọc thành một dải chữ liền. Đệm đều
     hai bên, và `.scroll table` có bề rộng tối thiểu để màn hẹp thì cuộn ngang
     chứ không bóp các cột dí vào nhau. */
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-3); }
  th { text-align: left; font-weight: 600; font-size: var(--fs-1); letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink-3); padding: 0 14px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.nw, th.nw { white-space: nowrap; }
  tbody tr:hover td { background: var(--sunken); }
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 560px; }
  .scroll table.wide { min-width: 940px; }
  .dim { color: var(--ink-2); }

  /* Nhãn phụ dưới giá trị chính trong một ô — client_id dưới tên ứng dụng.
     Xuống dòng riêng thay vì nối đuôi: chuỗi băm 22 ký tự đứng cạnh chữ
     "Claude" thì mắt không tách nổi đâu là tên app, đâu là mã. */
  .sub { display: block; font-size: var(--fs-2); color: var(--ink-3); margin-top: 2px;
    max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Nút thao tác trong bảng — mờ lúc bình thường, rõ khi rê vào đúng dòng, để
     một bảng dùng để ĐỌC không biến thành bãi nút bấm. */
  .btn { font: inherit; font-size: var(--fs-2); font-weight: 600; line-height: 1; cursor: pointer;
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--hairline);
    background: var(--card); color: var(--ink-2); }
  .btn:hover { background: var(--raise); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.danger:hover { border-color: color-mix(in srgb, var(--critical) 40%, transparent);
    color: var(--critical); background: color-mix(in srgb, var(--critical) 8%, var(--card)); }
  .btn.ghost { border-color: transparent; background: transparent; }
  td .btn { opacity: .35; transition: opacity .14s ease; }
  tbody tr:hover td .btn, td .btn:focus-visible { opacity: 1; }
  @media (hover: none) { td .btn { opacity: 1; } }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-1); font-weight: 600;
    padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sev, var(--ink-3)); flex: none; }
  .tag { font-size: var(--fs-1); padding: 3px 7px; border-radius: 5px; background: var(--chip); color: var(--ink-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .legend { display: flex; gap: 13px; margin-bottom: 8px; font-size: var(--fs-2); color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* Trạng thái rỗng — nói rõ "không có gì để xử lý" thay vì để trống khó hiểu */
  .ok-empty { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: var(--fs-3); padding: 4px 0 2px; }
  .ok-empty .ic { color: var(--good); font-size: var(--fs-4); }

  #tip { position: fixed; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 90ms;
    background: var(--ink); color: var(--card); font-size: var(--fs-2); padding: 6px 9px; border-radius: 6px; max-width: 250px; }
  #tip.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #tip { transition: none; } .card { transition: none; } }

/* ── Ô điều khiển (trang Biểu đồ) ────────────────────────────────────────
   Thanh chọn nằm NGANG và luôn hiện, không giấu sau menu: cả trang chỉ có một
   việc là "đổi cách nhìn", giấu chính cái cần bấm đi thì trang mất lý do tồn tại. */
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: var(--fs-1); font-weight: 680; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.field select {
  font: inherit; font-size: var(--fs-4); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 9px; padding: 9px 34px 9px 12px; cursor: pointer;
  /* Mũi tên vẽ bằng gradient — không nhúng ảnh, không gọi ra ngoài (CSP của
     Vercel chặn host ngoài, mà bản preview thì không có mạng để mà gọi). */
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.field select:hover { border-color: var(--ink-3); }
.field select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

/* Nhóm nút một-lựa-chọn — dùng cho kiểu biểu đồ và cửa sổ ngày, nơi chỉ có
   2–3 giá trị. Bày hết ra rẻ hơn một lần bấm để mở danh sách. */
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-size: var(--fs-3); font-weight: 600; cursor: pointer; white-space: nowrap;
  padding: 6px 13px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-2); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--elev); }
/* Khoá ≠ hỏng. Mờ đi và đổi con trỏ để thấy NGAY là nút này cố tình không bấm
   được — bản tĩnh dùng tới (xem lockGlobalFilters). Vẫn giữ nền cho ô đang
   chọn, vì nó còn nhiệm vụ nói "đây là khoảng bạn đang xem". */
.seg button:disabled, .cal-btn:disabled, .mini:disabled { cursor: not-allowed; opacity: .55; }
.seg button:disabled:hover { color: var(--ink-2); }
.cal-btn:disabled:hover, .mini:disabled:hover { border-color: var(--rule); }

.chk { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-3); color: var(--ink-2); cursor: pointer; padding-bottom: 9px; }
.chk input { width: 16px; height: 16px; accent-color: var(--series-1); cursor: pointer; }

.spacer { flex: 1 1 auto; }

/* Dải tóm tắt dưới thanh chọn: nói rõ đang nhìn bao nhiêu dòng, trong bao lâu.
   Không có nó thì một biểu đồ trống đọc thành "hệ thống chết" thay vì
   "khoảng thời gian này không có dữ liệu". */
.summary { display: flex; flex-wrap: wrap; gap: 20px; font-size: var(--fs-3); color: var(--ink-2); }
.summary b { color: var(--ink); font-weight: 660; font-variant-numeric: tabular-nums; }

/* ── Chuyển trang dưới đáy bảng ──────────────────────────────────────────
   Chỉ hiện khi bảng thật sự tràn — "Trang 1/1" là một dòng chữ không nói gì. */
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 14px;
  margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--grid); font-size: var(--fs-3); }

/* Danh sách ứng dụng trong MỘT ô: xuống dòng thay vì kéo dài cột. Cao quá thì

.chips { display: flex; flex-wrap: wrap; gap: 5px; max-height: 52px; overflow-y: auto; }

/* Ô Canary trong dải canh gác bấm được để mở bảng probe ngay dưới. */
.statusbar .item[role="button"] { cursor: pointer; }
.statusbar .item[role="button"]:hover { background: color-mix(in srgb, var(--sev) 9%, var(--card)); }
.statusbar .item[role="button"]:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
.statusbar .k .more { margin-left: 8px; font-size: var(--fs-1); font-weight: 700; letter-spacing: .04em;
  color: color-mix(in srgb, var(--series-1) 75%, var(--ink-3)); }

/* Số trang: to và rõ, vì đó là thứ mắt tìm khi bấm qua lại. */
.pnum { font-size: var(--fs-4); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pnum b { font-size: var(--fs-5); font-weight: 700; color: var(--ink); }

/* Nhóm nút nhỏ đặt ngay trong tiêu đề thẻ — cùng dòng với chữ, không đội thêm
   một hàng điều khiển riêng cho mỗi biểu đồ. */
.seg-sm { padding: 2px; border-radius: 7px; }
.seg-sm button { font-size: var(--fs-2); font-weight: 650; padding: 4px 9px; border-radius: 5px;
  text-transform: none; letter-spacing: 0; }
h2 .seg-sm { align-self: center; }

/* ══ Thanh lọc toàn cục ═══════════════════════════════════════════════════
   DÍNH lên đỉnh màn hình. Không phải hiệu ứng cho vui: đổi bộ lọc trong lúc
   đang nhìn kết quả là thao tác chính của trang, mà thanh lọc trôi mất khi cuộn
   thì mỗi lần đổi phải cuộn lên, bấm, cuộn xuống — và tới lúc nhìn lại thì đã
   quên mất con số cũ để mà so.

   Âm lề hai bên đúng bằng padding của .wrap: thiếu nó thì lúc dính, nội dung
   cuộn qua sẽ lộ ra ở hai dải mép trái/phải ngay cạnh thanh. */
.filterbar { position: sticky; top: 0; z-index: 25;
  margin: 0 calc(-1 * clamp(16px, 3vw, 40px)); padding: 10px clamp(16px, 3vw, 40px);
  display: flex; flex-direction: column; gap: 8px;
  background: color-mix(in srgb, var(--plane) 82%, transparent);
  border-bottom: 1px solid transparent; transition: border-color .18s ease, box-shadow .18s ease; }
@supports (backdrop-filter: blur(1px)) {
  .filterbar { backdrop-filter: saturate(1.6) blur(12px); }
}
/* Viền + bóng CHỈ khi đã dính. Lúc trang chưa cuộn thì nó là một thẻ như mọi
   thẻ khác — kẻ sẵn đường ngang ở đó là thêm một nét chia chưa có gì để chia. */
/* `--rule` chứ không `--hairline`: hairline là 7% mờ, đủ để chia hai thẻ nằm
   yên cạnh nhau nhưng KHÔNG đủ khi có cả một trang chữ trôi qua ngay dưới —
   lúc đó thanh trông như dán đè lên nội dung chứ không phải nổi lên trên nó. */
.filterbar.stuck { border-bottom-color: var(--rule); box-shadow: 0 8px 20px -16px rgba(0, 0, 0, .65); }

.fb { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 14px; }
/* `flex-wrap` ở ĐÂY nữa, không chỉ ở .fb: nhóm "Khoảng" chứa dải bốn mốc cộng
   nút lịch, tổng ~370px. Trên màn 390px nó không xuống dòng được mà thò hẳn ra
   ngoài khung, kéo theo cả trang cuộn ngang. */
.fb-grp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.fb-lb { font-size: var(--fs-1); font-weight: 680; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); white-space: nowrap; }
/* Ô chọn trong thanh lọc thấp hơn ô chọn trong thẻ: thanh này luôn nằm trên
   màn hình nên mỗi pixel chiều cao của nó là một pixel vĩnh viễn mất đi. */
.mini { font: inherit; font-size: var(--fs-3); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 8px; padding: 6px 28px 6px 10px; cursor: pointer;
  max-width: 210px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 14px) 53%, calc(100% - 10px) 53%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.mini:hover { border-color: var(--ink-3); }
.mini:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

/* ── Co lại trên màn hẹp ──────────────────────────────────────────────────
   Thanh này DÍNH, nên mỗi pixel chiều cao của nó là một pixel mất vĩnh viễn
   khỏi phần đọc. Đo ở 782px: ba hàng, 137px — hơn 20% một màn 678px, chỉ để
   bày ba cái nút.

   Bỏ nhãn trước tiên vì chúng là thứ thừa nhất: ô chọn đã tự ghi "Tất cả mọi
   người" và "Tất cả ứng dụng", còn dải mốc thì ghi thẳng "7 ngày". Chữ
   "NGƯỜI" đứng cạnh ô ghi "Tất cả mọi người" không thêm được gì. */
@media (max-width: 1100px) {
  .fb-lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .fb { gap: 8px 12px; }
  /* Dưới ngưỡng này ba nhóm không còn đứng chung một hàng, nên phải chọn CÁCH
     xuống hàng thay vì để trình duyệt chọn hộ. Bản trước để mặc: ra hàng đầu
     [khoảng][người], hàng hai [ứng dụng] lửng lơ một mình — vẫn hai hàng, vẫn
     đúng bằng đó chiều cao, nhưng nhìn như bị vỡ. Cho khoảng ăn trọn hàng đầu
     thì hai ô chọn thành một cặp cân nhau ở hàng dưới. */
  .fb-grp:first-child { flex: 1 0 100%; }
  .fb-grp:has(.mini) { flex: 1 1 150px; }
  .mini { width: 100%; max-width: none; }
}
@media (max-width: 700px) {
  /* THÔI DÍNH trên điện thoại.
     Thanh dính đáng giá khi đổi xong còn nhìn thấy kết quả ngay — trên màn hẹp
     nó xuống ba hàng, cao 250px, và đó là 40% một màn điện thoại bị chiếm chỗ
     vĩnh viễn để bày đúng ba cái nút. Ở đây cuộn lên đầu trang mới là cách
     người ta thật sự dùng, và nó không tốn gì cả. */
  .filterbar { position: static; padding: 8px clamp(16px, 3vw, 40px); backdrop-filter: none; background: transparent; }
  .filterbar.stuck { border-bottom-color: transparent; box-shadow: none; }
  .fb { padding: 8px 10px; }
  .seg button { padding: 6px 10px; }
}
/* Bốn mốc trên một hàng là ~250px — trên điện thoại thì cho chúng tự xuống
   dòng, còn hơn để dải nút đẩy nút lịch ra khỏi màn hình. */
@media (max-width: 560px) { .seg { flex-wrap: wrap; } }
/* Chỉ hiện khi có gì BẤT NGỜ cần nói — khoảng vừa bị kẹp biên, hoặc bộ lọc ứng
   dụng đang âm thầm bỏ qua đống dòng ghi trước khi cột đó tồn tại. */
.fb-note { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--fs-2); color: var(--warning);
  padding: 0 4px; }

/* ── Nút mở lịch ──────────────────────────────────────────────────────────
   ĐỨNG CẠNH các mốc sẵn, không thay chúng: "30 ngày" là một cú bấm, còn qua
   lịch là mở, định vị tháng, bấm hai đầu — bốn thao tác cho đúng thứ mà hầu
   hết lượt mở trang cần. */
.calwrap { position: relative; }
.cal-btn { font: inherit; font-size: var(--fs-3); font-weight: 600; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 9px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.cal-btn .cal-ic { font-size: var(--fs-2); color: var(--ink-3); }
/* Đang dùng khoảng tay thì nút này CHÍNH LÀ ô đang chọn — phải nhìn ra ngay,
   không thì dải mốc sẵn bên cạnh trông như không có cái nào được chọn cả. */
.cal-btn.on { border-color: color-mix(in srgb, var(--series-1) 45%, transparent);
  background: var(--wash); color: color-mix(in srgb, var(--series-1) 70%, var(--ink)); }
.cal-btn.on .cal-ic { color: inherit; }

.cal { position: absolute; z-index: 40; top: calc(100% + 8px); left: 0;
  background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: var(--elev-hi); padding: 12px; min-width: 300px; }
/* Gần mép phải màn thì thả về bên phải, không thì lịch tràn ra ngoài khung. */
@media (max-width: 700px) { .cal { left: auto; right: 0; } }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.cal-nav .btn { padding: 4px 10px; }
.cal-hint { font-size: var(--fs-2); font-weight: 640; color: var(--ink-2); }
.cal-ms { display: flex; gap: 18px; }
/* Một tháng trên màn hẹp. Hai tháng cạnh nhau là 560px bề ngang — trên điện
   thoại nó đẩy nửa cái lịch ra ngoài màn hình. */
@media (max-width: 700px) { .cal-ms > .cal-m + .cal-m { display: none; } }
.cal-mh { font-size: var(--fs-2); font-weight: 680; color: var(--ink); text-align: center; margin-bottom: 6px; }
.cal-g { display: grid; grid-template-columns: repeat(7, 32px); gap: 1px; }
.cal-dow { font-size: var(--fs-1); color: var(--ink-3); text-align: center; padding-bottom: 4px; font-weight: 640; }
.cal-d { font: inherit; font-size: var(--fs-2); font-variant-numeric: tabular-nums; cursor: pointer;
  height: 30px; border: 0; background: transparent; color: var(--ink-2); border-radius: 0; }
.cal-d:hover:not(:disabled) { background: var(--raise); color: var(--ink); }
.cal-d:disabled { color: color-mix(in srgb, var(--ink-3) 45%, transparent); cursor: default; }
/* Dải liền mạch giữa hai đầu: bo góc chỉ ở hai đầu, ô giữa để vuông. Bo hết
   thì dải đứt thành một chuỗi viên thuốc rời và không đọc ra là một khoảng. */
.cal-d.in { background: var(--wash); color: color-mix(in srgb, var(--series-1) 70%, var(--ink)); }
.cal-d.e0 { border-radius: 8px 0 0 8px; }
.cal-d.e1 { border-radius: 0 8px 8px 0; }
.cal-d.e0.e1 { border-radius: 8px; }
.cal-d.e0, .cal-d.e1 { background: var(--series-1); color: #fff; font-weight: 700; }
/* Hôm nay có một chấm dưới chân — mốc định vị duy nhất trong một lưới toàn số. */
.cal-d.now { box-shadow: inset 0 -3px 0 -1px color-mix(in srgb, var(--series-1) 55%, transparent); }
.cal-d.now.e0, .cal-d.now.e1 { box-shadow: none; }
.cal-ft { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 9px;
  border-top: 1px solid var(--grid); font-size: var(--fs-2); }

/* ── Ô điều khiển của RIÊNG thẻ biểu đồ ───────────────────────────────────
   Nằm trong thẻ nó điều khiển, không leo lên thanh lọc chung. Đưa lên đó là
   tái phạm đúng lỗi cũ theo chiều ngược lại: một thanh trông như lọc cả trang
   nhưng có nút chỉ đổi được một khối. */
.cc { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 14px; }
.cc .field select { font-size: var(--fs-3); padding: 7px 30px 7px 11px; }

/* Rỗng vì KHÔNG CÓ GÌ hay rỗng vì lọc quá tay? Hai chuyện khác nhau, và câu thứ
   hai có cách sửa ngay tại chỗ — nên trạng thái rỗng phải kèm được một cái nút. */
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  color: var(--ink-2); font-size: var(--fs-3); padding: 34px 0 30px; }
.empty-t { font-size: var(--fs-4); }

/* Đang đi lấy số: làm mờ TẠI CHỖ. Thay nội dung bằng chữ "Đang tính…" là thẻ

.busy #chart-card, .busy #kpi, .busy .statusbar, #chart-card.one-busy {
